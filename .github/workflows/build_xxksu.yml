name: Build (GKI & Sultan) with xxKSU

on:
  workflow_dispatch:

jobs:
  # ===========================================================================
  # JOB 1: GKI BUILD (Kleaf)
  # ===========================================================================
  build-gki:
    runs-on: ubuntu-latest
    name: xxKSU | GKI Kleaf
    
    env:
      ANDROID_VERSION: "android14"
      KERNEL_VERSION: "6.1"
      SUB_LEVEL: "134"
      OS_PATCH_LEVEL: "2025-05"
      BUILD_CONFIG: "common/build.config.gki.aarch64"
      
    steps:
      - name: Free Disk Space
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/yapixel/kernel_patches/refs/heads/dev/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            zip ccache curl git wget cpio python3 python3-pip device-tree-compiler \
            kmod dwarves pahole repo openjdk-11-jdk lz4 python3-setuptools \
            openjdk-17-jdk libncurses5-dev

      - name: Install Repo
        run: |
          mkdir -p ./bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo > ./bin/repo
          chmod a+rx ./bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          CONFIG="${ANDROID_VERSION}-${KERNEL_VERSION}-${SUB_LEVEL}"
          BRANCH="common-${ANDROID_VERSION}-${KERNEL_VERSION}-${OS_PATCH_LEVEL}"
          mkdir -p "$CONFIG"
          cd "$CONFIG"
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b $BRANCH --repo-rev=v2.16
          repo sync -c -j$(nproc --all) --no-tags
          echo "kernel_root=$PWD" >> $GITHUB_ENV
          echo "kernel_common=$PWD/common" >> $GITHUB_ENV

      - name: Clone Tools & Patches
        run: |
          cd ${{ env.kernel_root }}
          
          # AnyKernel3
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "gki-2.0" AnyKernel3
          
          # Patches
          git clone --depth=1 https://github.com/TheSillyOk/kernel_ls_patches ok_patches
          git clone --depth=1 https://github.com/yapixel/kernel_patches yapixel_patches
          
          # Version Extraction Scripts
          git clone --depth=1 https://github.com/TheSillyOk/sh sh

      - name: Apply GKI Optimization Patches
        run: |
          cd ${{ env.kernel_common }}
          YP_DIR="${{ env.kernel_root }}/yapixel_patches/common"
          
          patch -p1 --forward < "$YP_DIR/optimized_mem_operations.patch" || true
          patch -p1 --forward < "$YP_DIR/file_struct_8bytes_align.patch" || true
          patch -p1 --forward < "$YP_DIR/reduce_cache_pressure.patch" || true
          
          cp "$YP_DIR/clear_page_16bytes_align.patch" ./
          sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' clear_page_16bytes_align.patch > clear_page_16bytes_align__pi.patch
          patch -p1 -F3 --forward < clear_page_16bytes_align__pi.patch || true

      - name: Apply Sultan Hook Patch (v1.6)
        run: |
          cd ${{ env.kernel_common }}
          patch -p1 -F 3 < "${{ env.kernel_root }}/ok_patches/sultan/scope-min-hooks-v1.6.patch"

      - name: Setup xxKSU
        run: |
          cd ${{ env.kernel_common }}
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s -- master

      - name: Get xxKSU Version
        run: |
          cd ${{ env.kernel_root }}
          KSU_VER=$(./sh/extract_ksuver.sh "https://github.com/backslashxx/KernelSU" "kernel/Makefile" "." "master" || echo "unknown")
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV

      - name: Configure GKI Fragment
        run: |
          cd ${{ env.kernel_common }}
          
          cat > gki_fragment.config << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KRETPROBES_SUCOMPAT=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=n
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG=bbr
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_LIST_SET=y
          EOF
          
          echo "CONFIG_LOCALVERSION=\"-xxKSU-GKI\"" >> gki_fragment.config

      - name: Build with Kleaf
        run: |
          cd ${{ env.kernel_root }}
          
          cat > .build_config_local << EOF
          BUILD_CONFIG=${{ env.BUILD_CONFIG }}
          GKI_CONFIG_FRAGMENT=common/gki_fragment.config
          KLEAF_CHECK_ABI=false
          LTO=thin
          EOF
          
          tools/bazel run --config=fast --lto=thin //common:kernel_aarch64_dist

      - name: Package
        run: |
          cd ${{ env.kernel_root }}
          cp out/kernel_aarch64/dist/Image.lz4 AnyKernel3/Image
          
          ZIP_NAME="GKI-${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}-xxKSU-r${{ env.KSU_VER }}.zip"
          
          cd AnyKernel3
          # SAVE ZIP TO GITHUB WORKSPACE (Absolute Path)
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x "*.git*" "README.md"
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

  # ===========================================================================
  # JOB 2: SULTAN BUILD (GCC/Make)
  # ===========================================================================
  build-sultan:
    runs-on: ubuntu-latest
    name: xxKSU | Sultan
    
    env:
      KERNEL_CODENAME: "zuma"
      KERNEL_VERSION: "6.1.134"
      
    steps:
      - name: Download GCC 14.2.0
        run: |
          wget -q https://kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz -O gcc.tar.gz
          tar -xf gcc.tar.gz
          echo "GCC_PATH=$PWD/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-" >> $GITHUB_ENV

      - name: Clone Source & Deps
        run: |
          # Kernel
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_zuma sultan
          
          # Deps
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "sultan-zuma" AK3
          git clone --depth=1 https://github.com/TheSillyOk/kernel_ls_patches ok_patches
          
          # Version Extraction Scripts
          git clone --depth=1 https://github.com/TheSillyOk/sh sh
          
          echo "kernel_dir=$PWD/sultan" >> $GITHUB_ENV
          echo "ok_dir=$PWD/ok_patches" >> $GITHUB_ENV

      - name: Get xxKSU Version
        run: |
          KSU_VER=$(./sh/extract_ksuver.sh "https://github.com/backslashxx/KernelSU" "kernel/Makefile" "." "master" || echo "unknown")
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV

      - name: Setup Configs & Patches
        run: |
          cd ${{ env.kernel_dir }}
          
          # Apply Sultan Hook Patch (v1.6)
          patch -p1 -F 3 < "${{ env.ok_dir }}/sultan/scope-min-hooks-v1.6.patch"
          
          # Configs
          DEFCONFIG="arch/arm64/configs/zuma_defconfig"
          
          # Apply configs from build_kernels.yml
          configs="CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y CONFIG_IP_NF_TARGET_TTL=y CONFIG_IP6_NF_TARGET_HL=y CONFIG_IP6_NF_MATCH_HL=y CONFIG_TCP_CONG_ADVANCED=y CONFIG_TCP_CONG_BBR=y CONFIG_NET_SCH_FQ=y CONFIG_TCP_CONG_BIC=n CONFIG_TCP_CONG_WESTWOOD=n CONFIG_TCP_CONG_HTCP=n CONFIG_DEFAULT_BBR=y CONFIG_BPF_STREAM_PARSER=y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y CONFIG_NETFILTER_XT_SET=y CONFIG_IP_SET=y CONFIG_IP_SET_MAX=65534 CONFIG_IP_SET_BITMAP_IP=y CONFIG_IP_SET_BITMAP_IPMAC=y CONFIG_IP_SET_BITMAP_PORT=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_IPMARK=y CONFIG_IP_SET_HASH_IPPORT=y CONFIG_IP_SET_HASH_IPPORTIP=y CONFIG_IP_SET_HASH_IPPORTNET=y CONFIG_IP_SET_HASH_IPMAC=y CONFIG_IP_SET_HASH_MAC=y CONFIG_IP_SET_HASH_NETPORTNET=y CONFIG_IP_SET_HASH_NET=y CONFIG_IP_SET_HASH_NETNET=y CONFIG_IP_SET_HASH_NETPORT=y CONFIG_IP_SET_HASH_NETIFACE=y CONFIG_IP_SET_LIST_SET=y CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          
          for config in $configs; do
            name=$(echo "$config" | cut -d'=' -f1)
            sed -i -E "s/.*($name=.*)/# \1 is not set/gi" $DEFCONFIG
            echo "$config" >> $DEFCONFIG
          done
          
          # Add KSU Config
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          
          # Set Local Version
          sed -i 's/${LOCALVERSION+set}/set/' scripts/setlocalversion
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"/' $DEFCONFIG

      - name: Add xxKSU
        run: |
          cd ${{ env.kernel_dir }}
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s -- master

      - name: Build Kernel
        run: |
          cd ${{ env.kernel_dir }}
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"
          
          # Defconfig
          make O=out CROSS_COMPILE=${{ env.GCC_PATH }} CC=${{ env.GCC_PATH }}gcc zuma_defconfig
          
          # Build
          make O=out CROSS_COMPILE=${{ env.GCC_PATH }} CC=${{ env.GCC_PATH }}gcc -j$(nproc --all)

      - name: Package
        run: |
          cp ${{ env.kernel_dir }}/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat ${{ env.kernel_dir }}/out/google-devices/zuma/dts/*.dtb > AK3/dtb
          
          ZIP_NAME="Sultan-${{ env.KERNEL_VERSION }}-xxKSU-r${{ env.KSU_VER }}.zip"
          
          cd AK3
          # SAVE ZIP TO GITHUB WORKSPACE (Absolute Path)
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x "*.git*" "README.md"
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          
  # ===========================================================================
  # JOB 3: SULTAN BUILD with SUSFS (GCC/Make)
  # ===========================================================================
  build-sultan-susfs:
    runs-on: ubuntu-latest
    name: KowSU | Sultan
    
    env:
      KERNEL_CODENAME: "zuma"
      KERNEL_VERSION: "6.1.134"
      
    steps:
      - name: Download GCC 14.2.0
        run: |
          wget -q https://kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz -O gcc.tar.gz
          tar -xf gcc.tar.gz
          echo "GCC_PATH=$PWD/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-" >> $GITHUB_ENV

      - name: Clone Source & Deps
        run: |
          # Kernel
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_zuma sultan
          
          # Deps
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "sultan-zuma" AK3
          git clone --depth=1 https://github.com/TheSillyOk/kernel_ls_patches ok_patches
          git clone --depth=1 https://github.com/yapixel/kernel_patches yp_patches
          SUSFS_BRANCH="gki-android14-6.1-dev"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          
          # Version Extraction Scripts
          git clone --depth=1 https://github.com/TheSillyOk/sh sh
          
          echo "kernel_dir=$PWD/sultan" >> $GITHUB_ENV
          echo "ok_dir=$PWD/ok_patches" >> $GITHUB_ENV
          echo "yp_dir=$PWD/yp_patches" >> $GITHUB_ENV

      - name: Get KowSU Version
        run: |
          KSU_VER=$(./sh/get_ksuver.sh "KOWX712" "KernelSU" "master" || echo "unknown")
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV

      - name: Setup Configs & Patches
        run: |
          cd ${{ env.kernel_dir }}
          
          # Configs
          DEFCONFIG="arch/arm64/configs/zuma_defconfig"
          
          # Apply configs from build_kernels.yml
          configs="CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y CONFIG_IP_NF_TARGET_TTL=y CONFIG_IP6_NF_TARGET_HL=y CONFIG_IP6_NF_MATCH_HL=y CONFIG_TCP_CONG_ADVANCED=y CONFIG_TCP_CONG_BBR=y CONFIG_NET_SCH_FQ=y CONFIG_TCP_CONG_BIC=n CONFIG_TCP_CONG_WESTWOOD=n CONFIG_TCP_CONG_HTCP=n CONFIG_DEFAULT_BBR=y CONFIG_BPF_STREAM_PARSER=y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y CONFIG_NETFILTER_XT_SET=y CONFIG_IP_SET=y CONFIG_IP_SET_MAX=65534 CONFIG_IP_SET_BITMAP_IP=y CONFIG_IP_SET_BITMAP_IPMAC=y CONFIG_IP_SET_BITMAP_PORT=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_IPMARK=y CONFIG_IP_SET_HASH_IPPORT=y CONFIG_IP_SET_HASH_IPPORTIP=y CONFIG_IP_SET_HASH_IPPORTNET=y CONFIG_IP_SET_HASH_IPMAC=y CONFIG_IP_SET_HASH_MAC=y CONFIG_IP_SET_HASH_NETPORTNET=y CONFIG_IP_SET_HASH_NET=y CONFIG_IP_SET_HASH_NETNET=y CONFIG_IP_SET_HASH_NETPORT=y CONFIG_IP_SET_HASH_NETIFACE=y CONFIG_IP_SET_LIST_SET=y CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          
          for config in $configs; do
            name=$(echo "$config" | cut -d'=' -f1)
            sed -i -E "s/.*($name=.*)/# \1 is not set/gi" $DEFCONFIG
            echo "$config" >> $DEFCONFIG
          done
          
          # Add KSU Config
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          
          # Set Local Version
          sed -i 's/${LOCALVERSION+set}/set/' scripts/setlocalversion
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"/' $DEFCONFIG

      - name: Add KowSU
        run: |
          cd ${{ env.kernel_dir }}
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s -- master
      
      - name: Apply SUSFS Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Applying core SUSFS patches..."
          # Apply Sultan Hook Patch (v1.6)
          #patch -p1 -F 3 < "${{ env.ok_dir }}/sultan/scope-min-hooks-v1.6.patch"
          cp "${{ env.yp_dir }}"/kowsu/50_add_susfs_in_gki-android14-6.1.patch ./
          
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 --forward < 50_add_susfs_in_gki-android14-6.1.patch || true
          
          cp ../kernel_patches/sultan/sys.c_fix.patch ./
          patch -p1 --fuzz=3 < sys.c_fix.patch

          # Apply KSU integration patches
          cd ./KernelSU
          cp "${{ env.yp_dir }}"/kowsu/10_enable_susfs_for_ksu.patch ./
          patch -p1 --forward < 10_enable_susfs_for_ksu.patch
      
      

      - name: Build Kernel
        run: |
          cd ${{ env.kernel_dir }}
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"
          
          # Defconfig
          make O=out CROSS_COMPILE=${{ env.GCC_PATH }} CC=${{ env.GCC_PATH }}gcc zuma_defconfig
          
          # Build
          make O=out CROSS_COMPILE=${{ env.GCC_PATH }} CC=${{ env.GCC_PATH }}gcc -j$(nproc --all)

      - name: Package
        run: |
          cp ${{ env.kernel_dir }}/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat ${{ env.kernel_dir }}/out/google-devices/zuma/dts/*.dtb > AK3/dtb
          
          ZIP_NAME="Sultan-${{ env.KERNEL_VERSION }}-KowSU-r${{ env.KSU_VER }}-susfs.zip"
          
          cd AK3
          # SAVE ZIP TO GITHUB WORKSPACE (Absolute Path)
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x "*.git*" "README.md"
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}          

  # ===========================================================================
  # JOB 3: RELEASE
  # ===========================================================================
  release:
    needs: [build-gki, build-sultan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(date +"%Y.%m.%d")
          LATEST=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name' 2>/dev/null || echo "")
          if [[ "$LATEST" == "$TAG"* ]]; then
            REV=$(echo "$LATEST" | grep -o 'r[0-9]*$' | tr -d 'r')
            REV=$((REV + 1))
            TAG="${TAG}-r${REV}"
          else
            TAG="${TAG}-r1"
          fi
          git tag "$TAG" || true
          git push origin "$TAG" || true
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: xxKSU Build - ${{ env.TAG }}
          body: |
            **xxKSU Dual Build**
            - **Manager**: [backslashxx/KernelSU](https://github.com/backslashxx/KernelSU)
            - **Date**: ${{ env.TAG }}
            
            Contains both **GKI (Kleaf)** and **Sultan (GCC)** variants.
          files: |
            artifacts/**/*.zip
