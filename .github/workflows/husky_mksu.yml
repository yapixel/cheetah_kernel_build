name: Build Kernel with MKSU
on:
  workflow_dispatch:
    inputs:
      pixel8a:
        description: 'Enable Pixel 8a configuration (y/n)'
        required: false
        default: 'y'
      lto_type:
        description: 'LTO type (full/thin/none)'
        required: false
        default: 'thin'
      build_clean:
        description: 'Build clean mode (always/auto/never)'
        required: false
        default: 'always'

env:
  # Build configuration
  BUILD: dev
  PIXEL8A: ${{ github.event.inputs.pixel8a || 'y' }}
  LTO_TYPE: ${{ github.event.inputs.lto_type || 'thin' }}
  ZIP_PREFIX: AK3-A14-6.1.134-MKSU
  KERNEL_DIR: common
  CONFIG_FILE: arch/arm64/configs/gki_defconfig
  OUT_DIR: out
  KERNEL_TAG: android14-6.1-2025-05
  BUILD_CLEAN: ${{ github.event.inputs.build_clean || 'always' }}
  RETRY: 3
  REPO_DEPTH: 1
  KSU_BRANCH: main
  ANYKERNEL_DIR: AnyKernel3-p8a
  ANYKERNEL_BRANCH: gki-2.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  PATCHES_BRANCH: dev
  BUILDS_DIR: builds/6.1.134

  # Compiler
  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  LLVM_CACHE_PATH: ${{ github.workspace }}/.cache/llvm
  CLANG_REV: clang-r487747c

  # Reproducible identity
  KBUILD_BUILD_USER: build-user
  KBUILD_BUILD_HOST: build-host

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "THREADS=$(nproc)" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev libelf-dev \
          libncurses-dev zip ccache curl git wget cpio python3 \
          python3-pip device-tree-compiler kmod dwarves pahole

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: kernel-build-${{ env.LTO_TYPE }}
        max-size: 5G

    - name: Cache Clang 17.0.2
      uses: actions/cache@v3
      with:
        path: $HOME/clang
        key: clang-17.0.2-${{ env.CLANG_REV }}-${{ runner.os }}
        restore-keys: clang-17.0.2-${{ env.CLANG_REV }}-

    - name: Download and setup Clang 17.0.2
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        CLANG_REV="${{ env.CLANG_REV }}"
        CLANG_TAR="${CLANG_REV}.tar.gz"

        mkdir -p $HOME/clang
        cd $HOME/clang

        echo "Downloading Clang 17.0.2 (${CLANG_REV}) ..."
        wget -q \
          "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz" \
          -O "${CLANG_TAR}"

        tar -xzf "${CLANG_TAR}"
        rm -f "${CLANG_TAR}"

        echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
        echo "$HOME/clang/bin" >> $GITHUB_PATH
        which clang 
        clang --version | head -n1

    - name: Download ARM64 toolchain
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        wget https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
        tar -xf arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
        echo "ARM64_TOOLCHAIN=$HOME/toolchains/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

    - name: Download ARM32 toolchain
      run: |
        cd $HOME/toolchains
        wget https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        tar -xf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        echo "ARM32_TOOLCHAIN=$HOME/toolchains/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-" >> $GITHUB_ENV

    - name: Clone kernel source (android14-6.1-2025-05)
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/kernel/common \
          -b ${{ env.KERNEL_TAG }} \
          ${{ env.KERNEL_DIR }}

        cd ${{ env.KERNEL_DIR }}
        echo "Kernel tag: $(git describe --tags --exact-match 2>/dev/null || echo 'not a tag')"
        git log -1 --pretty='%s'

    - name: Setup repositories
      run: |
        git clone --depth=${{ env.REPO_DEPTH }} -b ${{ env.SUSFS_BRANCH }} ${{ env.SUSFS_REPO }} susfs4ksu
        git clone --depth=${{ env.REPO_DEPTH }} -b ${{ env.ANYKERNEL_BRANCH }} \
          https://github.com/deepongi-labs/${{ env.ANYKERNEL_DIR }} ${{ env.ANYKERNEL_DIR }}
        git clone https://github.com/yapixel/kernel_patches.git 
        
        
    - name: Prepare kernel source
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        git clean -fdx || true
        rm -rf KernelSU-Next || true

    - name: Configure Pixel 8a
      if: env.PIXEL8A == 'y'
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        cat >> "$CONFIG" << EOF
        CONFIG_ARM64_CORTEX_X3=y
        CONFIG_ARM64_CORTEX_A715=y
        CONFIG_ARM64_CORTEX_A510=y
        CONFIG_ARM64_VA_BITS=48
        CONFIG_ARM64_PA_BITS=48
        CONFIG_ARM64_TAGGED_ADDR_ABI=y
        CONFIG_ARM64_SVE=y
        CONFIG_ARM64_BTI=y
        CONFIG_ARM64_PTR_AUTH=y
        CONFIG_SCHED_MC=y
        CONFIG_SCHED_CORE=y
        CONFIG_ENERGY_MODEL=y
        CONFIG_UCLAMP_TASK=y
        CONFIG_UCLAMP_TASK_GROUP=y
        CONFIG_SCHEDUTIL=y
        CONFIG_CPU_FREQ=y
        CONFIG_CPUFREQ_DT=y
        CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
        CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
        EOF

    - name: Configure LTO
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        sed -i -E '/^CONFIG_LTO_(CLANG_(FULL|THIN)|NONE)=/d' "$CONFIG" || true
        case "${{ env.LTO_TYPE }}" in
          full) echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG" ;;
          thin) echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG" ;;
          none) echo "CONFIG_LTO_NONE=y" >> "$CONFIG" ;;
        esac

    - name: Install KSU variants 
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        curl -LSs https://raw.githubusercontent.com/5ec1cff/KernelSU/refs/heads/${{ env.KSU_BRANCH }}/kernel/setup.sh | bash -s ${{ env.KSU_BRANCH }}

    - name: Apply SUSFS patches
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        cp -fv ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
        mkdir -p fs include/linux
        cp -rfv ../susfs4ksu/kernel_patches/fs/* ./fs/ || true
        cp -rfv ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ || true
        patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch ||true

        cd ./KernelSU
        
        echo "Apply KSU integration patches"   
        
        cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
        patch -p1 < 10_enable_susfs_for_ksu.patch

    - name: Apply KSU Hook Patches
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
          echo "Applying manual hook patches..."
          cp ../kernel_patches/syscall_hook/min_scope_syscall_hooks_v1.5.patch ./
          patch -p1 --forward < min_scope_syscall_hooks_v1.5.patch

    - name: Configure kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        rm -f android/abi_gki_protected_exports_* || true
        cat >> "$CONFIG" << EOF
        CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"
        CONFIG_LOCALVERSION_AUTO=n
        CONFIG_KSU=y
        CONFIG_KSU_KPROBES_HOOK=n
        CONFIG_KSU_DEBUG=n
        CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
        CONFIG_KSU_ALLOWLIST_WORKAROUND=n
        CONFIG_KSU_LSM_SECURITY_HOOKS=n
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_TCP_CONG_CUBIC=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=256
        CONFIG_IP_SET_BITMAP_IP=y
        CONFIG_IP_SET_BITMAP_IPMAC=y
        CONFIG_IP_SET_BITMAP_PORT=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_IPPORT=y
        CONFIG_IP_SET_HASH_IPPORTIP=y
        CONFIG_IP_SET_HASH_IPPORTNET=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_HASH_NETNET=y
        CONFIG_IP_SET_HASH_NETPORT=y
        CONFIG_IP_SET_HASH_NETIFACE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CCACHE=y
        EOF
        sed -i '/^CONFIG_DEBUG_INFO_BTF/d' "$CONFIG"
        echo "# CONFIG_DEBUG_INFO_BTF is not set" >> "$CONFIG"
        sed -i '/^CONFIG_LSM=/d' "$CONFIG"
        echo 'CONFIG_LSM="landlock,baseband_guard,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf"' >> "$CONFIG"

    - name: Set fixed build timestamp
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        perl -pi -e 's/build-timestamp = \$\(or \$\(KBUILD_BUILD_TIMESTAMP\), \$\(build-timestamp-auto\)\)/build-timestamp = "Tue Jul 8 09:17:32 UTC 2025"/' ./init/Makefile

    - name: Prepare build
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        sed -i '/check_defconfig/d' ./build.config.gki 2>/dev/null || true
        if [ "${{ env.BUILD_CLEAN }}" = "always" ]; then
          make mrproper
          rm -rf ${{ env.OUT_DIR }}
        fi
        mkdir -p ${{ env.OUT_DIR }}

    - name: Set reproducible build identity
      run: |
        echo "KBUILD_BUILD_USER=${{ env.KBUILD_BUILD_USER }}" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=${{ env.KBUILD_BUILD_HOST }}" >> $GITHUB_ENV

    - name: Build kernel
      working-directory: ${{ env.KERNEL_DIR }}
      env:
        KBUILD_BUILD_USER: ${{ env.KBUILD_BUILD_USER }}
        KBUILD_BUILD_HOST: ${{ env.KBUILD_BUILD_HOST }}
      run: |

          make -j${{ env.THREADS }} \
            LLVM_IAS=1 LLVM=1 ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CC="ccache clang" LD=ld.lld HOSTLD=ld.lld \
            O="${{ env.OUT_DIR }}" \
            LTO=thin \
            PGO=true \
            BOLT=true \
            MIGO=false \
            gki_defconfig all 
          
        

    - name: Check build output
      run: |
        if [ ! -f "${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image" ]; then
          echo "Error: Kernel Image not found!"
          exit 1
        fi

    - name: Package kernel
      run: |
        IMAGE="${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image"
        cp -fv "$IMAGE" "${{ env.ANYKERNEL_DIR }}"/
        find "${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}" -name '*.ko' -exec cp -v {} "${{ env.ANYKERNEL_DIR }}/modules/" \; || true

        cd "${{ env.ANYKERNEL_DIR }}"
        rm -rf .git

        # Dynamic KSU build version from git commit count
        if [ -d "../${{ env.KERNEL_DIR }}/KernelSU/.git" ]; then
          cd "../${{ env.KERNEL_DIR }}/KernelSU"
          BUILD_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1998")
          BUILD_VER=$((10000 + BUILD_COUNT + 200))
        else
          BUILD_VER="12198"
        fi

        cd "${{ github.workspace }}/${{ env.ANYKERNEL_DIR }}"
        TIMESTAMP=$(TZ=UTC date -u +"%Y%m%dT%H%MZ")
        ZIP_NAME="${{ env.ZIP_PREFIX }}-${TIMESTAMP}-${BUILD_VER}.zip"

        zip -r "../${ZIP_NAME}" ./*
        mkdir -p "../${{ env.BUILDS_DIR }}"
        mv "../${ZIP_NAME}" "../${{ env.BUILDS_DIR }}/"

        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "BUILD_VER=${BUILD_VER}" >> $GITHUB_ENV

    - name: Generate SHA-256 checksum
      run: |
        cd "${{ env.BUILDS_DIR }}"
        sha256sum "${{ env.ZIP_NAME }}" > "${{ env.ZIP_NAME }}.sha256"

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: |
          ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
          ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}.sha256
        retention-days: 30

    - name: Generate build info
      run: |
        cd "${{ env.KERNEL_DIR }}"
        cp "${{ env.OUT_DIR }}/.config" ../final_defconfig
        cat > ../build_info.txt << EOF
        Build Information
        =================
        Kernel Version: 6.1.134-android14-11-g66e758f7d0c0-ab13748739
        Build Number: ${{ env.BUILD_VER }}
        Build Date: Tue Jul 8 09:17:32 UTC 2025
        Built by: ${{ env.KBUILD_BUILD_USER }}@${{ env.KBUILD_BUILD_HOST }}
        Commit SHA: ${{ github.sha }}
        LTO Type: ${{ env.LTO_TYPE }}
        Pixel 8a Config: ${{ env.PIXEL8A }}

        Compiler Information
        ===================
        Clang Version: $(clang --version | head -n1)

        Build Configuration
        ==================
        KernelSU: Enabled (next-susfs)
        SuSFS: Enabled
        Baseband-guard: Enabled
        BBR TCP: Enabled
        IPSet: Enabled
        EOF
        cat ../build_info.txt

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: |
          build_info.txt
          final_defconfig
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
          ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}.sha256
          build_info.txt
          final_defconfig
        body: |
          ## Kernel Build ${{ github.ref_name }}

          - **Version**: 6.1.134-android14-11-g66e758f7d0c0-ab13748739
          - **Build**: ${{ env.BUILD_VER }}
          - **Date**: Tue Jul 8 09:17:32 UTC 2025
          - **Built by**: ${{ env.KBUILD_BUILD_USER }}@${{ env.KBUILD_BUILD_HOST }}
          - **Commit**: ${{ github.sha }}
          - **LTO**: ${{ env.LTO_TYPE }}

          ### Features
          - KernelSU-Next (next-susfs)
          - SuSFS + Baseband-guard
          - BBR TCP + IPSet
          - Clang 17.0.2
          - Reproducible (fixed timestamp, user, host)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
