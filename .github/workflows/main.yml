name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose Release Type"
        required: true
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions
      build_selection:
        description: "Choose which kernels to build"
        required: true
        type: choice
        options:
          - All
          - Android14-6.1
          - Sultan-GCC
        default: All

jobs:
  # ------------------------------------------------------------------
  # 1. Extract SUSFS version from latest tag
  # ------------------------------------------------------------------
  generate-susfs-version:
    runs-on: ubuntu-latest
    outputs:
      susfs_version: ${{ steps.extract.outputs.susfs_version }}
    steps:
      - name: Extract SUSFS Version
        id: extract
        run: |
          LATEST_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ] || ! [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            LATEST_TAG="v1.5.12-r0"
          fi
          VERSION=$(echo "$LATEST_TAG" | sed 's/-r.*//' | sed 's/^v//')
          echo "SUSFS version: $VERSION"
          echo "susfs_version=$VERSION" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # 2. Android 14 - 6.1 (GKI Kleaf Matrix)
  # ------------------------------------------------------------------
  build-a14-6-1:
    if: >-
      ${{ inputs.build_selection == 'Android14-6.1' || inputs.build_selection == 'All' }}
    needs: generate-susfs-version
    uses: ./.github/workflows/kernel-a14-6.1.yml
    secrets: inherit
    with:
      susfs_version: ${{ needs.generate-susfs-version.outputs.susfs_version }}

  # ------------------------------------------------------------------
  # 3. Sultan GCC (Device Matrix)
  # ------------------------------------------------------------------
  build-sultan:
    if: >-
      ${{ inputs.build_selection == 'Sultan-GCC' || inputs.build_selection == 'All' }}
    needs: generate-susfs-version
    uses: ./.github/workflows/sultan-device.yml
    secrets: inherit
    with:
      susfs_version: ${{ needs.generate-susfs-version.outputs.susfs_version }}

  # ------------------------------------------------------------------
  # 4. Release Job (only if not 'Actions')
  # ------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    if: ${{ inputs.release_type != 'Actions' }}
    needs:
      - generate-susfs-version      # ← NEW: gives us the SUSFS version
      - build-a14-6-1
      - build-sultan
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # ----------------------------------------------------------
      # 0. Checkout (required for gh-release)
      # ----------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false

      # ----------------------------------------------------------
      # 1. Generate New Tag
      # ----------------------------------------------------------
      - name: Generate New Tag
        id: tag
        run: |
          LATEST_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ] || ! [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            LATEST_TAG="v1.5.12-r0"
          fi
          BASE=$(echo "$LATEST_TAG" | sed 's/-r.*//')
          REV=$(echo "$LATEST_TAG" | grep -o 'r[0-9]*$' | tr -d 'r')
          NEW_REV=$((REV + 1))
          NEW_TAG="${BASE}-r${NEW_REV}"
          echo "Previous: $LATEST_TAG to New: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 2. Set Build Date
      # ----------------------------------------------------------
      - name: Set Build Date
        id: set-build-date
        run: |
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 3. Extract SUSFS Version from NEW_TAG
      # ----------------------------------------------------------
      - name: Extract SUSFS Version
        id: extract-version
        run: |
          SUSFS_VERSION=$(echo "${{ steps.tag.outputs.new_tag }}" | cut -d'-' -f1 | sed 's/v//')
          echo "susfs_version=v$SUSFS_VERSION" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 4. Set Release Name
      # ----------------------------------------------------------
      - name: Set Release Name
        run: |
          SUSFS_VERSION="${{ steps.extract-version.outputs.susfs_version }}"
          if [[ "${{ inputs.release_type }}" == "Pre-Release" ]]; then
            echo "RELEASE_NAME=*TEST BUILD* Sultan Kernels With KernelSU & SUSFS $SUSFS_VERSION *TEST BUILD*" >> $GITHUB_ENV
          else
            echo "RELEASE_NAME=Sultan Kernels With KernelSU & SUSFS $SUSFS_VERSION" >> $GITHUB_ENV
          fi

      # ----------------------------------------------------------
      # 5. Define Release Notes
      # ----------------------------------------------------------
      - name: Define Release Notes
        id: define-release-notes
        run: |
          BUILD_DATE="${{ steps.set-build-date.outputs.build_date }}"
          SUSFS_VERSION="${{ steps.extract-version.outputs.susfs_version }}"
          RELEASE_NOTES=$(cat << EOF
            This release contains KernelSU and MKSU variants with SUSFS $SUSFS_VERSION
            
            **COMPATIBILITY NOTICE**
            ⚠️ **COMPATIBILITY NOTICE** ⚠️
            Please ensure compatibility by comparing release dates with official Sultan kernel releases:
            - Check official Sultan releases: https://github.com/kerneltoast/android_kernel_google_gs201/releases
            - This build is based on the latest Sultan kernel commits as of build date
            - Always verify your device's Android version matches the kernel target (Android 14)
            - Recommended to use kernels released within 30 days of official Sultan updates

            Module: 
            -> https://github.com/sidex15/ksu_module_susfs
            
            Managers:
            -> https://github.com/KOWX712/KernelSU
            -> https://github.com/SukiSU-Ultra/SukiSU-Ultra
            
            Features:
            [+] KernelSU Magic Managers v1.0.5
            [+] SUSFS $SUSFS_VERSION
            [+] Maphide LineageOS Detections
            [+] Futile Maphide for jit-zygote-cache Detections
            [+] Magic Mount Support
            
            📅 **Release Date Compatibility Check:**
            - Built on: $BUILD_DATE
          EOF
          )
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 6. Download Artifacts
      # ----------------------------------------------------------
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts
          pattern: '*'

      # ----------------------------------------------------------
      # 7. Create Release Body File
      # ----------------------------------------------------------
      - name: Write Release Body
        run: |
          echo "${{ steps.define-release-notes.outputs.release_notes }}" > release_body.md

      # ----------------------------------------------------------
      # 8. Create GitHub Release
      # ----------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ env.RELEASE_NAME }} Pre-release
          body_path: release_body.md
          draft: false
          prerelease: true

      # ----------------------------------------------------------
      # 9. Upload Original ZIPs (NO re-zipping)
      # ----------------------------------------------------------
      - name: Upload Original ZIPs to Release
        run: |
          shopt -s nullglob
          ZIP_FILES=(./downloaded-artifacts/**/*.zip)
          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "No ZIP files found. Skipping upload."
            exit 0
          fi
          for zip in "${ZIP_FILES[@]}"; do
            echo "Uploading: $zip"
            gh release upload ${{ steps.tag.outputs.new_tag }} "$zip" --clobber
          done
