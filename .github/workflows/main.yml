name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose Release Type"
        required: true
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions
      build_selection:
        description: "Choose which kernels to build"
        required: true
        type: choice
        options:
          - All
          - Android14-6.1
          - Sultan-GCC
        default: All

jobs:
  # ------------------------------------------------------------------
  # 1. Extract SUSFS version from latest tag (e.g. v1.5.12 → 1.5.12)
  # ------------------------------------------------------------------
  generate-susfs-version:
    runs-on: ubuntu-latest
    outputs:
      susfs_version: ${{ steps.extract.outputs.susfs_version }}
    steps:
      - name: Extract SUSFS Version
        id: extract
        run: |
          LATEST_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ] || ! [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            LATEST_TAG="v1.5.12-r0"
          fi
          VERSION=$(echo "$LATEST_TAG" | sed 's/-r.*//' | sed 's/^v//')
          echo "SUSFS version: $VERSION"
          echo "susfs_version=$VERSION" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # 2. Android 14 - 6.1 (GKI Kleaf Matrix)
  # ------------------------------------------------------------------
  build-a14-6-1:
    if: >-
      ${{ inputs.build_selection == 'Android14-6.1' || inputs.build_selection == 'All' }}
    needs: generate-susfs-version
    uses: ./.github/workflows/kernel-a14-6.1.yml
    secrets: inherit
    with:
      susfs_version: ${{ needs.generate-susfs-version.outputs.susfs_version }}

  # ------------------------------------------------------------------
  # 3. Sultan GCC (Device Matrix: gs201, zuma, zumapro)
  # ------------------------------------------------------------------
  build-sultan:
    if: >-
      ${{ inputs.build_selection == 'Sultan-GCC' || inputs.build_selection == 'All' }}
    needs: generate-susfs-version
    uses: ./.github/workflows/sultan-device.yml
    secrets: inherit
    with:
      susfs_version: ${{ needs.generate-susfs-version.outputs.susfs_version }}

  # ------------------------------------------------------------------
  # 4. Release Job (only if not 'Actions')
  # ------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    if: ${{ inputs.release_type != 'Actions' }}
    needs:
      - generate-susfs-version
      - build-a14-6-1
      - build-sultan
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NAME: "GKI + Sultan Kernels With KowSU & SUSFS v${{ needs.generate-susfs-version.outputs.susfs_version }}"
      SUSFS_VERSION: ${{ needs.generate-susfs-version.outputs.susfs_version }}

    steps:
      

      - name: Generate New Tag
        id: tag
        run: |
          LATEST_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ] || ! [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            LATEST_TAG="v${{ env.SUSFS_VERSION }}-r0"
          fi
          BASE=$(echo "$LATEST_TAG" | sed 's/-r.*//')
          REV=$(echo "$LATEST_TAG" | grep -o 'r[0-9]*$' | tr -d 'r')
          NEW_REV=$((REV + 1))
          NEW_TAG="${BASE}-r${NEW_REV}"
          echo "Previous: $LATEST_TAG to New: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts
          pattern: '*'

      - name: Create Release Body
        run: |
          cat << 'EOF' > release_body.md
          **IMPORTANT DISCLAIMER**
          This software is provided for testing and educational purposes only. Use at your own risk.
          The developers are not responsible for any damage, data loss, or issues that may occur.
          Please ensure you have proper backups before installation.

          ## GKI Kernels (Android 14 - 6.1)
          - Built with Google Kleaf
          - Multiple patch levels (6.1.134, 6.1.145, etc.)

          ## Sultan GCC Kernels
          - Built with GCC 13.3.0
          - Devices: **gs201**, **zuma**, **zumapro**
          - Based on kerneltoast/android_kernel_google_*

          **Common Features:**
          -> KowSU
          -> Multi Manager Support for MKSU, KowSU and SukiSU
          -> SUSFS v${{ env.SUSFS_VERSION }}
          -> Scope-Minimized Manual hooks v1.5
          -> Ptrace Patch Support for Older Kernels (<5.16)
          -> IPSet Support for Advanced Network Filtering
          -> Wireguard Support
          -> BBR v1 Support
          -> Kernel Sound System: PCM, timers, procfs, loopback
          -> BBG: https://github.com/vc-teahouse/Baseband-guard

          **Notes:**
          -> SUS SU Mode 2 is disabled (non-kprobe hooks)
          -> Use https://github.com/fatalcoder524/KernelFlasher/
          -> **boot.img**: In "Misc" artifact
          -> Build summary in "Misc" artifact

          **Module:** https://github.com/sidex15/ksu_module_susfs  
          **Managers:**  
          -> KowSU: https://github.com/KOWX712/KernelSU  
          -> SukiSU: https://github.com/SukiSU-Ultra/SukiSU-Ultra
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}

      - name: Package and Upload ZIPs
        run: |
          shopt -s nullglob
          dirs=(./downloaded-artifacts/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No artifacts found. Skipping upload."
            exit 0
          fi
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            zip_name="${name}.zip"
            echo "Packaging $name to $zip_name"
            (cd "$dir" && zip -r -9 "../../$zip_name" ./*)
            echo "Uploading $zip_name"
            gh release upload ${{ steps.tag.outputs.new_tag }} "$zip_name" --clobber
          done
