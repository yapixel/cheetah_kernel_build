# ============================================================
#  Sultan Kernel Builder — Official KernelSU + SUSFS
#  Toolchain : GCC 14.2.0 (kernel.org nolibc)
#
#  Supports  : Pixel 7/7a/7 Pro  (gs201)
#              Pixel 8/8 Pro     (zuma)
#              Pixel 9 series    (zumapro)
#
#  Sources:
#    Kernel  : github.com/kerneltoast/android_kernel_google_tensynos
#    KSU     : github.com/tiann/KernelSU  (official — main branch)
#    SUSFS   : gitlab.com/simonpunk/susfs4ksu  (sultan-shiba-susfs-minimal)
#    AK3     : github.com/osm0sis/AnyKernel3
# ============================================================

name: Build Sultan Kernel (KSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      device_soc:
        description: "Target SoC"
        required: true
        default: "zuma"
        type: choice
        options:
          - gs201      # Pixel 7 / 7a / 7 Pro
          - zuma       # Pixel 8 / 8 Pro
          - zumapro    # Pixel 9 / 9 Pro / 9 Pro XL / 9 Pro Fold

      android_version:
        description: "Android version"
        required: true
        default: "16"
        type: choice
        options:
          - "14"
          - "15"
          - "16"

      kernel_branch:
        description: "Sultan kernel branch (blank = auto: <ver>.0.0-sultan)"
        required: false
        default: ""

      ksu_tag:
        description: "KernelSU tag/ref (blank = latest main)"
        required: false
        default: ""

      susfs_branch:
        description: "SUSFS branch"
        required: false
        default: "sultan-shiba-susfs-minimal"

      publish_release:
        description: "Create a GitHub Release after build"
        required: false
        default: "true"
        type: boolean

  # Uncomment to enable nightly builds:
  # schedule:
  #   - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.device_soc }}
  cancel-in-progress: true

env:
  ARCH: arm64
  GCC_VERSION: "14.2.0"
  GCC_BASE_URL: "https://kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0"

# ════════════════════════════════════════════════════════════
jobs:

  # ── Resolve parameters ────────────────────────────────────
  prepare:
    name: Resolve parameters
    runs-on: ubuntu-24.04
    outputs:
      kernel_repo:   ${{ steps.vars.outputs.kernel_repo }}
      kernel_branch: ${{ steps.vars.outputs.kernel_branch }}
      defconfig:     ${{ steps.vars.outputs.defconfig }}
      device_name:   ${{ steps.vars.outputs.device_name }}
      release_tag:   ${{ steps.vars.outputs.release_tag }}
      release_name:  ${{ steps.vars.outputs.release_name }}

    steps:
      - name: Resolve variables
        id: vars
        run: |
          SOC="${{ github.event.inputs.device_soc || 'zuma' }}"
          AVER="${{ github.event.inputs.android_version || '16' }}"
          USER_BRANCH="${{ github.event.inputs.kernel_branch }}"

          KERNEL_REPO="https://github.com/kerneltoast/android_kernel_google_tensynos"

          case "$SOC" in
            gs201)   DEFCONFIG="slider_defconfig";  DEVICE_NAME="Pixel 7 / 7a / 7 Pro" ;;
            zuma)    DEFCONFIG="zuma_defconfig";     DEVICE_NAME="Pixel 8 / 8 Pro" ;;
            zumapro) DEFCONFIG="zumapro_defconfig";  DEVICE_NAME="Pixel 9 / 9 Pro / 9 Pro XL / 9 Pro Fold" ;;
            *)       echo "::error::Unknown SoC: $SOC"; exit 1 ;;
          esac

          KERNEL_BRANCH="${USER_BRANCH:-${AVER}.0.0-sultan}"
          DATE=$(date +'%Y%m%d-%H%M')
          TAG="sultan-${SOC}-ksu-susfs-A${AVER}-${DATE}"
          RNAME="Sultan ${SOC^^} | KSU + SUSFS | Android ${AVER} | ${DATE}"

          echo "kernel_repo=$KERNEL_REPO"     >> "$GITHUB_OUTPUT"
          echo "kernel_branch=$KERNEL_BRANCH" >> "$GITHUB_OUTPUT"
          echo "defconfig=$DEFCONFIG"          >> "$GITHUB_OUTPUT"
          echo "device_name=$DEVICE_NAME"      >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG"              >> "$GITHUB_OUTPUT"
          echo "release_name=$RNAME"           >> "$GITHUB_OUTPUT"

          {
            echo "### Build Parameters"
            echo "| | |"
            echo "|---|---|"
            echo "| SoC | \`$SOC\` |"
            echo "| Devices | $DEVICE_NAME |"
            echo "| Android | $AVER |"
            echo "| Kernel branch | \`$KERNEL_BRANCH\` |"
            echo "| Defconfig | \`$DEFCONFIG\` |"
            echo "| KSU | Official — [tiann/KernelSU](https://github.com/tiann/KernelSU) |"
            echo "| SUSFS branch | \`${{ github.event.inputs.susfs_branch || 'sultan-shiba-susfs-minimal' }}\` |"
            echo "| GCC | ${{ env.GCC_VERSION }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Build ─────────────────────────────────────────────────
  build:
    name: Build (${{ needs.prepare.outputs.defconfig }})
    needs: prepare
    runs-on: ubuntu-24.04

    steps:
      # ── 0. Free disk space ───────────────────────────────
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # ── 1. Build dependencies ────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl \
            flex git kmod libelf-dev libssl-dev libncurses-dev lz4 \
            make pahole python3 rsync unzip wget zip zstd \
            device-tree-compiler

      # ── 2. ccache ────────────────────────────────────────
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gcc-sultan-${{ needs.prepare.outputs.defconfig }}-${{ github.sha }}
          restore-keys: |
            ccache-gcc-sultan-${{ needs.prepare.outputs.defconfig }}-
            ccache-gcc-sultan-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # ── 3. GCC 14.2.0 aarch64 ───────────────────────────
      - name: Download GCC 14.2.0
        run: |
          wget -q \
            ${{ env.GCC_BASE_URL }}/x86_64-gcc-${{ env.GCC_VERSION }}-nolibc-aarch64-linux.tar.gz \
            -O gcc-aarch64.tar.gz
          tar -xf gcc-aarch64.tar.gz
          GCC_BIN="$PWD/gcc-${{ env.GCC_VERSION }}-nolibc/aarch64-linux/bin"
          echo "GCC_BIN=${GCC_BIN}"                 >> "$GITHUB_ENV"
          echo "GCC_PATH=${GCC_BIN}/aarch64-linux-" >> "$GITHUB_ENV"
          echo "GCC: $(${GCC_BIN}/aarch64-linux-gcc --version | head -1)"

      # ── 4. GCC 14.2.0 arm32 (vDSO compat) ───────────────
      - name: Download GCC 14.2.0 (arm32)
        run: |
          wget -q \
            ${{ env.GCC_BASE_URL }}/x86_64-gcc-${{ env.GCC_VERSION }}-nolibc-arm-linux-gnueabi.tar.gz \
            -O gcc-arm32.tar.gz
          tar -xf gcc-arm32.tar.gz
          GCC32_BIN="$PWD/gcc-${{ env.GCC_VERSION }}-nolibc/arm-linux-gnueabi/bin"
          echo "GCC32_BIN=${GCC32_BIN}"                      >> "$GITHUB_ENV"
          echo "GCC32_PATH=${GCC32_BIN}/arm-linux-gnueabi-"  >> "$GITHUB_ENV"
          echo "GCC32: $(${GCC32_BIN}/arm-linux-gnueabi-gcc --version | head -1)"

      # ── 5. Clone Sultan kernel ───────────────────────────
      - name: Clone Sultan kernel
        run: |
          echo "Repo  : ${{ needs.prepare.outputs.kernel_repo }}"
          echo "Branch: ${{ needs.prepare.outputs.kernel_branch }}"
          git clone --depth=1 \
            --branch "${{ needs.prepare.outputs.kernel_branch }}" \
            "${{ needs.prepare.outputs.kernel_repo }}" \
            kernel
          echo "HEAD  : $(git -C kernel log --oneline -1)"

      # ── 6. Integrate official KernelSU ──────────────────
      - name: Integrate KernelSU (official)
        working-directory: kernel
        run: |
          KSU_TAG="${{ github.event.inputs.ksu_tag }}"
          KSU_REF="${KSU_TAG:-main}"

          echo "Setting up official KernelSU @ ${KSU_REF}..."
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "${KSU_REF}"

          echo "KernelSU version : $(cat KernelSU/kernel/version 2>/dev/null || echo 'unknown')"
          echo "KernelSU HEAD    : $(git -C KernelSU log --oneline -1 2>/dev/null || true)"

      # ── 7. Apply SUSFS patches ───────────────────────────
      - name: Apply SUSFS patches
        working-directory: kernel
        env:
          SUSFS_BRANCH: ${{ github.event.inputs.susfs_branch || 'sultan-shiba-susfs-minimal' }}
          AVER: ${{ github.event.inputs.android_version || '16' }}
        run: |
          echo "Cloning SUSFS @ ${SUSFS_BRANCH}..."
          git clone --depth=1 \
            --branch "${SUSFS_BRANCH}" \
            "https://gitlab.com/simonpunk/susfs4ksu.git" \
            ../susfs4ksu
          SUSFS="$(pwd)/../susfs4ksu"

          KERNEL_VER=$(make kernelversion 2>/dev/null | head -1)
          MAJOR=$(echo "$KERNEL_VER" | cut -d. -f1)
          MINOR=$(echo "$KERNEL_VER" | cut -d. -f2)
          echo "Kernel version: ${KERNEL_VER} (${MAJOR}.${MINOR})"

          # 1. fs/ sources
          if [ -d "${SUSFS}/kernel_patches/fs" ]; then
            echo "→ Copying fs/ sources"
            cp -v "${SUSFS}/kernel_patches/fs/"* fs/
          fi

          # 2. include/linux/ headers
          if [ -d "${SUSFS}/kernel_patches/include/linux" ]; then
            echo "→ Copying include/linux/ headers"
            cp -v "${SUSFS}/kernel_patches/include/linux/"* include/linux/
          fi

          # 3. KSU enablement patch (applied inside KernelSU/)
          KSU_PATCH="${SUSFS}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            echo "→ Applying KSU SUSFS enablement patch"
            cp "$KSU_PATCH" KernelSU/
            patch -p1 --forward -d KernelSU < KernelSU/10_enable_susfs_for_ksu.patch \
              || echo "::warning::KSU patch already applied or had minor conflicts"
          else
            echo "::warning::KSU enablement patch not found"
          fi

          # 4. Main kernel SUSFS patch — version-specific first, then generic
          PATCH_FILE=""
          for CANDIDATE in \
            "${SUSFS}/kernel_patches/50_add_susfs_in_kernel-${MAJOR}.${MINOR}.patch" \
            "${SUSFS}/kernel_patches/50_add_susfs_in_gki-android${AVER}-${MAJOR}.${MINOR}.patch" \
            "${SUSFS}/kernel_patches/50_add_susfs_in_kernel.patch"
          do
            [ -f "$CANDIDATE" ] && { PATCH_FILE="$CANDIDATE"; break; }
          done

          if [ -n "$PATCH_FILE" ]; then
            echo "→ Applying kernel SUSFS patch: $(basename $PATCH_FILE)"
            patch -p1 --forward < "$PATCH_FILE" \
              || echo "::warning::Kernel SUSFS patch had conflicts — check build.log"
          else
            echo "::warning::No SUSFS patch found for kernel ${MAJOR}.${MINOR}"
          fi

          echo "SUSFS patch step complete."

      # ── 8. Configure kernel ──────────────────────────────
      - name: Configure kernel
        working-directory: kernel
        run: |
          export PATH="${GCC_BIN}:${GCC32_BIN}:$PATH"
          DEFCONFIG="${{ needs.prepare.outputs.defconfig }}"

          MAKE_ARGS=(
            O=out ARCH=arm64
            CROSS_COMPILE="${GCC_PATH}"
            CROSS_COMPILE_ARM32="${GCC32_PATH}"
            CC="ccache ${GCC_PATH}gcc"
            LD="${GCC_PATH}ld"
            AR="${GCC_PATH}ar"
            NM="${GCC_PATH}nm"
            OBJCOPY="${GCC_PATH}objcopy"
            OBJDUMP="${GCC_PATH}objdump"
            STRIP="${GCC_PATH}strip"
          )

          echo "→ Generating ${DEFCONFIG}..."
          make "${MAKE_ARGS[@]}" "$DEFCONFIG"

          echo "→ Enabling KSU + SUSFS Kconfig options..."
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -d CONFIG_KSU_SUSFS_SUS_SU   # Disabled: requires kprobes (not present in Sultan)

          make "${MAKE_ARGS[@]}" olddefconfig

          echo "→ Active KSU/SUSFS options:"
          grep -E "^CONFIG_KSU" out/.config | sort

      # ── 9. Compile ───────────────────────────────────────
      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="${GCC_BIN}:${GCC32_BIN}:$PATH"
          JOBS=$(nproc --all)
          echo "Building with GCC ${{ env.GCC_VERSION }} on ${JOBS} threads..."

          time make \
            O=out ARCH=arm64 \
            CROSS_COMPILE="${GCC_PATH}" \
            CROSS_COMPILE_ARM32="${GCC32_PATH}" \
            CC="ccache ${GCC_PATH}gcc" \
            LD="${GCC_PATH}ld" \
            AR="${GCC_PATH}ar" \
            NM="${GCC_PATH}nm" \
            OBJCOPY="${GCC_PATH}objcopy" \
            OBJDUMP="${GCC_PATH}objdump" \
            STRIP="${GCC_PATH}strip" \
            -j"${JOBS}" \
            2>&1 | tee build.log

          ccache --show-stats

          echo "Kernel images:"
          find out/arch/arm64/boot -maxdepth 1 -name 'Image*' 2>/dev/null \
            || { echo "::error::No kernel image found — build failed"; exit 1; }

      # ── 10. Package ──────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          SOC="${{ github.event.inputs.device_soc || 'zuma' }}"
          AVER="${{ github.event.inputs.android_version || '16' }}"
          DATE=$(date +'%Y%m%d')

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel3

          IMAGE=""
          for CAND in \
            kernel/out/arch/arm64/boot/Image.lz4-dtb \
            kernel/out/arch/arm64/boot/Image.lz4 \
            kernel/out/arch/arm64/boot/Image-dtb \
            kernel/out/arch/arm64/boot/Image
          do
            [ -f "$CAND" ] && { IMAGE="$CAND"; break; }
          done
          [ -z "$IMAGE" ] && { echo "::error::No kernel image found."; exit 1; }
          echo "Using image: $IMAGE"
          cp "$IMAGE" anykernel3/Image

          DTB_DIR="kernel/out/arch/arm64/boot/dts"
          if [ -d "$DTB_DIR" ]; then
            find "$DTB_DIR" -name "*.dtb"  -exec cp {} anykernel3/ \; 2>/dev/null || true
            find "$DTB_DIR" -name "*.dtbo" -exec cp {} anykernel3/ \; 2>/dev/null || true
          fi

          cat > anykernel3/anykernel.sh << EOF
          kernel.string=Sultan | KernelSU + SUSFS | GCC ${{ env.GCC_VERSION }} | A${AVER} | ${DATE}
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${SOC}
          supported.versions=
          supported.patchlevels=
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF

          ZIP="Sultan-${SOC^^}-A${AVER}-KSU-SUSFS-GCC${{ env.GCC_VERSION }}-${DATE}.zip"
          cd anykernel3 && zip -r9 "../$ZIP" . -x "*.git*" README.md && cd ..

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          sha256sum "$ZIP" | tee "${ZIP}.sha256"
          echo "Output: $ZIP  ($(du -sh "$ZIP" | cut -f1))"

      # ── 11. Upload artifacts ─────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ needs.prepare.outputs.defconfig }}
          path: kernel/build.log
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Result"
            echo "| | |"
            echo "|---|---|"
            echo "| SoC | \`${{ github.event.inputs.device_soc || 'zuma' }}\` |"
            echo "| Branch | \`${{ needs.prepare.outputs.kernel_branch }}\` |"
            echo "| KSU | Official — tiann/KernelSU |"
            echo "| SUSFS | \`${{ github.event.inputs.susfs_branch || 'sultan-shiba-susfs-minimal' }}\` |"
            echo "| GCC | ${{ env.GCC_VERSION }} |"
            [ -n "$ZIP" ] && echo "| Output | \`$ZIP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Publish release ──────────────────────────────────────
  release:
    name: Publish Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    if: github.event.inputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "Sultan-*"
          merge-multiple: true

      - name: Generate release notes
        run: |
          AVER="${{ github.event.inputs.android_version || '16' }}"
          DATE=$(date +'%B %d, %Y')

          cat > notes.md << EOF
          ## Sultan Kernel | Official KernelSU + SUSFS

          Built with **GCC ${{ env.GCC_VERSION }}** via GitHub Actions on ${DATE}.

          ### Features
          - ✅ Official KernelSU ([tiann/KernelSU](https://github.com/tiann/KernelSU))
          - ✅ SUSFS \`sultan-shiba-susfs-minimal\` patches
          - ✅ SUS_PATH · SUS_MOUNT · SUS_KSTAT · SUS_OVERLAYFS
          - ✅ TRY_UMOUNT · SPOOF_UNAME · SPOOF_BOOTCONFIG
          - ✅ OPEN_REDIRECT · HIDE_KSU_SUSFS_SYMBOLS
          - ✅ AUTO_ADD mounts · Magic Mount
          - ✅ GCC ${{ env.GCC_VERSION }} (kernel.org nolibc)

          ### Installation
          1. Unlock bootloader
          2. Flash via [HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher)
          3. Install [susfs4ksu-module](https://github.com/sidex15/susfs4ksu-module) via KSU manager
          4. Use official [KernelSU manager](https://github.com/tiann/KernelSU/releases)

          ### SHA-256 Checksums
          \`\`\`
          EOF
          cat *.sha256 2>/dev/null >> notes.md || echo "(see workflow artifacts)" >> notes.md
          echo '```' >> notes.md
          echo "" >> notes.md
          echo "> ⚠️ Flashing a custom kernel voids your warranty. Always back up your data first." >> notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ needs.prepare.outputs.release_tag }}
          name:      ${{ needs.prepare.outputs.release_name }}
          body_path: notes.md
          files: |
            Sultan-*.zip
            Sultan-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
