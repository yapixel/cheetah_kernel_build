# ============================================================
#  Sultan Kernel Builder — Official KernelSU + SUSFS
#  Target    : Pixel 8 (Shiba / zuma) — Android 16
#  Kernel    : github.com/kerneltoast/android_kernel_google_tensynos @ 16.0.0-sultan
#  KSU       : github.com/tiann/KernelSU  (official)
#  SUSFS     : gitlab.com/simonpunk/susfs4ksu @ sultan-shiba-susfs-minimal
#  Toolchain : GCC 14.2.0 (kernel.org nolibc)
#
#  Patch procedure follows simonpunk's README exactly:
#    1. cp kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch → KernelSU/
#    2. cp kernel_patches/50_add_susfs_in_kernel-<ver>.patch     → kernel root
#    3. cp kernel_patches/fs/*                                   → fs/
#    4. cp kernel_patches/include/linux/*                        → include/linux/
#    5. cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch
#    6. cd kernel   && patch -p1 < 50_add_susfs_in_kernel.patch
#
#  Default SUSFS features (from simonpunk README — minimal set):
#    CONFIG_KSU_SUSFS_SUS_MOUNT                  = y
#    CONFIG_KSU_SUSFS_SPOOF_UNAME                = y
#    CONFIG_KSU_SUSFS_ENABLE_LOG                 = y
#    CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS     = y
#    CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG= y
#    CONFIG_KSU_SUSFS_SUS_MAP                    = y
#  Optional (disabled by default, toggleable via inputs):
#    CONFIG_KSU_SUSFS_SUS_PATH
#    CONFIG_KSU_SUSFS_SUS_KSTAT
#    CONFIG_KSU_SUSFS_OPEN_REDIRECT
# ============================================================

name: Build Sultan Kernel — Pixel 8 (KSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Sultan kernel branch"
        required: false
        default: "16.0.0-sultan"

      ksu_tag:
        description: "KernelSU tag/ref (blank = main)"
        required: false
        default: ""

      susfs_ref:
        description: "SUSFS tag or commit (blank = latest). Prefer a stable 'Bump version to vX.X.X' commit."
        required: false
        default: ""

      # Optional SUSFS features (disabled by default per simonpunk README)
      enable_sus_path:
        description: "Enable CONFIG_KSU_SUSFS_SUS_PATH"
        required: false
        default: "false"
        type: boolean

      enable_sus_kstat:
        description: "Enable CONFIG_KSU_SUSFS_SUS_KSTAT"
        required: false
        default: "false"
        type: boolean

      enable_open_redirect:
        description: "Enable CONFIG_KSU_SUSFS_OPEN_REDIRECT"
        required: false
        default: "false"
        type: boolean

      # Optional: spoof /proc/version build strings (simonpunk README section)
      spoof_build_strings:
        description: "Spoof kernel build strings (/proc/version)"
        required: false
        default: "false"
        type: boolean

      publish_release:
        description: "Create a GitHub Release after build"
        required: false
        default: "true"
        type: boolean

  # Uncomment for nightly builds:
  # schedule:
  #   - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixed target per simonpunk README
  KERNEL_REPO: "https://github.com/kerneltoast/android_kernel_google_tensynos"
  DEFCONFIG: "zuma_defconfig"
  ARCH: "arm64"

  # GCC 14.2.0 from kernel.org
  GCC_VERSION: "14.2.0"
  GCC_BASE_URL: "https://kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0"

  # SUSFS
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "sultan-shiba-susfs-minimal"

# ════════════════════════════════════════════════════════════
jobs:

  build:
    name: "Build — Pixel 8 (zuma)"
    runs-on: ubuntu-24.04

    steps:
      # ── 0. Free disk space ───────────────────────────────
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # ── 1. Build dependencies ────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl \
            flex git kmod libelf-dev libssl-dev libncurses-dev lz4 \
            make pahole python3 rsync unzip wget zip zstd \
            device-tree-compiler

      # ── 2. ccache ────────────────────────────────────────
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gcc-sultan-zuma-${{ github.sha }}
          restore-keys: |
            ccache-gcc-sultan-zuma-
            ccache-gcc-sultan-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # ── 3. GCC 14.2.0 — aarch64 ─────────────────────────
      - name: Download GCC 14.2.0
        run: |
          wget -q \
            ${{ env.GCC_BASE_URL }}/x86_64-gcc-${{ env.GCC_VERSION }}-nolibc-aarch64-linux.tar.gz \
            -O gcc-aarch64.tar.gz
          tar -xf gcc-aarch64.tar.gz
          GCC_BIN="$PWD/gcc-${{ env.GCC_VERSION }}-nolibc/aarch64-linux/bin"
          echo "GCC_BIN=${GCC_BIN}"                 >> "$GITHUB_ENV"
          echo "GCC_PATH=${GCC_BIN}/aarch64-linux-" >> "$GITHUB_ENV"
          echo "GCC: $(${GCC_BIN}/aarch64-linux-gcc --version | head -1)"

      # ── 4. GCC 14.2.0 — arm32 (vDSO compat) ─────────────
      - name: Download GCC 14.2.0 (arm32)
        run: |
          wget -q \
            ${{ env.GCC_BASE_URL }}/x86_64-gcc-${{ env.GCC_VERSION }}-nolibc-arm-linux-gnueabi.tar.gz \
            -O gcc-arm32.tar.gz
          tar -xf gcc-arm32.tar.gz
          GCC32_BIN="$PWD/gcc-${{ env.GCC_VERSION }}-nolibc/arm-linux-gnueabi/bin"
          echo "GCC32_BIN=${GCC32_BIN}"                     >> "$GITHUB_ENV"
          echo "GCC32_PATH=${GCC32_BIN}/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "GCC32: $(${GCC32_BIN}/arm-linux-gnueabi-gcc --version | head -1)"

      # ── 5. Clone Sultan kernel ───────────────────────────
      - name: Clone Sultan kernel
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch || '16.0.0-sultan' }}"
          echo "Cloning ${{ env.KERNEL_REPO }} @ ${BRANCH}"
          git clone --depth=1 --branch "${BRANCH}" \
            "${{ env.KERNEL_REPO }}" kernel
          echo "HEAD: $(git -C kernel log --oneline -1)"

      # ── 6. Integrate official KernelSU ──────────────────
      - name: Integrate KernelSU (official — tiann/KernelSU)
        working-directory: kernel
        run: |
          KSU_REF="${{ github.event.inputs.ksu_tag }}"
          KSU_REF="${KSU_REF:-main}"

          echo "Setting up official KernelSU @ ${KSU_REF}..."
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "${KSU_REF}"

          echo "KernelSU version : $(cat KernelSU/kernel/version 2>/dev/null || echo 'unknown')"
          echo "KernelSU HEAD    : $(git -C KernelSU log --oneline -1 2>/dev/null || true)"

      # ── 7. Clone SUSFS ───────────────────────────────────
      # Per simonpunk README: clone a tag / release tag or up to
      # a commit containing "Bump version to vX.X.X" for stability.
      - name: Clone SUSFS
        run: |
          SUSFS_REF="${{ github.event.inputs.susfs_ref }}"

          git clone --depth=1 \
            --branch "${{ env.SUSFS_BRANCH }}" \
            "${{ env.SUSFS_REPO }}" \
            susfs4ksu

          # If a specific ref was requested, check it out
          if [ -n "$SUSFS_REF" ]; then
            echo "Checking out SUSFS ref: ${SUSFS_REF}"
            git -C susfs4ksu fetch --depth=1 origin "${SUSFS_REF}"
            git -C susfs4ksu checkout FETCH_HEAD
          fi

          echo "SUSFS HEAD: $(git -C susfs4ksu log --oneline -1)"

      # ── 8. Apply SUSFS patches ───────────────────────────
      # Follows simonpunk README step by step (exact order)
      - name: Apply SUSFS patches
        working-directory: kernel
        run: |
          SUSFS="$GITHUB_WORKSPACE/susfs4ksu"

          # Detect kernel version cleanly from Makefile — avoids
          # make noise polluting the string when no out/ dir exists yet
          MAJOR=$(grep -m1 "^VERSION ="   Makefile | awk '{print $3}')
          MINOR=$(grep -m1 "^PATCHLEVEL =" Makefile | awk '{print $3}')
          KERNEL_VER="${MAJOR}.${MINOR}"
          echo "Kernel version: ${KERNEL_VER}"

          # Show all available SUSFS patches to aid debugging
          echo "Available SUSFS patches:"
          ls "${SUSFS}/kernel_patches/"*.patch 2>/dev/null || echo "(none found)"

          # Step 1 — cp kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch → KernelSU/
          echo "→ Step 1: Copy KSU enablement patch"
          cp "${SUSFS}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" KernelSU/

          # Step 2 — cp kernel_patches/50_add_susfs_in_kernel-<ver>.patch → kernel root
          # Try version-specific first, then any 50_ patch present, then generic fallback
          echo "→ Step 2: Copy kernel SUSFS patch"
          KERNEL_PATCH=""
          for CANDIDATE in \
            "${SUSFS}/kernel_patches/50_add_susfs_in_kernel-${KERNEL_VER}.patch" \
            "${SUSFS}/kernel_patches/50_add_susfs_in_gki-android16-${KERNEL_VER}.patch" \
            "${SUSFS}/kernel_patches/50_add_susfs_in_gki-android15-${KERNEL_VER}.patch" \
            "${SUSFS}/kernel_patches/50_add_susfs_in_kernel.patch"
          do
            if [ -f "$CANDIDATE" ]; then
              KERNEL_PATCH="$CANDIDATE"
              break
            fi
          done

          # Last resort: pick the first 50_ patch that exists in the directory
          if [ -z "$KERNEL_PATCH" ]; then
            KERNEL_PATCH=$(ls "${SUSFS}/kernel_patches/50_"*.patch 2>/dev/null | head -1)
          fi

          if [ -z "$KERNEL_PATCH" ]; then
            echo "::error::No SUSFS kernel patch found for ${KERNEL_VER}. Patches available:"
            ls "${SUSFS}/kernel_patches/" || true
            exit 1
          fi
          echo "  Using: $(basename $KERNEL_PATCH)"
          cp "$KERNEL_PATCH" 50_add_susfs_in_kernel.patch

          # Step 3 — cp kernel_patches/fs/* → fs/
          echo "→ Step 3: Copy fs/ sources"
          cp -v "${SUSFS}/kernel_patches/fs/"* fs/

          # Step 4 — cp kernel_patches/include/linux/* → include/linux/
          echo "→ Step 4: Copy include/linux/ headers"
          cp -v "${SUSFS}/kernel_patches/include/linux/"* include/linux/

          # Step 5 — cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch
          echo "→ Step 5: Apply KSU enablement patch"
          ( cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch ) \
            || echo "::warning::KSU patch already applied or had minor conflicts"

          # Step 6 — cd kernel && patch -p1 < 50_add_susfs_in_kernel.patch
          echo "→ Step 6: Apply kernel SUSFS patch"
          patch -p1 < 50_add_susfs_in_kernel.patch \
            || echo "::warning::Kernel SUSFS patch had conflicts — review build output"

          echo "SUSFS patch step complete."

      # ── 9. Optional: spoof build strings ────────────────
      # Per simonpunk README: export env vars + reset .version
      # + sed LINUX_COMPILER in scripts/mkcompile_h
      - name: Spoof kernel build strings
        if: github.event.inputs.spoof_build_strings == 'true'
        working-directory: kernel
        run: |
          echo "→ Spoofing /proc/version build strings..."

          # Reset the kernel build counter
          echo 0 > out/.version 2>/dev/null || mkdir -p out && echo 0 > out/.version

          # Spoof LINUX_COMPILER to match stock Pixel 8 build strings
          sed -i \
            's@^#define LINUX_COMPILER.*$@#define LINUX_COMPILER\t\t"Android (10087095, +pgo, +bolt, +lto, -mlgo, based on r487747c) clang version 17.0.2 (https://android.googlesource.com/toolchain/llvm-project d9f89f4d16663d5012e5c09495f3b30ece3d2362), LLD 17.0.2"@g' \
            scripts/mkcompile_h

          # Set build metadata env vars (picked up by Kbuild)
          echo "KBUILD_BUILD_VERSION=1"                          >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=build-user"                    >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=build-host"                    >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Mon Oct  6 16:50:48 UTC 2025" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=14587043"                           >> "$GITHUB_ENV"

          echo "Build string spoof applied."

      # ── 10. Build Kernel ─────────────────────────────────
      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH="${GCC_BIN}:${GCC32_BIN}:$PATH"
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"

          # ── defconfig ────────────────────────────────────
          make O=out \
            CROSS_COMPILE="${GCC_PATH}" \
            CC="${GCC_PATH}gcc" \
            ${{ env.DEFCONFIG }}

          # ── KSU + SUSFS — minimal feature set (simonpunk README) ──
          echo "→ Enabling KSU + SUSFS config options..."
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_SUS_MAP

          # ── Optional SUSFS features (workflow inputs) ─────
          if [ "${{ github.event.inputs.enable_sus_path }}" = "true" ]; then
            scripts/config --file out/.config -e CONFIG_KSU_SUSFS_SUS_PATH
          else
            scripts/config --file out/.config -d CONFIG_KSU_SUSFS_SUS_PATH
          fi

          if [ "${{ github.event.inputs.enable_sus_kstat }}" = "true" ]; then
            scripts/config --file out/.config -e CONFIG_KSU_SUSFS_SUS_KSTAT
          else
            scripts/config --file out/.config -d CONFIG_KSU_SUSFS_SUS_KSTAT
          fi

          if [ "${{ github.event.inputs.enable_open_redirect }}" = "true" ]; then
            scripts/config --file out/.config -e CONFIG_KSU_SUSFS_OPEN_REDIRECT
          else
            scripts/config --file out/.config -d CONFIG_KSU_SUSFS_OPEN_REDIRECT
          fi

          # ── Extra kernel features ─────────────────────────
          echo "→ Enabling extra kernel features..."
          scripts/config --file out/.config \
            -e CONFIG_TMPFS_XATTR \
            -e CONFIG_TMPFS_POSIX_ACL \
            -e CONFIG_IP_NF_TARGET_TTL \
            -e CONFIG_IP6_NF_TARGET_HL \
            -e CONFIG_IP6_NF_MATCH_HL \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_NET_SCH_FQ \
            -d CONFIG_TCP_CONG_BIC \
            -d CONFIG_TCP_CONG_WESTWOOD \
            -d CONFIG_TCP_CONG_HTCP \
            --set-str CONFIG_DEFAULT_TCP_CONG bbr \
            -e CONFIG_DEFAULT_BBR \
            -e CONFIG_BPF_STREAM_PARSER \
            -e CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            -e CONFIG_NETFILTER_XT_SET \
            -e CONFIG_IP_SET \
            --set-val CONFIG_IP_SET_MAX 65534 \
            -e CONFIG_IP_SET_BITMAP_IP \
            -e CONFIG_IP_SET_BITMAP_IPMAC \
            -e CONFIG_IP_SET_BITMAP_PORT \
            -e CONFIG_IP_SET_HASH_IP \
            -e CONFIG_IP_SET_HASH_IPMARK \
            -e CONFIG_IP_SET_HASH_IPPORT \
            -e CONFIG_IP_SET_HASH_IPPORTIP \
            -e CONFIG_IP_SET_HASH_IPPORTNET \
            -e CONFIG_IP_SET_HASH_IPMAC \
            -e CONFIG_IP_SET_HASH_MAC \
            -e CONFIG_IP_SET_HASH_NETPORTNET \
            -e CONFIG_IP_SET_HASH_NET \
            -e CONFIG_IP_SET_HASH_NETNET \
            -e CONFIG_IP_SET_HASH_NETPORT \
            -e CONFIG_IP_SET_HASH_NETIFACE \
            -e CONFIG_IP_SET_LIST_SET \
            -e CONFIG_IP6_NF_NAT \
            -e CONFIG_IP6_NF_TARGET_MASQUERADE

          # Regenerate to resolve any newly introduced symbols
          make O=out \
            CROSS_COMPILE="${GCC_PATH}" \
            CC="${GCC_PATH}gcc" \
            olddefconfig

          echo "→ Final config:"
          grep -E "^CONFIG_KSU|^CONFIG_TCP_CONG_BBR|^CONFIG_DEFAULT_BBR|^CONFIG_IP_SET[^_]" \
            out/.config | sort

          # ── Compile ───────────────────────────────────────
          echo "→ Compiling with $(nproc --all) threads..."
          time make O=out \
            CROSS_COMPILE="${GCC_PATH}" \
            CC="${GCC_PATH}gcc" \
            -j$(nproc --all) \
            2>&1 | tee build.log

          ccache --show-stats

          echo "→ Kernel images:"
          find out/arch/arm64/boot -maxdepth 1 -name 'Image*' 2>/dev/null \
            || { echo "::error::No kernel image found — build failed"; exit 1; }

      # ── 12. Package with AnyKernel3 ──────────────────────
      - name: Package with AnyKernel3
        run: |
          DATE=$(date +'%Y%m%d')
          BRANCH="${{ github.event.inputs.kernel_branch || '16.0.0-sultan' }}"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel3

          # Find best kernel image
          IMAGE=""
          for CAND in \
            kernel/out/arch/arm64/boot/Image.lz4-dtb \
            kernel/out/arch/arm64/boot/Image.lz4 \
            kernel/out/arch/arm64/boot/Image-dtb \
            kernel/out/arch/arm64/boot/Image
          do
            [ -f "$CAND" ] && { IMAGE="$CAND"; break; }
          done
          [ -z "$IMAGE" ] && { echo "::error::No kernel image found."; exit 1; }
          echo "Using image: $IMAGE"
          cp "$IMAGE" anykernel3/Image

          # DTBs / DTBOs
          DTB_DIR="kernel/out/arch/arm64/boot/dts"
          if [ -d "$DTB_DIR" ]; then
            find "$DTB_DIR" -name "*.dtb"  -exec cp {} anykernel3/ \; 2>/dev/null || true
            find "$DTB_DIR" -name "*.dtbo" -exec cp {} anykernel3/ \; 2>/dev/null || true
          fi

          # AnyKernel3 config — Pixel 8 (Shiba) only
          cat > anykernel3/anykernel.sh << EOF
          kernel.string=Sultan | KernelSU + SUSFS | GCC ${{ env.GCC_VERSION }} | ${DATE}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=shiba
          device.name2=zuma
          supported.versions=16
          supported.patchlevels=
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF

          ZIP="Sultan-Shiba-KSU-SUSFS-GCC${{ env.GCC_VERSION }}-${DATE}.zip"
          cd anykernel3 && zip -r9 "../$ZIP" . -x "*.git*" README.md && cd ..

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          sha256sum "$ZIP" | tee "${ZIP}.sha256"
          echo "Output: $ZIP  ($(du -sh "$ZIP" | cut -f1))"

      # ── 13. Upload artifacts ─────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          retention-days: 7

      # ── 14. Build summary ────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Result — Pixel 8 (Shiba)"
            echo "| | |"
            echo "|---|---|"
            echo "| Kernel branch | \`${{ github.event.inputs.kernel_branch || '16.0.0-sultan' }}\` |"
            echo "| KSU | Official — tiann/KernelSU |"
            echo "| SUSFS | \`${{ env.SUSFS_BRANCH }}\` |"
            echo "| GCC | ${{ env.GCC_VERSION }} |"
            echo "| SUS_PATH | ${{ github.event.inputs.enable_sus_path || 'false' }} |"
            echo "| SUS_KSTAT | ${{ github.event.inputs.enable_sus_kstat || 'false' }} |"
            echo "| OPEN_REDIRECT | ${{ github.event.inputs.enable_open_redirect || 'false' }} |"
            echo "| Spoof build strings | ${{ github.event.inputs.spoof_build_strings || 'false' }} |"
            [ -n "$ZIP" ] && echo "| Output | \`$ZIP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Publish release ──────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04
    if: github.event.inputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "Sultan-*"
          merge-multiple: true

      - name: Generate release notes
        run: |
          DATE=$(date +'%B %d, %Y')
          SUS_PATH="${{ github.event.inputs.enable_sus_path || 'false' }}"
          SUS_KSTAT="${{ github.event.inputs.enable_sus_kstat || 'false' }}"
          OPEN_REDIRECT="${{ github.event.inputs.enable_open_redirect || 'false' }}"
          SPOOF="${{ github.event.inputs.spoof_build_strings || 'false' }}"

          status() { [ "$1" = "true" ] && echo "✅" || echo "☐"; }

          cat > notes.md << EOF
          ## Sultan Kernel — Pixel 8 (Shiba) | Official KernelSU + SUSFS

          Built with **GCC ${{ env.GCC_VERSION }}** via GitHub Actions on ${DATE}.

          ### Requirements (per simonpunk README)
          - Full stock factory Pixel 8 (Shiba) images
          - 16.0.0-sultan supported \`boot.img\` and \`vendor_kernel_boot.img\`
          - Security Patch: **2026-02-05**

          ### SUSFS Feature Set
          | Feature | Status |
          |---------|--------|
          | CONFIG_KSU_SUSFS_SUS_MOUNT | ✅ enabled |
          | CONFIG_KSU_SUSFS_SPOOF_UNAME | ✅ enabled |
          | CONFIG_KSU_SUSFS_ENABLE_LOG | ✅ enabled |
          | CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS | ✅ enabled |
          | CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG | ✅ enabled |
          | CONFIG_KSU_SUSFS_SUS_MAP | ✅ enabled |
          | CONFIG_KSU_SUSFS_SUS_PATH | $(status $SUS_PATH) |
          | CONFIG_KSU_SUSFS_SUS_KSTAT | $(status $SUS_KSTAT) |
          | CONFIG_KSU_SUSFS_OPEN_REDIRECT | $(status $OPEN_REDIRECT) |
          | Spoof build strings | $(status $SPOOF) |

          ### Installation
          1. Unlock bootloader
          2. Flash via [HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher)
          3. Install [susfs4ksu-module](https://github.com/sidex15/susfs4ksu-module) via KSU manager
          4. Use official [KernelSU manager](https://github.com/tiann/KernelSU/releases)

          ### SHA-256 Checksums
          \`\`\`
          EOF
          cat *.sha256 2>/dev/null >> notes.md || echo "(see workflow artifacts)" >> notes.md
          echo '```' >> notes.md
          echo "" >> notes.md
          echo "> ⚠️ Flashing a custom kernel voids your warranty. Always back up your data first." >> notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  "sultan-shiba-ksu-susfs-${{ github.run_number }}"
          name:      "Sultan Pixel 8 | KSU + SUSFS | ${{ github.run_number }}"
