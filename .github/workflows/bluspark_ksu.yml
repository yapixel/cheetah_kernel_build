name: Bluspark KSU
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      repo:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string

jobs:
  build-kernel-bluspark-ksu-susfs:
    runs-on: ubuntu-latest
    env:
      CONFIG: gs
      OUT_DIR: out_gs

    steps:
      - name: Installing dependencies
        run: |
          sudo apt update
          sudo apt install -y jq gh curl zip unzip git

      - name: Install NDK r25c + Clang (FIXED)
        run: |
          set -euo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"
          NDK_ZIP="/tmp/android-ndk-r25c-linux.zip"
          NDK_ROOT="/opt/android-ndk-r25c"

          curl -L -o "$NDK_ZIP" "$NDK_URL"
          sudo unzip -q "$NDK_ZIP" -d /opt/

          CLANG_SRC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_DST="$HOME/android/toolchains/clang"
          mkdir -p "$CLANG_DST"
          cp -r "$CLANG_SRC/"* "$CLANG_DST/"

          # Safe PATH extension
          echo "$CLANG_DST/bin" >> "$GITHUB_PATH"

          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "CLANG_ROOT=$CLANG_DST" >> "$GITHUB_ENV"
          echo "CLANG_API=21" >> "$GITHUB_ENV"

          clang --version

      - name: Set CONFIG vars
        run: |
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Get Latest Bluspark Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/engstk/gs/tags --jq '.[0].name')
          [ -n "$TAG" ] || { echo "Failed to fetch tag"; exit 1; }
          echo "LATEST_BLUSPARK_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Clone repos
        run: |
          git clone https://github.com/TheWildJames/AnyKernel3.git -b sultan-zuma
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1
          git clone https://github.com/engstk/gs -b blu_spark-16-susfs
          git clone https://github.com/yapixel/kernel_patches.git
          git clone https://github.com/KOWX712/files.git kowsu_patches

      - name: Add KernelSU
        run: |
          cd "$CONFIG"
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s 37ef0d27067d3d7e7bf07a80547a1949864789c4
         

#      - name: Apply SUSFS patches
#        run: |
#          cd "$CONFIG"
#          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch .
#          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
#          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
#          patch -p1 -F 3 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true


      - name: KernelSU version
        run: |
          cd "$CONFIG/KernelSU/kernel"
          BASE=10200
          CNT=$(git rev-list --count HEAD)
          echo "KSUVER=$((CNT + BASE))" >> "$GITHUB_ENV"

      - name: Hide-stuff patch
        run: |
          cd "$CONFIG"
          cp ../kernel_patches/69_hide_stuff.patch .
          patch -p1 -F 3 < 69_hide_stuff.patch || exit 1

      # ------------------------------------------------------------------
      #  CONFIG – ONE echo PER LINE (NO cat << EOF)
      # ------------------------------------------------------------------
      - name: Add other CONFIGs
        run: |
          cd "$CONFIG"
          DEFCONFIG="arch/arm64/configs/blu_spark_defconfig"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$DEFCONFIG"
          echo "CONFIG_BPF_STREAM_PARSER=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_SET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_MAX=65534" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IP=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_MAC=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_LIST_SET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_NAT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> "$DEFCONFIG"
          echo "CONFIG_LZ4_COMPRESS=y" >> "$DEFCONFIG"
          echo "CONFIG_LZ4HC_COMPRESS=y" >> "$DEFCONFIG"

      - name: sed / perl tweaks
        run: |
          cd "$CONFIG"
          sed -i 's/CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-android14-11-blu_spark-16"/' arch/arm64/configs/blu_spark_defconfig
          sed -i 's/${LOCALVERSION+set}/set/' scripts/setlocalversion
          perl -pi -e 's/build-timestamp = \$\(or \$\(KBUILD_BUILD_TIMESTAMP\), \$\(build-timestamp-auto\)\)/build-timestamp = "Tue Jul 8 09:17:32 UTC 2025"/' init/Makefile

      - name: Disable stack protector globally (CRITICAL FIX – no cat)
        run: |
          cd "$CONFIG"
          DEFCONFIG="arch/arm64/configs/blu_spark_defconfig"

          # ---- Kconfig options -------------------------------------------------
          echo "CONFIG_CC_STACKPROTECTOR=n"               >> "$DEFCONFIG"
          echo "CONFIG_CC_STACKPROTECTOR_REGULAR=n"       >> "$DEFCONFIG"
          echo "CONFIG_CC_STACKPROTECTOR_STRONG=n"        >> "$DEFCONFIG"
          echo "CONFIG_STACKPROTECTOR=n"                  >> "$DEFCONFIG"
          echo "CONFIG_STACKPROTECTOR_PER_TASK=n"         >> "$DEFCONFIG"

          # ---- Force Clang to drop the flag everywhere -----------------------
          echo "KBUILD_CFLAGS += -fno-stack-protector"    >> "$DEFCONFIG"
          echo "KBUILD_AFLAGS += -fno-stack-protector"    >> "$DEFCONFIG"
          echo "KBUILD_CFLAGS_MODULE += -fno-stack-protector" >> "$DEFCONFIG"

          # Strip any existing -fstack‑protector* that might be added later
          echo "KBUILD_CFLAGS_MODULE := \$(filter-out -fstack-protector%, \$(KBUILD_CFLAGS_MODULE))" >> "$DEFCONFIG"
          echo "KBUILD_CFLAGS_MODULE := \$(filter-out -fstack-protector-strong%, \$(KBUILD_CFLAGS_MODULE))" >> "$DEFCONFIG"

          # ---- Remove any lingering flags from Makefile.modfinal ------------
          sed -i '/-fstack-protector/d' scripts/Makefile.modfinal || true
          sed -i '/stack-protector/d'   scripts/Makefile.modfinal || true
        

      
      - name: Build kernel (Clang + LLVM)
        run: |
          cd "$CONFIG"

          export SOURCE_DATE_EPOCH=$(date -d "Tue Jul 8 09:17:32 UTC 2025" +%s)
          export KBUILD_BUILD_USER=build-user
          export KBUILD_BUILD_HOST=build-host
          export ARCH=arm64

          make O="$OUT_DIR" \
               ARCH=arm64 \
               CC=clang \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               LLVM=1 \
               blu_spark_defconfig -j$(nproc)

          make O="$OUT_DIR" \
               ARCH=arm64 \
               CC=clang \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               LLVM=1 \
               V=1 -j$(nproc)

      - name: Compress to Image.lz4
        run: |
          set -euo pipefail
          sudo apt-get install -y liblz4-tool
          cd "$CONFIG"

          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
            gunzip -c "$OUT_DIR/arch/arm64/boot/Image.gz" | lz4 -12 -B4 --content-size > "$OUT_DIR/arch/arm64/boot/Image.lz4"
          else
            lz4 -12 -B4 --content-size "$OUT_DIR/arch/arm64/boot/Image" "$OUT_DIR/arch/arm64/boot/Image.lz4"
          fi

          echo "Image.lz4 ready:"
          ls -lh "$OUT_DIR/arch/arm64/boot/Image.lz4"

      
      - name: Copy images
        run: |
          cd "$CONFIG"
          [ -f "$OUT_DIR/arch/arm64/boot/Image.lz4" ] || exit 1
          cp "$OUT_DIR/arch/arm64/boot/Image.lz4" ../AnyKernel3/Image.lz4
          cat $OUT_DIR/google_devices/zuma/dts/*.dtb    > ../AnyKernel3/dtb 
           

      - name: Create ZIP
        run: |
          cd AnyKernel3
          ZIP="KowSU-${{ env.KSUVER }}-zuma_A16_Bluspark-${{ env.LATEST_BLUSPARK_TAG }}_SUSFS-${{ inputs.release_tag }}.zip"
          zip -r9 "../$ZIP" ./*
          echo "ZIP: $ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-kowsu
          path: "*.zip"
