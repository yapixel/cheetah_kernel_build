name: Bluspark KowSU
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      repo:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
  
jobs:
  build-kernel-bluspark-kowsu-susfs:
    runs-on: ubuntu-24.04  # Changed to x86_64 runner
    steps:
      - name: Installing dependencies
        run: |
          sudo apt update
          # Install dependencies for cross-compilation and other tools
          sudo apt install -y wget unzip build-essential flex bison libssl-dev libelf-dev bc binutils-aarch64-linux-gnu lz4 rustc dwarves
          # Download and extract x86_64 Clang/LLVM 17.0.6
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xJf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          echo "CLANG_BIN_PATH=$GITHUB_WORKSPACE/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04/bin" >> $GITHUB_ENV
          echo "CLANG_VERSION=17.0.6" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04/bin" >> $GITHUB_PATH
          echo "Clang/LLVM 17.0.6 installed in $GITHUB_WORKSPACE/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04"

      - name: Verify Clang and Linker Setup
        run: |
          export PATH=$GITHUB_WORKSPACE/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04/bin:$PATH
          echo "Verifying Clang version..."
          clang --version || { echo "Clang not found"; exit 1; }
          echo "Verifying lld version..."
          ld.lld --version || { echo "lld not found"; exit 1; }
          echo "Verifying aarch64-linux-gnu-ld availability (fallback)..."
          aarch64-linux-gnu-ld --version || echo "Using ld.lld as primary linker"
          echo "Verifying lz4 availability..."
          lz4 --version || { echo "lz4 not found"; exit 1; }
          echo "Verifying rustc availability..."
          rustc --version || { echo "rustc not found"; exit 1; }
          echo "Verifying pahole availability..."
          pahole --version || { echo "pahole not found"; exit 1; }
          echo "Verifying llvm-ar availability..."
          llvm-ar --version || { echo "llvm-ar not found"; exit 1; }
          echo "Clang and linker setup verified on x86_64 runner"

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="gs"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          echo "CONFIG set to: $CONFIG"

      - name: Get Latest Bluspark Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_BLUSPARK_TAG=$(gh api repos/engstk/gs/tags --jq '.[0].name')
          if [ -z "$LATEST_BLUSPARK_TAG" ]; then
            echo "Error: Could not fetch latest Bluspark tag"
            exit 1
          fi
          echo "LATEST_BLUSPARK_TAG=$LATEST_BLUSPARK_TAG" >> $GITHUB_ENV
          echo "Latest Bluspark tag: $LATEST_BLUSPARK_TAG"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."
          ANYKERNEL_BRANCH="sultan-${{ inputs.codename }}"
          SUSFS_BRANCH="gki-android14-6.1"
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"
          echo "Using branch for SUSFS: $SUSFS_BRANCH"
          git clone https://github.com/TheWildJames/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          git clone https://github.com/engstk/gs -b blu_spark-16
          git clone https://github.com/yapixel/kernel_patches.git 
          git clone https://github.com/KOWX712/files.git kowsu_patches

      - name: Add KernelSU
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Adding KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s main
          if [ ! -d "KernelSU" ]; then
            echo "Error: KernelSU directory not found after setup"
            exit 1
          fi
          echo "KernelSU directory contents:"
          ls -la KernelSU

      - name: Apply SUSFS Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Applying SUSFS patches..."
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 -F 3 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true
          cd ./KernelSU
          echo "Revert commit conflict with susfs"
          cp ../../kowsu_patches/KowSU/revert_commit_conflict_with_susfs.patch .
          patch -p1 --fuzz=3 < revert_commit_conflict_with_susfs.patch || { echo "Failed to apply revert_commit_conflict_with_susfs.patch"; exit 1; }
          echo "Apply KSU integration patches"
          cp ../../kowsu_patches/KowSU/enable_susfs_for_kowsu.patch ./
          patch -p1 < enable_susfs_for_kowsu.patch || { echo "Failed to apply enable_susfs_for_kowsu.patch"; exit 1; }
          echo "Checking for ksu_input_hook in patched files..."
          grep -r "ksu_input_hook" ../ || echo "ksu_input_hook not found in source"
          grep -r "ksu_vfs_read_hook" ../ || echo "ksu_vfs_read_hook not found in source"

      - name: Apply KSU Hook Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Applying manual hook patches..."
          cp ../kernel_patches/syscall_hook/min_scope_syscall_hooks_v1.5.patch ./
          patch -p1 --forward < min_scope_syscall_hooks_v1.5.patch || { echo "Failed to apply min_scope_syscall_hooks_v1.5.patch"; exit 1; }
          grep -r "ksu_input_hook" drivers/input/input.c || echo "ksu_input_hook not found in input.c"
          grep -r "ksu_vfs_read_hook" fs/read_write.c || echo "ksu_vfs_read_hook not found in read_write.c"

      - name: Getting KernelSU Version
        run: |
          cd "$CONFIG/KernelSU/kernel"
          BASE_VERSION=10200
          COMMIT_COUNT=$(/usr/bin/git rev-list --count HEAD)
          KSU_VERSION=$(expr $COMMIT_COUNT "+" $BASE_VERSION)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

      - name: Apply Hide Stuff Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch || { echo "Failed to apply 69_hide_stuff.patch"; exit 1; }

      - name: Add SUSFS Configuration Settings
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Adding KernelSU and SUSFS configurations..."
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_TCP_CONG_BBR=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_NET_SCH_FQ=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_TCP_CONG_BIC=n" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_TCP_CONG_HTCP=n" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_BPF_STREAM_PARSER=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP6_NF_NAT=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_LZ4_COMPRESS=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_LZ4HC_COMPRESS=y" >> ./arch/arm64/configs/blu_spark_defconfig
          echo "Verifying KernelSU and LZ4 config..."
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_LZ4" ./arch/arm64/configs/blu_spark_defconfig

      - name: Run sed and perl Commands
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Running sed commands..."
          sed -i 's/CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-android14-11-blu_spark-16"/' ./arch/arm64/configs/blu_spark_defconfig
          sed -i 's/${LOCALVERSION+set}/set/' ./scripts/setlocalversion
          perl -pi -e 's/build-timestamp = \$\(or \$\(KBUILD_BUILD_TIMESTAMP\), \$\(build-timestamp-auto\)\)/build-timestamp = "Tue Jul 8 09:17:32 UTC 2025"/' ./init/Makefile
          echo "Kernel version suffix set to -android14-11-blu_spark-16 without dirty state '+'"
          echo "Build timestamp set to Tue Jul 8 09:17:32 UTC 2025"

      - name: Build Kernel
        run: |
          KERNEL_PATH="$GITHUB_WORKSPACE/$CONFIG"
          CLANG_BIN_PATH="${{ env.CLANG_BIN_PATH }}"
          CLANG_VERSION="${{ env.CLANG_VERSION }}"
          
          if [ -d "$CLANG_BIN_PATH" ] && [ -x "$CLANG_BIN_PATH/clang" ]; then
            export PATH="$CLANG_BIN_PATH:$PATH"
            SELECTED_CLANG="$CLANG_BIN_PATH/clang"
          elif command -v clang >/dev/null 2>&1; then
            SELECTED_CLANG="$(command -v clang)"
          else
            echo "Error: Clang not found"
            exit 1
          fi
          
          LLVM_TOOLS="clang ld.lld llvm-ar llvm-objcopy llvm-objdump llvm-nm"
          MISSING_TOOLS=""
          for tool in $LLVM_TOOLS; do
            if ! command -v $tool >/dev/null 2>&1; then
              MISSING_TOOLS="$MISSING_TOOLS $tool"
            fi
          done
          
          if [ -n "$MISSING_TOOLS" ]; then
            echo "Error: Missing LLVM tools: $MISSING_TOOLS"
            exit 1
          fi
          
          KERNEL_VERSION="${{ inputs.kernel_version }}"
          if [[ "$KERNEL_VERSION" == "5.10" ]]; then
            USE_LLVM_IAS=true
          fi
          
          cd "$KERNEL_PATH" || { echo "Error: Failed to change to $KERNEL_PATH"; exit 1; }
          
          MAKE_ARGS="LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld HOSTLD=ld.lld"
          if [[ -v USE_LLVM_IAS ]]; then
            MAKE_ARGS="LLVM_IAS=1 $MAKE_ARGS"
          fi
          
          make -j$(nproc --all) O=out $MAKE_ARGS KCFLAGS+="-Wno-error -O2 -flto=thin -fno-stack-protector" blu_spark_defconfig || { echo "Failed to generate blu_spark_defconfig"; exit 1; }
          make -j$(nproc --all) O=out $MAKE_ARGS KCFLAGS+="-Wno-error -O2 -flto=thin -fno-stack-protector" || { echo "Kernel build failed"; exit 1; }
          # Verify output
          echo "Checking for kernel image..."
          ls -la out/arch/arm64/boot/ || echo "Output directory not found"

      - name: Copy Images
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Copying Image.lz4 and concatenating DTB files..."
          if [ ! -f "./out/arch/arm64/boot/Image.lz4" ]; then
            echo "Error: Image.lz4 not found in out/arch/arm64/boot/"
            ls -la out/arch/arm64/boot/ || echo "Boot directory not found"
            exit 1
          fi
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          if [ "${{ inputs.codename }}" == "gs201" ]; then
            cat ./out/google-devices/gs201/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "${{ inputs.codename }}" == "zuma" ]; then
            cat ./out/google-devices/zuma/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "${{ inputs.codename }}" == "zumapro" ]; then
            cat ./out/google-devices/zumapro/dts/*.dtb > ../AnyKernel3/dtb
          fi

      - name: Create ZIP Files for Different Formats
        run: |
          echo "Navigating to AnyKernel3 directory..."
          cd ./AnyKernel3
          ZIP_NAME="KowSU-${{ env.KSUVER }}-zuma_A16_Bluspark-${{ env.LATEST_BLUSPARK_TAG }}_SUSFS-${{ inputs.release_tag }}.zip"
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-kowsu
          path: |
            *.zip