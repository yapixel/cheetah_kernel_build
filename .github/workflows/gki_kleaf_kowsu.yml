name: GKI Kleaf KowSU 
permissions:
  contents: write
  actions: write
on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
        default: husky
      android_version:
        required: true
        type: string
        default: android14
      kernel_version:
        required: true
        type: string
        default: "6.1"
      sub_level: 
        required: true
        type: string
        default: "134"
      os_patch_level:
        required: true
        type: string
        default: "202505"  # Updated as requested
      maximize_space:
        required: false
        type: boolean
        default: true

jobs:
  build-kernel-kleaf-kowsu:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # -------------------------------------------------
      # 1. Maximize disk space (optional)
      # -------------------------------------------------
      - name: Maximize build space (optional)
        if: ${{ inputs.maximize_space }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          
      - name: Set CONFIG Environment Variable
        run: |
          # Set CONFIG dynamically based on inputs values
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

          echo "CONFIG set to: $CONFIG"
          
          
      # -------------------------------------------------
      # 2. Install dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            zip ccache curl git wget cpio python3 python3-pip device-tree-compiler \
            kmod dwarves pahole repo openjdk-11-jdk

      # -------------------------------------------------
      # 3. Install Repo
      # -------------------------------------------------
      - name: Install Repo
        run: |
          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      # -------------------------------------------------
      # 4. Clone patch repos
      # -------------------------------------------------
      - name: Clone dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          git clone https://github.com/TheWildJames/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          git clone https://github.com/yapixel/kernel_patches.git
          git clone https://github.com/KOWX712/files.git kowsu_patches

      # -------------------------------------------------
      # 5. Repo init & sync (6.1.134)
      # -------------------------------------------------
      - name: Initialize and Sync Kernel Source
        run: |
          echo "Creating folder for configuration: $CONFIG..."
          mkdir -p "$CONFIG"
          cd "$CONFIG"

          # Initialize and sync kernel source
          echo "Initializing and syncing kernel source..."
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          $REPO init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16

          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml

          # Check if branch is deprecated
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Found deprecated branch: $FORMATTED_BRANCH"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi

          # Sync repo and apply patches
          $REPO --version
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast

      # -------------------------------------------------
      # 8. Add KowSU
      # -------------------------------------------------
      - name: Add KernelSU
        run: |
          cd $CONFIG
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s master

      # -------------------------------------------------
      # 9. Apply SUSFS & KowSU patches
      # -------------------------------------------------
      - name: Apply SUSFS & KowSU patches
        run: |
          cd $CONFIG
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cp -r ../susfs4ksu/kernel_patches/fs/* ./common//fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          # Change to common directory and apply common SUSFS patch
          cd ./common
          patch --fuzz=10 -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true

          cd ../KernelSU
          cp ../../kowsu_patches/KowSU/revert_commit_conflict_with_susfs.patch .
          patch -p1 --fuzz=3 < revert_commit_conflict_with_susfs.patch
          cp ../../kowsu_patches/KowSU/enable_susfs_for_kowsu.patch .
          patch -p1 < enable_susfs_for_kowsu.patch
          cp ../../kernel_patches/kowsu/fix_ksud.c.patch .
          patch -p1 < fix_ksud.c.patch
          cp ../../kernel_patches/kowsu/fix_ksu.patch .
          patch -p1 --fuzz=3 < fix_ksu.patch
          cp ../../kowsu_patches/KowSU/fix_core_hook_kowsu.patch .
          patch -p1 --fuzz=3 < fix_core_hook_kowsu.patch
          
          
          

      # -------------------------------------------------
      # 10. Apply syscall hook
      # -------------------------------------------------
      - name: Apply manual syscall hook
        run: |
          cd "$CONFIG/common"
          cp ../../kernel_patches/syscall_hook/min_scope_syscall_hooks_v1.5.patch .
          patch -p1 --forward < min_scope_syscall_hooks_v1.5.patch

      # -------------------------------------------------
      # 11. Compute KSU version
      # -------------------------------------------------
      - name: Compute KernelSU version
        run: |
          cd "$CONFIG/KernelSU/kernel"
          BASE=10200
          COUNT=$(git rev-list --count HEAD)
          KSUVER=$(( BASE + COUNT ))
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV

      - name: Apply Hide Stuff Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG/common"
          cp ../../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch 

      # -------------------------------------------------
      # 12. Create config fragment (fixed LOCALVERSION)
      # -------------------------------------------------
      - name: Create GKI config fragment
        env:
          CODENAME: ${{ inputs.codename }}
        run: |
          cd $CONFIG
          FRAGMENT="common/arch/arm64/configs/${CODENAME}_fragment.config"

          cat > "$FRAGMENT" << 'EOF'
          # === Pixel 8 Pro Core Config ===
          CONFIG_ARM64_CORTEX_X3=y
          CONFIG_ARM64_CORTEX_A715=y
          CONFIG_ARM64_CORTEX_A510=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_ARM64_TAGGED_ADDR_ABI=y
          CONFIG_ARM64_SVE=y
          CONFIG_ARM64_BTI=y
          CONFIG_ARM64_PTR_AUTH=y
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_SCHEDUTIL=y
          CONFIG_CPU_FREQ=y
          CONFIG_CPUFREQ_DT=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_LTO_CLANG_THIN=y

          # === KowSU + SUSFS ===
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=n
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_CCACHE=y
          EOF

          # Fixed LOCALVERSION
          echo 'CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"' >> "$FRAGMENT"

          echo "FRAGMENT_PATH=$FRAGMENT" >> $GITHUB_ENV

      # -------------------------------------------------
      # 13. Build with Kleaf (6.1.134)
      # -------------------------------------------------
      - name: Build kernel with Kleaf
        run: |
          set -e
          cd "$CONFIG"

          cat > .build_config_local << EOF
          BUILD_CONFIG=common/build.config.gki.aarch64
          GKI_CONFIG_FRAGMENT=$FRAGMENT_PATH
          KLEAF_CHECK_ABI=false
          EOF

          tools/bazel run \
            --disk_cache=$HOME/.cache/bazel \
            --config=fast \
            --lto=thin \
            //common:kernel_aarch64_dist

      # -------------------------------------------------
      # 14. Package with AnyKernel3
      # -------------------------------------------------
      - name: Package kernel
        run: |
          cd $CONFIG
          DIST="out/dist"
          BOOT_IMG="$DIST/boot.img"
          VENDOR_DLKM="$DIST/vendor_dlkm.img"

          if [ ! -f "$BOOT_IMG" ]; then
            echo "ERROR: boot.img not found at $BOOT_IMG"
            exit 1
          fi

          cp -v "$BOOT_IMG" ../AnyKernel3/
          if [ -f "$VENDOR_DLKM" ]; then
            mkdir -p ../AnyKernel3/modules
            cp -v "$VENDOR_DLKM" ../AnyKernel3/modules/vendor_dlkm.img
          fi

          cd ../AnyKernel3
          mkdir -p ../builds
          ZIP_NAME="KowSU-${{ env.KSUVER }}-${{ inputs.codename }}_GKI-6.1.134_SUSFS.zip"
          ZIP_PATH="../builds/$ZIP_NAME"
          zip -r9 "$ZIP_PATH" ./* > /dev/null
          echo "ZIP_NAME=$ZIP_PATH" >> $GITHUB_ENV

      # -------------------------------------------------
      # 15. Upload artifact
      # -------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-kowsu-6.1
          path: ${{ env.ZIP_NAME }}
          retention-days: 3

      # -------------------------------------------------
      # 16. ccache stats
      # -------------------------------------------------
      - name: ccache statistics
        run: ccache -s
