
name: Cleanslate A16 GKI Kernel – tbalden correct tree

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      repo:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string


env:
  KERNEL_CORE_REPO: https://github.com/tbalden/google_common_aosp_simple.git
  KERNEL_CORE_BRANCH: aosp_cleanslate_a16_unified
  TBALDREN_DRIVERS_REPO: https://github.com/tbalden/google_common_kernel_drivers_simple.git
  TBALDREN_DRIVERS_BRANCH: cleanslate_unified_a16
  KERNEL_DIR: kernel
  OUT_DIR: out
  GKI_DEFCONFIG: gki_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # --------------------------------------------------
      # 1. Install tools
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git curl zip unzip bc bison flex libssl-dev \
            libelf-dev libncurses5-dev lz4 xz-utils cpio build-essential \
            device-tree-compiler gcc-aarch64-linux-gnu python3 python3-pip \
            liblz4-tool
          pip3 install pyelftools

      - name: Install NDK r25c + Clang
        run: |
          curl -L -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          sudo unzip -q /tmp/ndk.zip -d /opt/
          echo "/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # --------------------------------------------------
      # 2. Setup full tbalden tree (correct structure)
      # --------------------------------------------------
      - name: Setup tbalden tree
        run: |
          # 1. Core kernel
          git clone ${{ env.KERNEL_CORE_REPO }} -b ${{ env.KERNEL_CORE_BRANCH }} ${{ env.KERNEL_DIR }}
          cd ${{ env.KERNEL_DIR }}

          # 2. Clone drivers repo
          git clone ${{ env.TBALDREN_DRIVERS_REPO }} -b ${{ env.TBALDREN_DRIVERS_BRANCH }} tbalden_all

          # 3. Overlay open-source drivers (safe: no delete)
          rsync -a --ignore-existing tbalden_all/drivers/ drivers/

          # 4. Copy **full** devices/google/ (all devices)
          mkdir -p devices
          cp -r tbalden_all/devices/google devices/

          # 5. Copy google-modules
          cp -r tbalden_all/google-modules google-modules

          rm -rf tbalden_all

          echo "tbalden tree ready:"
          echo "  - devices/google/${{ inputs.codename }}/"
          echo "  - google-modules/"
          echo "  - drivers/ (overlayed safely)"

      # --------------------------------------------------
      # 3. Locate device defconfig (correct path)
      # --------------------------------------------------
      - name: Locate device defconfig
        id: defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}

          # tbalden uses: devices/google/<codename>/<codename>_defconfig or <codename>defconfig
          CANDIDATES=(
            "devices/google/${{ inputs.codename }}/${{ inputs.codename }}_defconfig"
            "devices/google/${{ inputs.codename }}/${{ inputs.codename }}defconfig"
            "devices/google/${{ inputs.codename }}/defconfig"
          )

          for f in "${CANDIDATES[@]}"; do
            if [ -f "$f" ]; then
              echo "Found: $f"
              echo "path=$f" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "ERROR: defconfig not found for ${{ inputs.codename }}"
          echo "Tried:"
          for f in "${CANDIDATES[@]}"; do echo "  $f"; done
          exit 1

      # --------------------------------------------------
      # 4. Merge GKI + device defconfig
      # --------------------------------------------------
      - name: Prepare defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}
          cp arch/arm64/configs/${{ env.GKI_DEFCONFIG }} .config
          scripts/kconfig/merge_config.sh .config ${{ steps.defconfig.outputs.path }}

          # Cleanslate extras
          cat <<'EOF' >> .config
          CONFIG_LOCALVERSION="-cleanslate"
          CONFIG_DEBUG_FS=y
          CONFIG_MODULES=y
          CONFIG_WIREGUARD=y
          EOF

          make O=${{ env.OUT_DIR }} olddefconfig

      # --------------------------------------------------
      # 5. Build kernel + DTBO
      # --------------------------------------------------
      - name: Build kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          make O=${{ env.OUT_DIR }} -j$(nproc)
          make O=${{ env.OUT_DIR }} dtbs -j$(nproc)

      # --------------------------------------------------
      # 6. Build vendor modules
      # --------------------------------------------------
      - name: Build vendor modules
        run: |
          cd ${{ env.KERNEL_DIR }}/google-modules
          for d in */; do
            [ -f "$d/Makefile" ] || continue
            make -C ../ M=$(pwd)/$d O=../${{ env.OUT_DIR }} \
              CC=clang LD=ld.lld LLVM=1 -j$(nproc) modules
          done

      # --------------------------------------------------
      # 7. Package images
      # --------------------------------------------------
      - name: Package images
        run: |
          cd ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}

          # Image.lz4
          lz4 -12 -B4 --content-size arch/arm64/boot/Image arch/arm64/boot/Image.lz4

          # dtbo.img
          cat arch/arm64/boot/dts/google/*.dtbo > dtbo.img 2>/dev/null || true

          # vendor_boot.img
          mkdir -p vendor_boot/modules
          find ../google-modules -name "*.ko" -exec cp {} vendor_boot/modules/ \;
          tar -cf vendor_boot.img -C vendor_boot .

      # --------------------------------------------------
      # 8. AnyKernel3 ZIP
      # --------------------------------------------------
      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image.lz4 AnyKernel3/
          cp ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/dtbo.img AnyKernel3/ || true
          cp ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/vendor_boot.img AnyKernel3/

          cd AnyKernel3
          sed -i "s/device.name1=.*/device.name1=${{ inputs.codename }}/" anykernel.sh
          sed -i "s|block=.*|block=/dev/block/by-name/boot|" anykernel.sh

          ZIP="Cleanslate-A16-${{ inputs.codename }}-${{ inputs.release_tag }}.zip"
          zip -r9 "../$ZIP" . -x ".git*" "README.md"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-cleanslate
          path: "*.zip"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.zip"
          tag: ${{ inputs.release_tag }}
          name: Cleanslate A16 GKI ${{ inputs.codename }}
          body: |
            **tbalden Cleanslate A16 – 100% correct tree**

            * `devices/google
