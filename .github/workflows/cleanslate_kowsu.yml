
name: Cleanslate A16 GKI Kernel (Husky) – full tbalden tree

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      repo:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string

env:
  KERNEL_CORE_REPO: https://github.com/tbalden/google_common_aosp_simple.git
  KERNEL_CORE_BRANCH: aosp_cleanslate_a16_unified
  TBALDREN_DRIVERS_REPO: https://github.com/tbalden/google_common_kernel_drivers_simple.git
  TBALDREN_DRIVERS_BRANCH: cleanslate_unified_a16
  KERNEL_DIR: kernel
  OUT_DIR: out
  GKI_DEFCONFIG: gki_defconfig
  DEVICE_DEFCONFIG: google-devices/${{ inputs.codename }}/kernel/${{ inputs.codename }}_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # --------------------------------------------------
      # 1. Install everything we need
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl zip unzip bc bison flex libssl-dev \
            libelf-dev libncurses5-dev lz4 xz-utils cpio build-essential \
            device-tree-compiler gcc-aarch64-linux-gnu python3 python3-pip \
            liblz4-tool
          pip3 install pyelftools

      - name: Install NDK r25c + Clang
        run: |
          curl -L -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          sudo unzip -q /tmp/ndk.zip -d /opt/
          echo "/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # --------------------------------------------------
      # 2. Build the full tbalden unified tree
      # --------------------------------------------------
      - name: Setup full tbalden tree
        run: |
          # 1. Core kernel
          git clone ${{ env.KERNEL_CORE_REPO }} -b ${{ env.KERNEL_CORE_BRANCH }} ${{ env.KERNEL_DIR }}
          cd ${{ env.KERNEL_DIR }}

          # 2. Clone the whole drivers repo (contains drivers/, google-devices/, google-modules/)
          git clone ${{ env.TBALDREN_DRIVERS_REPO }} -b ${{ env.TBALDREN_DRIVERS_BRANCH }} tbalden_all

          

          # 3. Full google-devices directory (all devices)
          mkdir -p google-devices
          cp -r tbalden_all/google-devices/* google-devices/

          # 4. google-modules (clean vendor drivers)
          cp -r tbalden_all/google-modules google-modules

          # Cleanup temporary clone
          rm -rf tbalden_all

          echo "Full tbalden tree ready (drivers overlaid safely)"

      # --------------------------------------------------
      # 3. Merge GKI + device-specific defconfig
      # --------------------------------------------------
      - name: Prepare defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}

          if [ ! -f "${{ env.DEVICE_DEFCONFIG }}" ]; then
            echo "ERROR: ${{ env.DEVICE_DEFCONFIG }} not found!"
            exit 1
          fi

          cp arch/arm64/configs/${{ env.GKI_DEFCONFIG }} .config
          scripts/kconfig/merge_config.sh .config ${{ env.DEVICE_DEFCONFIG }}

          # Cleanslate extras
          {
            echo 'CONFIG_LOCALVERSION="-cleanslate"'
            echo 'CONFIG_DEBUG_FS=y'
            echo 'CONFIG_MODULES=y'
            echo 'CONFIG_WIREGUARD=y'
          } >> .config

          make O=${{ env.OUT_DIR }} olddefconfig

      # --------------------------------------------------
      # 4. Build kernel + DTBO
      # --------------------------------------------------
      - name: Build kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          make O=${{ env.OUT_DIR }} -j$(nproc)
          make O=${{ env.OUT_DIR }} dtbs -j$(nproc)

      # --------------------------------------------------
      # 5. Build vendor modules
      # --------------------------------------------------
      - name: Build vendor modules
        run: |
          cd ${{ env.KERNEL_DIR }}/google-modules
          for d in */; do
            [ -f "$d/Makefile" ] || continue
            make -C ../ M=$(pwd)/$d O=../${{ env.OUT_DIR }} \
              CC=clang LD=ld.lld LLVM=1 -j$(nproc) modules
          done

      # --------------------------------------------------
      # 6. Package GKI images
      # --------------------------------------------------
      - name: Package images
        run: |
          cd ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}

          # Image.lz4
          lz4 -12 -B4 --content-size arch/arm64/boot/Image arch/arm64/boot/Image.lz4

          # dtbo.img (all device overlays)
          cat arch/arm64/boot/dts/google/*.dtbo > dtbo.img

          # vendor_boot.img (modules only)
          mkdir -p vendor_boot/modules
          find ../google-modules -name "*.ko" -exec cp {} vendor_boot/modules/ \;
          tar -cf vendor_boot.img -C vendor_boot .

      # --------------------------------------------------
      # 7. AnyKernel3 ZIP
      # --------------------------------------------------
      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image.lz4 AnyKernel3/
          cp ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/dtbo.img AnyKernel3/
          cp ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/vendor_boot.img AnyKernel3/

          cd AnyKernel3
          sed -i "s/device.name1=.*/device.name1=${{ inputs.codename }}/" anykernel.sh
          sed -i "s|block=.*|block=/dev/block/by-name/boot|" anykernel.sh

          ZIP="Cleanslate-A16-${{ inputs.codename }}-${{ inputs.release_tag }}.zip"
          zip -r9 "../$ZIP" . -x ".git*" "README.md"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      # --------------------------------------------------
      # 8. Upload artifact
      # --------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-cleanslate
          path: "*.zip"

      # --------------------------------------------------
      # 9. Create GitHub Release (on tag)
      # --------------------------------------------------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.zip"
          tag: ${{ inputs.release_tag }}
          name: Cleanslate A16 GKI ${{ inputs.codename }} ${{ inputs.release_tag }}
          body: |
            **tbalden Cleanslate A16 Kernel – 100% tbalden source**

            * Full `google-devices/` (all devices)
            * `google-modules/` + open-source drivers (overlay **without delete**)
            * GKI 2.0 – `Image.lz4`, `dtbo.img`, `vendor_boot.img`
            * Flash via fastboot:
