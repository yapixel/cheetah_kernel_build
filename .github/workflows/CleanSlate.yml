    - name: Package kernel + modules
      run: |
        IMAGE="${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image"
        cp -fv "$IMAGE" "${{ env.ANYKERNEL_DIR }}"/

        mkdir -p "${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules"
        find ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }} -name '*.ko' -exec cp {} "${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules/" \;
        ${{ env.ARM64_TOOLCHAIN }}strip --strip-unneeded "${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules/"*.ko 2>/dev/null || true

        cd "${{ env.ANYKERNEL_DIR }}"
        rm -rf .git

        BUILD_VER=$(curl -s https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/version || echo "40000")
        # FIXED: Safe timestamp without colon or T that breaks artifact names
        TIMESTAMP=$(date -u +"%Y%m%d-%H%M")           # → 20251127-0802
        BUILD_LABEL="${TIMESTAMP}-${{ env.GIT_SHORT_SHA }}"
        ZIP_NAME="${{ env.ZIP_PREFIX }}-${BUILD_LABEL}-${BUILD_VER}.zip"

        zip -r9 "../${ZIP_NAME}" ./*
        mkdir -p "../${{ env.BUILDS_DIR }}"
        mv "../${ZIP_NAME}" "../${{ env.BUILDS_DIR }}/"

        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "BUILD_VER=${BUILD_VER}" >> $GITHUB_ENV

    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
        retention-days: 30

    - name: Generate build info
      run: |
        cat > build_info.txt << EOF
        Build Information
        =================
        Device: Pixel 8 Pro (husky) / Pixel 8a support enabled
        Kernel Version: 6.1.134
        Build Number: ${{ env.BUILD_VER }}
        Build Date: $(date -u)
        Commit: ${{ github.sha }}
        LTO: ${{ env.LTO_TYPE }}
        Features: SukiSU-Ultra + SuSFS + Google modules + BBR + IPSet
        EOF
        cat build_info.txt

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build_info.txt
        retention-days: 30

    - name: Create GitHub Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
          build_info.txt
        body: |
          Pixel 8 Pro (husky) CleanSlate Kernel with SukiSU-Ultra
          Build: ${{ env.BUILD_VER }} • LTO: ${{ env.LTO_TYPE }} • $(date -u +"%Y-%m-%d %H:%M UTC")