name: Build Pixel 8 Pro (husky) Kernel – Android 16

on:
  push:
    branches: [ main, husky ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1,4'   # Every Monday & Thursday at 06:00 UTC
  workflow_dispatch:        # Manual trigger

jobs:
  build-husky-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lz4 zstd cpio \
                                  python3 python3-pip wget git curl xz-utils

      - name: Create kernel directory
        run: mkdir -p kernel_husky && cd kernel_husky

      - name: Clone tbalden AOSP common base (husky-compatible)
        run: |
          git clone --depth 1 --branch aosp_cleanslate_a16_shusky \
            https://github.com/tbalden/google_common_aosp_simple.git kernel_source

      - name: Clone Google drivers overlay
        run: |
          git clone --depth 1 --branch cleanslate_shusky_a16 \
            https://github.com/tbalden/google_common_kernel_drivers_simple.git kernel_source/drivers/google

      - name: Download and setup Clang 22
        run: |
         mkdir -p $HOME/clang
         cd $HOME/clang
        
         # Download Clang 22 from ZyCromerZ
         wget https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz -O clang.tar.gz
         tar -xzf clang.tar.gz
         rm clang.tar.gz
         
         echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
         echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Download ARM64 GNU Toolchain 14.3.rel1
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O tc.tar.xz
          tar -xJf tc.tar.xz
          rm tc.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*)
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Download ARM32 GNU Toolchain 14.3.rel1
        run: |
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -O tc-arm.tar.xz
          tar -xJf tc-arm.tar.xz
          rm tc-arm.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*arm-none-eabi*)
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/arm-none-eabi-" >> $GITHUB_ENV

      - name: Configure Pixel 8 Pro
        if: env.PIXEL8A == 'y'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
         CONFIG="${{ env.CONFIG_FILE }}"
        
         # Add Pixel 8a specific configurations
         cat >> "$CONFIG" << EOF
         CONFIG_ARM64_CORTEX_X3=y
         CONFIG_ARM64_CORTEX_A715=y
         CONFIG_ARM64_CORTEX_A510=y
         CONFIG_ARM64_VA_BITS=48
         CONFIG_ARM64_PA_BITS=48
         CONFIG_ARM64_TAGGED_ADDR_ABI=y
         CONFIG_ARM64_SVE=y
         CONFIG_ARM64_BTI=y
         CONFIG_ARM64_PTR_AUTH=y
         CONFIG_SCHED_MC=y
         CONFIG_SCHED_CORE=y
         CONFIG_ENERGY_MODEL=y
         CONFIG_UCLAMP_TASK=y
         CONFIG_UCLAMP_TASK_GROUP=y
         CONFIG_SCHEDUTIL=y
         CONFIG_CPU_FREQ=y
         CONFIG_CPUFREQ_DT=y
         CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
         CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
         CONFIG_STACKPROTECTOR=n
         CONFIG_STACKPROTECTOR_STRONG=n
         EOF

      - name: Configure LTO
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
         CONFIG="${{ env.CONFIG_FILE }}"
         sed -i -E '/^CONFIG_LTO_(CLANG_(FULL|THIN)|NONE)=/d' "$CONFIG" || true
        
         case "${{ env.LTO_TYPE }}" in
          full) echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG" ;;
          thin) echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG" ;;
          none) echo "CONFIG_LTO_NONE=y" >> "$CONFIG" ;;
         esac

      - name: Build kernel (husky only)
        run: |
          cd kernel_source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export CROSS_COMPILE="$(pwd)/../prebuilts_gcc/bin/aarch64-linux-android-"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          make O=out CC=clang husky_defconfig
          make O=out CC=clang -j$(nproc --all)

      - name: Prepare artifacts
        run: |
          mkdir -p ../artifacts
          cp kernel_source/out/arch/arm64/boot/Image ../artifacts/Image-husky
          cp kernel_source/out/arch/arm64/boot/dtb.img ../artifacts/dtb-husky.img
          cp kernel_source/out/arch/arm64/boot/dtbo.img ../artifacts/dtbo-husky.img

          cd ../artifacts
          sha256sum * > sha256sums.txt
          ls -lh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: husky-kernel-android16-${{ github.sha }}
          path: artifacts/
          retention-days: 30

      - name: Upload as Release (only on main branch only )
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: husky-nightly-${{ github.run_date || github.run_number }}
          name: Pixel 8 Pro (husky) Kernel – Nightly Build
          body: |
            Automated build from tbalden cleanslate A16 repos
            Commit: ${{ github.sha }}
            Built on: ${{ github.run_date }}
          files: |
            artifacts/Image-husky
            artifacts/dtb-husky.img
            artifacts/dtbo-husky.img
            artifacts/sha256sums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
