name: Build CleanSlate Android Kernel with SukiSU

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      pixel8a:
        description: 'Enable Pixel 8a configuration (y/n)'
        required: false
        default: 'y'
      lto_type:
        description: 'LTO type (full/thin/none)'
        required: false
        default: 'thin'
      build_clean:
        description: 'Build clean mode (always/auto/never)'
        required: false
        default: 'always'

env:
  BUILD: dev
  PIXEL8A: ${{ github.event.inputs.pixel8a || 'y' }}
  LTO_TYPE: ${{ github.event.inputs.lto_type || 'thin' }}
  ZIP_PREFIX: AK3-A14-6.1.134-SukiSU
  KERNEL_DIR: common
  CONFIG_FILE: arch/arm64/configs/gki_defconfig
  OUT_DIR: out
  BUILD_CLEAN: ${{ github.event.inputs.build_clean || 'always' }}
  ANYKERNEL_DIR: AnyKernel3-p8a
  ANYKERNEL_BRANCH: gki-2.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  PATCHES_BRANCH: dev
  BUILDS_DIR: builds/6.1.134
  GIT_SHORT_SHA: ${{ github.event.pull_request.head.sha && github.event.pull_request.head.sha || github.sha }}

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize disk space
        run: |
          echo "===== Initial Disk Space ====="
          df -h
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          echo "GIT_SHORT_SHA=$(echo ${{ env.GIT_SHORT_SHA }} | cut -c1-7)" >> $GITHUB_ENV
          echo "THREADS=$(nproc)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            zip ccache curl git wget cpio python3 python3-pip device-tree-compiler \
            kmod dwarves pahole zlib1g-dev xxd

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-build-${{ env.LTO_TYPE }}
          max-size: 5G

      - name: Download Clang (android14-release r487747c)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Download ARM64 GNU Toolchain 14.3.rel1
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Download ARM32 GNU Toolchain 14.3.rel1
        run: |
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xJf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-" >> $GITHUB_ENV

      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/tbalden/google_common_aosp_simple.git -b aosp_cleanslate_a16_shusky ${{ env.KERNEL_DIR }}

      - name: Clone Google drivers overlay
        run: |
          git clone --depth=1 --branch cleanslate_shusky_a16 \
            https://github.com/tbalden/google_common_kernel_drivers_simple.git ${{ env.KERNEL_DIR }}/drivers/google

      - name: Clone supporting repos
        run: |
          git clone -b ${{ env.SUSFS_BRANCH }} ${{ env.SUSFS_REPO }} susfs4ksu
          git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} https://github.com/deepongi-labs/${{ env.ANYKERNEL_DIR }} ${{ env.ANYKERNEL_DIR }}
          git clone --depth=1 -b ${{ env.PATCHES_BRANCH }} ${{ env.PATCHES_REPO }} kernel_patches

      #- name: Prepare kernel source
       # working-directory: ${{ env.KERNEL_DIR }}
       # run: |
       #   git clean -fdx || true
       #   rm -rf KernelSU-Next || true

      - name: Pixel 8a specific config (if enabled)
        if: env.PIXEL8A == 'y'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cat >> "${{ env.CONFIG_FILE }}" << 'EOF'
          CONFIG_ARM64_CORTEX_X3=y
          CONFIG_ARM64_CORTEX_A715=y
          CONFIG_ARM64_CORTEX_A510=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_ARM64_TAGGED_ADDR_ABI=y
          CONFIG_ARM64_SVE=y
          CONFIG_ARM64_BTI=y
          CONFIG_ARM64_PTR_AUTH=y
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_SCHEDUTIL=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_STACKPROTECTOR=n
          CONFIG_STACKPROTECTOR_STRONG=n
          CONFIG_RETPOLINE=n
          CONFIG_CC_HAS_RETPOISON=n
          CONFIG_AS_HAS_NO_RETPOISON=n
          CONFIG_USERLAND_WORKER_PACKED_HOSTS=n
          EOF

      - name: Configure LTO
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i -E '/^CONFIG_LTO_(CLANG_(FULL|THIN)|NONE)=/d' "${{ env.CONFIG_FILE }}" || true
          case "${{ env.LTO_TYPE }}" in
            full) echo "CONFIG_LTO_CLANG_FULL=y" >> "${{ env.CONFIG_FILE }}" ;;
            thin) echo "CONFIG_LTO_CLANG_THIN=y" >> "${{ env.CONFIG_FILE }}" ;;
            none) echo "CONFIG_LTO_NONE=y" >> "${{ env.CONFIG_FILE }}" ;;
          esac

      - name: Add SukiSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

      - name: Apply SUSFS patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cp -fv ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp -fv ../kernel_patches/sukisu/scope_min_manual_hooks_v1.5.patch ./
          cp -fv ../kernel_patches/sukisu/fix_namei.c.patch ./
          cp -fv ../kernel_patches/sukisu/fix_read_write.c.patch ./
          
          mkdir -p fs include/linux
          cp -rfv ../susfs4ksu/kernel_patches/fs/* ./fs/ || true
          cp -rfv ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ || true
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true
          patch -p1 < scope_min_manual_hooks_v1.5.patch || true
          patch -p1 < fix_read_write.c.patch
          patch -p1 < fix_namei.c.patch 
          
          
      - name: Collect and upload patch debugging artifacts
        if: always()
        run: |
          ARTIFACT_DIR="${{ github.workspace }}/patch_debug_artifacts"
          mkdir -p "$ARTIFACT_DIR"

          echo "=== Collecting patch debugging artifacts ==="

          # 1. All .rej files (with full path preserved)
          find ${{ github.workspace }} -name "*.rej" -type f -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          # 2. All .orig files created by `patch --reject-format=unified`
          find ${{ github.workspace }} -name "*.orig" -type f -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          # 3. The actual source files that produced rejects (strip .rej extension)
          find ${{ github.workspace }} -name "*.rej" -type f | while read rej; do
           orig_file="${rej%.rej}"
          if [ -f "$orig_file" ]; then
            echo "Including partially-patched file: $orig_file"
            cp --parents "$orig_file" "$ARTIFACT_DIR/" 2>/dev/null || true
          fi
          # Also include the pre-patched version if .orig exists
          orig_version="${orig_file}.orig"
          if [ -f "$orig_version" ]; then
            cp --parents "$orig_version" "$ARTIFACT_DIR/" 2>/dev/null || true
          fi
          done

          # 4. All patch files used in this build (for reference)
          find ${{ github.workspace }} -name "*.patch" -type f -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          # 5. Show summary
          echo "=== Contents of patch_debug_artifacts ==="
          find "$ARTIFACT_DIR" -type f | sort || echo "No debugging artifacts found"

      - name: Upload patch debugging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: patch-debug-${{ github.run_id }}-${{ github.run_attempt }}
         path: ${{ github.workspace }}/patch_debug_artifacts/**
         retention-days: 14
         if-no-files-found: ignore

      - name: Final kernel config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CONFIG="${{ env.CONFIG_FILE }}"
          rm -f android/abi_gki_protected_exports_* || true
          sed -i '/^CONFIG_DEBUG_INFO_BTF/d' "$CONFIG"
          echo "# CONFIG_DEBUG_INFO_BTF is not set" >> "$CONFIG"

          cat >> "$CONFIG" << 'EOF'
          CONFIG_LOCALVERSION=""
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          EOF

      - name: Disable userland_worker
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i '/userland_worker\.o/d' init/Makefile
          sed -i '/^CONFIG_USERLAND_WORKER/d' "${{ env.CONFIG_FILE }}"
          echo "# CONFIG_USERLAND_WORKER is not set" >> "${{ env.CONFIG_FILE }}"

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ env.BUILD_CLEAN }}" = "always" ]; then rm -rf ${{ env.OUT_DIR }}; fi
          mkdir -p ${{ env.OUT_DIR }}

          make -j${{ env.THREADS }} \
            LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CC="ccache clang" LD=ld.lld HOSTLD=ld.lld \
            KCFLAGS="-fno-stack-protector" \
            O="${{ env.OUT_DIR }}" gki_defconfig all

          make -j${{ env.THREADS }} \
            LLVM=1 LLVM_IAS=1 ARCH=arm64 O="${{ env.OUT_DIR }}" modules

      - name: Package AnyKernel3 zip (SAFE FILENAME - NO COLON)
        run: |
         cp -fv ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image ${{ env.ANYKERNEL_DIR }}/

         mkdir -p ${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules
         find ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }} -name "*.ko" -exec cp {} ${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules/ \;
         ${{ env.ARM64_TOOLCHAIN }}strip --strip-unneeded ${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules/*.ko 2>/dev/null || true

         cd ${{ env.ANYKERNEL_DIR }}
         rm -rf .git

         

         TIMESTAMP=$(date -u +"%Y%m%d-%H%M")                    # SAFE: 20251127-1423
         ZIP_NAME="${{ env.ZIP_PREFIX }}-${TIMESTAMP}-${{ env.GIT_SHORT_SHA }}.zip"

         zip -r9 "../${ZIP_NAME}" ./*
         mkdir -p "../${{ env.BUILDS_DIR }}"
         mv "../${ZIP_NAME}" "../${{ env.BUILDS_DIR }}/"

         echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
         # Removed BUILD_VER from GITHUB_ENV if you don't need it elsewhere
         echo "BUILD_VER=${BUILD_VER}" >> $GITHUB_ENV || true
         
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Generate build info
        run: |
          cat > build_info.txt << EOF
          CleanSlate Kernel + SukiSU-Ultra
          Device: Pixel 8 Pro (husky) / Pixel 8a ready
          Kernel: 6.1.134
          Build: ${{ env.BUILD_VER }}
          Date: $(date -u)
          Commit: ${{ github.sha }}
          LTO: ${{ env.LTO_TYPE }}
          Timestamp: $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info.txt
          path: build_info.txt

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
            build_info.txt
          body: |
            CleanSlate Kernel with SukiSU-Ultra
            Build ${{ env.BUILD_VER }} • LTO ${{ env.LTO_TYPE }} • $(date -u +"%Y-%m-%d %H:%M UTC")
