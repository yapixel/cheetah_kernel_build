name: Build CleanSlate with SukiSU

on:
  workflow_dispatch:
    inputs:
      pixel8a:
        description: 'Enable Pixel 8a configuration (y/n)'
        required: false
        default: 'y'
      lto_type:
        description: 'LTO type (full/thin/none)'
        required: false
        default: 'none'
      build_clean:
        description: 'Build clean mode (always/auto/never)'
        required: false
        default: 'always'

env:
  # Build configuration
  BUILD: dev
  PIXEL8A: ${{ github.event.inputs.pixel8a || 'y' }}
  LTO_TYPE: ${{ github.event.inputs.lto_type || 'thin' }}
  ZIP_PREFIX: AK3-A14-6.1.145-KowSU
  KERNEL_DIR: common
  KERNEL_VERSION: 6.1.145
  CONFIG_FILE: gki_defconfig
  OUT_DIR: out
  BUILD_CLEAN: ${{ github.event.inputs.build_clean || 'always' }}
  RETRY: 3
  REPO_DEPTH: 1
  KSUN_BRANCH: master
  ANYKERNEL_DIR: AnyKernel3-p8a
  ANYKERNEL_BRANCH: gki-2.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1
  SUSFS_COMMIT: a162e2469d0b472545e5e46457eee171c0975fb0
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  PATCHES_BRANCH: dev
  BUILDS_DIR: builds/6.1.145
  LOCALVERSION:
  
  # Compiler configuration
  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CLANG_VERSION: 17.0.2
  
  # KernelSU version calculation constants
  KSU_BASE_VERSION: 40000
  KSU_COMMIT_OFFSET: 2815
  
  # GitHub-specific
  GIT_SHORT_SHA: ${{ github.event.pull_request.head.sha && github.event.pull_request.head.sha || github.sha }}

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Check Initial Disk Space
      run: |
        echo "===== Initial Total Disk Space in GB ====="
        df -BG
          
    - name: Download Apache Arrow's util_free_space.sh
      run: |
        curl -L -o util_free_space.sh https://raw.githubusercontent.com/yapixel/kernel_patches/refs/heads/dev/util_free_space.sh
        chmod +x util_free_space.sh
        ./util_free_space.sh
          
    - name: Check Disk Space After Cleanup
      run: |
        echo "===== Total Disk Space After Cleanup in GB ====="
        df -BG

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "GIT_SHORT_SHA=$(echo ${{ env.GIT_SHORT_SHA }} | cut -c1-7)" >> $GITHUB_ENV
        echo "THREADS=$(nproc)" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          zip \
          ccache \
          curl \
          git \
          wget \
          cpio \
          python3 \
          python3-pip \
          device-tree-compiler \
          kmod \
          dwarves \
          pahole

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: kernel-build-${{ env.LTO_TYPE }}
        max-size: 5G

    
          
    - name: Download Clang 17.0.2 (r487747c)
      run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r29/clang-r487747c.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          $HOME/clang/bin/clang --version | head -1
          echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
          echo "$HOME/clang/bin" >> $GITHUB_PATH

    - name: Download ARM64 GNU Toolchain 14.3.rel1
      run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O tc.tar.xz
          tar -xJf tc.tar.xz
          rm tc.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*)
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

    - name: Download ARM32 GNU Toolchain 14.3.rel1
      run: |
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -O tc-arm.tar.xz
          tar -xJf tc-arm.tar.xz
          rm tc-arm.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*arm-none-eabi*)
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/arm-none-eabi-" >> $GITHUB_ENV


    - name: Clone kernel source
      run: |
        git clone --depth=1 https://github.com/tbalden/google_common_aosp_simple.git -b aosp_cleanslate_a16_shusky ${{ env.KERNEL_DIR }}
        
    - name: Clone Google drivers overlay
      run: |
        git clone --depth 1 --branch cleanslate_shusky_a16 \
          https://github.com/tbalden/google_common_kernel_drivers_simple.git ${{ env.KERNEL_DIR }}/drivers/google

    - name: Setup repositories
      run: |
        # Clone susfs4ksu
        echo "Cloning susfs4ksu..."
        git clone -b ${{ env.SUSFS_BRANCH }} ${{ env.SUSFS_REPO }} susfs4ksu
        #cd susfs4ksu
        #git checkout ${{ env.SUSFS_COMMIT }}
        #cd ../
        
        # Clone AnyKernel3
        echo "Cloning AnyKernel3..."
        git clone --depth=${{ env.REPO_DEPTH }} -b ${{ env.ANYKERNEL_BRANCH }} \
          https://github.com/deepongi-labs/${{ env.ANYKERNEL_DIR }} ${{ env.ANYKERNEL_DIR }}
        
        # Clone kernel patches
        echo "Cloning kernel patches..."
        git clone --depth=${{ env.REPO_DEPTH }} -b ${{ env.PATCHES_BRANCH }} ${{ env.PATCHES_REPO }} kernel_patches

    - name: Prepare kernel source
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        git clean -fdx || true

    - name: Configure Pixel 8a
      if: env.PIXEL8A == 'y'
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        
        echo "Adding Pixel 8a specific configurations..."
        cat >> "$CONFIG" << 'EOF'
        CONFIG_ARM64_CORTEX_X3=y
        CONFIG_ARM64_CORTEX_A715=y
        CONFIG_ARM64_CORTEX_A510=y
        CONFIG_ARM64_VA_BITS=48
        CONFIG_ARM64_PA_BITS=48
        CONFIG_ARM64_TAGGED_ADDR_ABI=y
        CONFIG_ARM64_SVE=y
        CONFIG_ARM64_BTI=y
        CONFIG_ARM64_PTR_AUTH=y
        CONFIG_SCHED_MC=y
        CONFIG_SCHED_CORE=y
        CONFIG_ENERGY_MODEL=y
        CONFIG_UCLAMP_TASK=y
        CONFIG_UCLAMP_TASK_GROUP=y
        CONFIG_SCHEDUTIL=y
        CONFIG_CPU_FREQ=y
        CONFIG_CPUFREQ_DT=y
        CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
        CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
        CONFIG_STACKPROTECTOR=n
        CONFIG_STACKPROTECTOR_STRONG=n
        EOF

    - name: Configure LTO
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        echo "Configuring LTO type: ${{ env.LTO_TYPE }}"
        sed -i -E '/^CONFIG_LTO_(CLANG_(FULL|THIN)|NONE)=/d' "$CONFIG" || true
        
        case "${{ env.LTO_TYPE }}" in
          full) echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG" ;;
          thin) echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG" ;;
          none) echo "CONFIG_LTO_NONE=y" >> "$CONFIG" ;;
        esac

    - name: Add KernelSU
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        echo "Adding KernelSU..."
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

    - name: Apply SUSFS Patches
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        echo "Applying core SUSFS patches..."
        cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
        cp ../susfs4ksu/kernel_patches/fs/* ./fs/
        cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
        patch -p1 --forward < 50_add_susfs_in_gki-android14-6.1.patch || true
        
        # Hide Stuff
        echo "Applying hide stuff patches..."
        cp ../kernel_patches/69_hide_stuff.patch .
        patch -p1 -F 3 < 69_hide_stuff.patch || true

    - name: Apply New Hooks Patches
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        echo "Applying hooks for SukiSU..."
        cp ../kernel_patches/sukisu/scope_min_manual_hooks_v1.6.patch ./
        patch -p1 -F 3 < scope_min_manual_hooks_v1.6.patch

    - name: Get KernelSU Version
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        if [ -d "KernelSU/.git" ]; then
          cd "KernelSU"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          KSU_VERSION=$(expr ${{ env.KSU_BASE_VERSION }} "+" $COMMIT_COUNT "-" ${{ env.KSU_COMMIT_OFFSET }})
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "KernelSU version: $KSU_VERSION"
        else
          echo "Warning: KernelSU directory not found or not a git repository"
          echo "KSU_VERSION=${{ env.KSU_BASE_VERSION }}" >> $GITHUB_ENV
        fi

    - name: Configure kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        
        echo "Configuring kernel options..."
        
        # Remove ABI exports that could block linking
        rm -f android/abi_gki_protected_exports_* || true
        
        # Core kernel configuration
        cat >> "$CONFIG" << 'EOF'
        CONFIG_LOCALVERSION="${{ env.LOCALVERSION }}"
        CONFIG_LOCALVERSION_AUTO=n
        CONFIG_KSU=y
        CONFIG_KSU_KPROBES_HOOK=n
        CONFIG_KSU_MANUAL_HOOK=y
        CONFIG_KSU_DEBUG=n
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_TCP_CONG_CUBIC=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_TCP_CONG_BIC=n
        CONFIG_TCP_CONG_WESTWOOD=n
        CONFIG_TCP_CONG_HTCP=n
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=256
        CONFIG_IP_SET_BITMAP_IP=y
        CONFIG_IP_SET_BITMAP_IPMAC=y
        CONFIG_IP_SET_BITMAP_PORT=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_IPPORT=y
        CONFIG_IP_SET_HASH_IPPORTIP=y
        CONFIG_IP_SET_HASH_IPPORTNET=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_HASH_NETNET=y
        CONFIG_IP_SET_HASH_NETPORT=y
        CONFIG_IP_SET_HASH_NETIFACE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=n
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        CONFIG_KSU_SUSFS_SUS_MAP=y
        EOF
        
        # Disable BTF debug info (optional - only if pahole fails)
        sed -i '/^CONFIG_DEBUG_INFO_BTF/d' "$CONFIG"
        echo "# CONFIG_DEBUG_INFO_BTF is not set" >> "$CONFIG"
        echo "# CONFIG_KSU_HOSTS_BLOCKING is not set" >> "$CONFIG"

    - name: Prepare build
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        # Remove defconfig check that might cause issues
        sed -i '/# Check for uncommitted changes\./,/fi/d' ./scripts/setlocalversion || true
        sed -i '2s/check_defconfig//' ./build.config.gki 2>/dev/null || true
        
        if [ "${{ env.BUILD_CLEAN }}" = "always" ]; then
          echo "Performing clean build..."
          rm -rf ${{ env.OUT_DIR }}
        fi
        mkdir -p ${{ env.OUT_DIR }}

    - name: Build the Kernel
      working-directory: ${{ env.KERNEL_DIR }}
      env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
      run: |
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
               CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
               CC="ccache clang" \
               LD=ld.lld HOSTLD=ld.lld \
               O=out \
               -j$(nproc --all) ${{ env.CONFIG_FILE }}

          make LLVM=1 LLVM_IAS=1 ARCH=arm64 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
               CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
               CC="ccache clang" \
               LD=ld.lld HOSTLD=ld.lld \
               O=out \
               -j$(nproc --all)

          if [[ ! -f "out/arch/arm64/boot/Image.lz4" ]]; then
            lz4 -z -f -9 out/arch/arm64/boot/Image out/arch/arm64/boot/Image.lz4
          fi

    - name: Check build output
      run: |
        IMAGE_PATH="${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image"
        if [ ! -f "$IMAGE_PATH" ]; then
          echo "Error: Kernel Image not found at $IMAGE_PATH"
          ls -la "${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/" || true
          exit 1
        fi
        echo "Build successful! Image size: $(stat -c%s "$IMAGE_PATH") bytes"

    - name: Package kernel
      run: |
        IMAGE="${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image"
        cp -fv "$IMAGE" "${{ env.ANYKERNEL_DIR }}"/
        
        cd "${{ env.ANYKERNEL_DIR }}"
        rm -rf .git
        
        # Create timestamp label
        TIMESTAMP=$(TZ=UTC date -u +"%Y%m%dT%H%MZ")
        BUILD_LABEL="${TIMESTAMP}-${{ env.GIT_SHORT_SHA }}"
        ZIP_NAME="${{ env.ZIP_PREFIX }}-${{ env.KSU_VERSION }}.zip"
        
        zip -r9 "../${ZIP_NAME}" ./*
        
        mkdir -p "../${{ env.BUILDS_DIR }}"
        mv "../${ZIP_NAME}" "../${{ env.BUILDS_DIR }}/"
        
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "BUILD_LABEL=${BUILD_LABEL}" >> $GITHUB_ENV

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
        retention-days: 30

    - name: Generate build info
      run: |
        cat > build_info.txt << EOF
        Build Information
        =================
        Kernel Version: ${{ env.KERNEL_VERSION }}
        KernelSU Version: ${{ env.KSU_VERSION }}
        Build Date: $(date -u)
        Build Label: ${{ env.BUILD_LABEL }}
        Commit SHA: ${{ github.sha }}
        Short SHA: ${{ env.GIT_SHORT_SHA }}
        LTO Type: ${{ env.LTO_TYPE }}
        Pixel 8a Config: ${{ env.PIXEL8A }}
        
        Compiler Information
        ===================
        Clang Version: $(${{ env.CLANG_PATH }}/clang --version | head -n1)
        GCC Version: $(${{ env.GCC_PATH }}/aarch64-linux-gcc --version | head -n1)
        
        Build Configuration
        ==================
        KernelSU: Enabled (SukiSU-susfs)
        SUSFS: Enabled
        SUSFS Commit: ${{ env.SUSFS_COMMIT }}
        BBR TCP: Enabled
        IPSet: Enabled
        EOF
        
        cat build_info.txt

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info-${{ env.BUILD_LABEL }}
        path: build_info.txt
        retention-days: 30
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ env.BUILD_LABEL }}
        path: ${{ env.KERNEL_DIR }}/build.log
        retention-days: 7

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
          build_info.txt
        body: |
          ## Kernel Build ${{ github.ref_name }}
          
          - **Kernel Version**: ${{ env.KERNEL_VERSION }}
          - **KernelSU Version**: ${{ env.KSU_VERSION }}
          - **Commit**: ${{ github.sha }}
          - **LTO**: ${{ env.LTO_TYPE }}
          - **Date**: $(date -u)
          
          ### Features
          - SukiSU (susfs-main branch)
          - SUSFS patches for android14-6.1
          - BBR TCP congestion control
          - IPSet support
          - Pixel 8a optimizations
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
