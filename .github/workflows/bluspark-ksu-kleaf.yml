name: BluSpark Kernel Build (KSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      codename:
        description: "Device codename (gs201, zuma, zumapro)"
        required: true
        default: "zuma"

env:
  # Folder where the bluspark source will be cloned
  BLUSPARK_DIR: bluspark_src
  # GKI source (repo-sync) – kept separate so we can overlay the defconfig
  GKI_DIR: gki_src
  OUT_DIR: out/android14-6.1
  ANYKERNEL_DIR: AnyKernel3

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      # --------------------------------------------------------------
      # 1. Checkout (contains AnyKernel3 + optional extra patches)
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 2. System packages (Bazel needs JDK)
      # --------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt update -y
          sudo apt install -y \
            git curl wget unzip bc bison flex libssl-dev libelf-dev \
            python3 python3-pip build-essential clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lz4 \
            openjdk-11-jdk

      # --------------------------------------------------------------
      # 3. AOSP tools (avbtool, mkbootimg, repo)
      # --------------------------------------------------------------
      - name: Setup Build Environment
        run: |
          set -euo pipefail
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-2025

          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools &
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg &
          wait

          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin:$PATH" >> $GITHUB_ENV

          mkdir -p ./git-repo
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      # --------------------------------------------------------------
      # 4. Clone the *bluspark* source (contains blu_spark_defconfig)
      # --------------------------------------------------------------
      - name: Clone bluspark source
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/engstk/gs.git \
            -b blu_spark-16-susfs \
            "$BLUSPARK_DIR"

          # Verify defconfig exists
          if [ ! -f "$BLUSPARK_DIR/arch/arm64/configs/blu_spark_defconfig" ]; then
            echo "ERROR: blu_spark_defconfig not found in bluspark repo!"
            exit 1
          fi
          echo "blu_spark_defconfig found"

      # --------------------------------------------------------------
      # 5. Repo-init + sync GKI source (Kleaf v2+)
      # --------------------------------------------------------------
      - name: Initialize and Sync GKI source
        run: |
          set -euo pipefail
          mkdir -p "$GKI_DIR"
          cd "$GKI_DIR"

          $REPO init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android14-6.1 \
            --repo-rev=v2.16

          $REPO sync -c -j$(nproc) --no-tags --fail-fast

          # Verify Bazel exists
          if [ ! -f "tools/bazel" ]; then
            echo "ERROR: tools/bazel missing!"
            ls -la tools/
            exit 1
          fi
          echo "Bazel ready"

      # --------------------------------------------------------------
      # 6. Copy defconfig into GKI tree + apply KernelSU
      # --------------------------------------------------------------
      - name: Apply defconfig and KernelSU
        run: |
          set -euo pipefail
          cd "$GKI_DIR"

          # Copy bluspark defconfig into the GKI tree
          cp "$GITHUB_WORKSPACE/$BLUSPARK_DIR/arch/arm64/configs/blu_spark_defconfig" \
             common/arch/arm64/configs/

          # Apply KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          # ---- OPTIONAL extra patches (uncomment if you have a patches/ folder) ----
          # if [ -d "$GITHUB_WORKSPACE/patches" ]; then
          #   cd common
          #   for p in $GITHUB_WORKSPACE/patches/*.patch; do
          #     patch -p1 < "$p" || true
          #   done
          # fi

      # --------------------------------------------------------------
      # 7. Build with Bazel (Kleaf v2+ direct)
      # --------------------------------------------------------------
      - name: Build with Bazel
        run: |
          set -euo pipefail
          cd "$GKI_DIR"

          export SOURCE_DATE_EPOCH=$(date -d "Tue Jul 8 09:17:32 UTC 2025" +%s)
          export KBUILD_BUILD_USER="bluspark"
          export KBUILD_BUILD_HOST="github-actions"

          # Generate .config from the bluspark defconfig
          make ARCH=arm64 O=out blu_spark_defconfig

          # Direct Bazel build (uses the generated .config)
          tools/bazel build \
            --config=fast \
            --lto=thin \
            --jobs=$(nproc) \
            --local_ram_resources=HOST_RAM*0.7 \
            //common:kernel_aarch64_dist

          # Verify output
          if [ ! -f "$OUT_DIR/dist/Image.lz4" ]; then
            echo "ERROR: Image.lz4 not produced!"
            find "$OUT_DIR" -name "Image*" || true
            exit 1
          fi
          echo "Build OK → $OUT_DIR/dist/Image.lz4"

      # --------------------------------------------------------------
      # 8. Populate AnyKernel3
      # --------------------------------------------------------------
      - name: Populate AnyKernel3
        run: |
          set -euo pipefail
          cd "$GKI_DIR"

          cp "$OUT_DIR/dist/Image.lz4" "$GITHUB_WORKSPACE/$ANYKERNEL_DIR/Image.lz4"

          CODENAME="${{ inputs.codename }}"
          DTB_DIR="$OUT_DIR/google-devices/$CODENAME/dts"
          if [ -d "$DTB_DIR" ]; then
            cat "$DTB_DIR"/*.dtb > "$GITHUB_WORKSPACE/$ANYKERNEL_DIR/dtb"
            echo "DTBs → $DTB_DIR"
          else
            echo "WARNING: No DTB folder for $CODENAME"
            find "$OUT_DIR" -name "*.dtb" | head -10 || true
          fi

          # Optional modules
          if [ -d "$OUT_DIR/modules" ]; then
            mkdir -p "$GITHUB_WORKSPACE/$ANYKERNEL_DIR/modules"
            cp -r "$OUT_DIR/modules/"* "$GITHUB_WORKSPACE/$ANYKERNEL_DIR/modules/" || true
          fi

      # --------------------------------------------------------------
      # 9. Get KernelSU version
      # --------------------------------------------------------------
      - name: Get KernelSU Version
        id: ksu
        run: |
          set -euo pipefail
          KSUVER=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest \
                   | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "version=$KSUVER" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 10. Package ZIP
      # --------------------------------------------------------------
      - name: Package ZIP
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$ANYKERNEL_DIR"

          ZIP_NAME="BluSpark-KSU-${{ inputs.codename }}-r$(date +%Y%m%d)-KSU${{ steps.ksu.outputs.version }}.zip"
          zip -r9 "../$ZIP_NAME" . -x "*.git*" "*.zip"

          echo "ZIP → $ZIP_NAME"
          echo "ZIP_PATH=../$ZIP_NAME" >> $GITHUB_ENV

      # --------------------------------------------------------------
      # 11. Upload artifact
      # --------------------------------------------------------------
      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BluSpark-Kernel-${{ inputs.codename }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      # --------------------------------------------------------------
      # 12. Build summary
      # --------------------------------------------------------------
      - name: Build Summary
        if: always()
        run: |
          echo "# BluSpark Kernel Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Device**: ${{ inputs.codename }}" >> $GITHUB_STEP_SUMMARY
          echo "- **KernelSU**: v${{ steps.ksu.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel**: \`$OUT_DIR/dist/Image.lz4\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ZIP**: \`${{ env.ZIP_PATH }}\`" >> $GITHUB_STEP_SUMMARY
