name: BluSpark Kernel Build (KSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      codename:
        description: 'Device codename (gs201, zuma, zumapro)'
        required: true
        default: 'zuma'

env:
  CONFIG: gs
  OUT_DIR: out_gs
  ANYKERNEL_DIR: AnyKernel3

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y git curl wget unzip bc bison flex libssl-dev libelf-dev \
            python3 python3-pip build-essential clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lz4

      - name: Setup Build Environment
        run: |
          set -euo pipefail
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-2025

          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools &
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg &
          wait

          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin:$PATH" >> $GITHUB_ENV

          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      - name: Initialize and Sync Kernel Source
        run: |
          set -euo pipefail
          mkdir -p "$CONFIG"
          cd "$CONFIG"

          # Use a real GKI branch (adjust as needed)
          $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1
          $REPO sync -c -j$(nproc) --no-tags

          # Verify build.sh exists
          if [ ! -f "build/build.sh" ]; then
            echo "ERROR: build.sh not found!"
            ls -la build/
            exit 1
          fi

      - name: Apply patches
        run: |
          set -euo pipefail
          cd "$CONFIG"

          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build with build.sh
        run: |
          set -euo pipefail
          cd "$CONFIG"

          export SOURCE_DATE_EPOCH=$(date -d "Tue Jul 8 09:17:32 UTC 2025" +%s)
          export KBUILD_BUILD_USER="bluspark"
          export KBUILD_BUILD_HOST="github-actions"

          # Use your defconfig
          cp ../blu_spark_defconfig common/arch/arm64/configs/

          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Copy to AnyKernel3
        run: |
          set -euo pipefail
          cd "$CONFIG"

          cp out/android14-6.1/dist/Image.lz4 ../AnyKernel3/Image.lz4

          CODENAME="${{ inputs.codename }}"
          cat out/android14-6.1/google-devices/$CODENAME/dts/*.dtb > ../AnyKernel3/dtb

      - name: Package ZIP
        run: |
          set -euo pipefail
          cd AnyKernel3
          KSUVER=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          ZIP_NAME="BluSpark-KSU-${{ inputs.codename }}-$(date +%Y%m%d)-KSU${KSUVER}.zip"
          zip -r9 "../$ZIP_NAME" * -x "*.git*"
          echo "ZIP_PATH=../$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BluSpark-Kernel-${{ inputs.codename }}
          path: ${{ env.ZIP_PATH }}
