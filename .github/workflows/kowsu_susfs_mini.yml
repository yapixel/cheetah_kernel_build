name: Build Husky A16 Kernel Sultan KowSU SUSFS-minimal

on:
  workflow_dispatch:
  

jobs:
  kowsu-sultan-susfs:
    runs-on: ubuntu-latest
    name: KowSU | Sultan GCC | SUSFS
    outputs:
      sultan_tag: ${{ steps.tag.outputs.sultan_tag }}
      ksu_ver: ${{ steps.ksu.outputs.ksu_ver }}
      zip_name: ${{ steps.package.outputs.zip_name }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    env:
      KERNEL_CODENAME: "zuma"
      KERNEL_VERSION: "6.1.145"
      build_date: "Mon Oct 6 16:50:48 UTC 2025"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GCC 14.2.0
        run: |
          wget -q https://kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz -O gcc.tar.gz
          tar -xf gcc.tar.gz
          echo "GCC_PATH=$PWD/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-" >> $GITHUB_ENV

      - name: Clone Source & Dependencies
        run: |
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_tensynos -b 16.0.0-sultan sultan
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "sultan-zuma" AK3
          git clone --depth=1 https://github.com/yapixel/kernel_patches.git
          git clone --depth=1 https://github.com/TheSillyOk/sh sh
          
          SUSFS_BRANCH="sultan-shiba-susfs-minimal"
          git clone --depth=5 https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH" susfs

          cd susfs
          git reset --hard b56e26cb27ec7f3d8ce51d2d453f940f24e27bd8
          cd ..

      - name: Get latest Sultan tag
        id: tag
        run: |
          cd sultan
          SULTAN_TAG=$(git tag --sort=-committerdate | head -n1)
          if [ -z "$SULTAN_TAG" ]; then
            echo "Error: No tags found in sultan repo!"
            exit 1
          fi
          echo "Latest Sultan tag: $SULTAN_TAG"
          echo "sultan_tag=$SULTAN_TAG" >> $GITHUB_OUTPUT

      - name: Add KernelSU
        run: |
          cd sultan
          echo "Adding KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s master

      - name: Get KowSU Version
        id: ksu
        run: |
          KSU_VER=$(./sh/get_ksuver.sh "KOWX712" "KernelSU" "master" || echo "unknown")
          echo "KowSU version: r$KSU_VER"
          echo "ksu_ver=$KSU_VER" >> $GITHUB_OUTPUT

      - name: Apply SUSFS Patches
        run: |
          cd sultan
          echo "Applying core SUSFS patches..."
          cp ../susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp ../susfs/kernel_patches/fs/* ./fs/
          cp ../susfs/kernel_patches/include/linux/* ./include/linux/

          
          patch -p1 --forward < 50_add_susfs_in_gki-android14-6.1.patch || true

          cd ./KernelSU
          echo "Apply KSU integration patches"   
          cp ../../kernel_patches/kowsu/10_enable_susfs_for_ksu.patch ./
          patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
          

      - name: Apply Hide Stuff Patches
        run: |
          cd sultan
          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch

      - name: Setup Configs
        run: |
          cd sultan
          DEFCONFIG="arch/arm64/configs/zuma_defconfig"
          
          # Base configs
          configs="CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y CONFIG_IP_NF_TARGET_TTL=y CONFIG_IP6_NF_TARGET_HL=y CONFIG_IP6_NF_MATCH_HL=y CONFIG_TCP_CONG_ADVANCED=y CONFIG_TCP_CONG_BBR=y CONFIG_NET_SCH_FQ=y CONFIG_TCP_CONG_BIC=n CONFIG_TCP_CONG_WESTWOOD=n CONFIG_TCP_CONG_HTCP=n CONFIG_BPF_STREAM_PARSER=y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y CONFIG_NETFILTER_XT_SET=y CONFIG_IP_SET=y CONFIG_IP_SET_MAX=65534 CONFIG_IP_SET_BITMAP_IP=y CONFIG_IP_SET_BITMAP_IPMAC=y CONFIG_IP_SET_BITMAP_PORT=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_IPMARK=y CONFIG_IP_SET_HASH_IPPORT=y CONFIG_IP_SET_HASH_IPPORTIP=y CONFIG_IP_SET_HASH_IPPORTNET=y CONFIG_IP_SET_HASH_IPMAC=y CONFIG_IP_SET_HASH_MAC=y CONFIG_IP_SET_HASH_NETPORTNET=y CONFIG_IP_SET_HASH_NET=y CONFIG_IP_SET_HASH_NETNET=y CONFIG_IP_SET_HASH_NETPORT=y CONFIG_IP_SET_HASH_NETIFACE=y CONFIG_IP_SET_LIST_SET=y CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          
          for config in $configs; do
            name=$(echo "$config" | cut -d'=' -f1)
            sed -i -E "s/.*($name=.*)/# \1 is not set/gi" $DEFCONFIG
            echo "$config" >> $DEFCONFIG
          done
          
          # KSU and SUSFS configs
          cat <<EOF >> $DEFCONFIG
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=n
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
          
          sed -i 's/${LOCALVERSION+set}/set/' scripts/setlocalversion
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-gc1de4747ac59-ab14219743"/' $DEFCONFIG
          perl -pi -e "s/build-timestamp = \\$\(or \\$\(KBUILD_BUILD_TIMESTAMP\), \\$\(build-timestamp-auto\)\\)/build-timestamp = \"${{ env.build_date }}\"/" init/Makefile

      - name: Build Kernel
        run: |
         cd sultan
         export KBUILD_BUILD_USER="build-user"
         export KBUILD_BUILD_HOST="build-host"
    
         make O=out CROSS_COMPILE="${{ env.GCC_PATH }}" CC="${{ env.GCC_PATH }}gcc" zuma_defconfig
         make O=out CROSS_COMPILE="${{ env.GCC_PATH }}" CC="${{ env.GCC_PATH }}gcc" \
         -j$(nproc --all)

      - name: Package AnyKernel3 ZIP
        id: package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/zuma/dts/*.dtb > AK3/dtb
          
          ZIP_NAME="Sultan-zuma-${{ steps.tag.outputs.sultan_tag }}-KowSU-r${{ steps.ksu.outputs.ksu_ver }}-SUSFS.zip"
          ARTIFACT_NAME="Sultan-zuma-${{ steps.tag.outputs.sultan_tag }}-xxKSU-r${{ steps.ksu.outputs.ksu_ver }}-SUSFS"
          
          cd AK3
          zip -r9 "../$ZIP_NAME" . -x "*.git*" "README.md"
          
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ env.ZIP_PATH }}

      - name: Upload Kernel Config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}-config
          path: sultan/out/.config

 
  release:
   needs: [kowsu-sultan-susfs]
   runs-on: ubuntu-latest
   permissions:
      contents: write
   steps:
      - name: Download Sultan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.xxksu-sultan-susfs.outputs.artifact_name }}
          path: ./artifacts
          
      - name: Create Release Tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
         BASE_TAG=$(date +"%Y.%m.%d")
         
         # Find all tags matching today's date
         ALL_TAGS=$(gh api "repos/${{ github.repository }}/tags" \
              --jq '.[].name' 2>/dev/null || echo "")
         
         # Find the highest revision number for today
         MAX_REV=0
         while IFS= read -r tag; do
           if [[ "$tag" == "$BASE_TAG-r"* ]]; then
             REV=$(echo "$tag" | grep -o 'r[0-9]*' | sed 's/r//')
             if [ "$REV" -gt "$MAX_REV" ]; then
               MAX_REV=$REV
             fi
           fi
         done <<< "$ALL_TAGS"
         
         # Increment to next revision
         NEXT_REV=$((MAX_REV + 1))
         TAG="${BASE_TAG}-r${NEXT_REV}"
         
         echo "Creating tag: $TAG (previous max revision was r${MAX_REV})"
         
         # Create the tag via GitHub API
         gh api "repos/${{ github.repository }}/git/refs" \
         -X POST \
         -f ref="refs/tags/$TAG" \
         -f sha="${{ github.sha }}" || {
           echo "Tag creation failed - tag might already exist"
           exit 1
         }
         
         echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
         tag_name: ${{ env.TAG }}
         name: Husky Kernel Build - ${{ env.TAG }}
         body: |
          **Kernel Build**
          - **Manager**: KowSU with SUSFS mini
          - **Source**: [KOWX712/KernelSU](https://github.com/KOWX712/KernelSU)
          - **SUSFS**: [simonpunk/susfs4ksu](https://gitlab.com/simonpunk/susfs4ksu)
          - **Date**: ${{ env.TAG }}
      
          Contains **Sultan (GCC)** variant with KowSU and SUSFS.
         files: |
          artifacts/**/*.zip
