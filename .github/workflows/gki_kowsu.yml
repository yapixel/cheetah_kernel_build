name: Build GKI Kernel with KowSU

on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      repo:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      pixel8a:
        description: 'Enable Pixel 8a configuration (y/n)'
        required: false
        type: string
        default: 'y'
      lto_type:
        description: 'LTO type (full/thin/none)'
        required: false
        type: string
        default: 'thin'
      build_clean:
        description: 'Build clean mode (always/auto/never)'
        required: false
        type: string
        default: 'always'

env:
  # -----------------------------------------------------------------
  # Fixed values – overridden by inputs where needed
  # -----------------------------------------------------------------
  KERNEL_DIR: common
  CONFIG_FILE: arch/arm64/configs/gki_defconfig
  OUT_DIR: out
  KERNEL_TAG: android14-6.1-2025-05          # adjust if you need a different tag
  ANYKERNEL_DIR: AnyKernel3-p8a
  ANYKERNEL_BRANCH: gki-2.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  PATCHES_BRANCH: dev
  BUILDS_DIR: builds/${{ inputs.kernel_version }}
  #ZIP_PREFIX: AK3-${{ inputs.android_version }}-${{ inputs.kernel_version }}-KowSU-${{ inputs.codename }}
  
  # -----------------------------------------------------------------
  PIXEL8A: ${{ inputs.pixel8a }}
  LTO_TYPE: ${{ inputs.lto_type }}
  BUILD_CLEAN: ${{ inputs.build_clean }}
  # -----------------------------------------------------------------
  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  LLVM_CACHE_PATH: ${{ github.workspace }}/.cache/llvm
  KBUILD_BUILD_USER: build-user
  KBUILD_BUILD_HOST: build-host
  # -----------------------------------------------------------------
  THREADS: $(nproc)

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:

      # -----------------------------------------------------------
      # 1. Disk cleanup (optional but helps on CI)
      # -----------------------------------------------------------
      - name: Free disk space
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      # -----------------------------------------------------------
      # 2. Checkout (only this repo – we clone kernel later)
      # -----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------
      # 3. Install system packages
      # -----------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            zip ccache curl git wget cpio python3 python3-pip device-tree-compiler \
            kmod dwarves pahole

      - name: Remove system clang (avoid conflicts)
        run: sudo apt-get purge -y clang-14 || true

      # -----------------------------------------------------------
      # 4. ccache
      # -----------------------------------------------------------
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-gki-${{ inputs.lto_type }}
          max-size: 5G

      # -----------------------------------------------------------
      # 5. Download Clang (Google prebuilt)
      # -----------------------------------------------------------
      - name: Download Clang
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      # -----------------------------------------------------------
      # 6. ARM64 & ARM32 toolchains
      # -----------------------------------------------------------
      - name: Download ARM64 toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xf arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Download ARM32 toolchain
        run: |
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-" >> $GITHUB_ENV

      # -----------------------------------------------------------
      # 7. Clone kernel source
      # -----------------------------------------------------------
      - name: Clone kernel source
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b ${{ env.KERNEL_TAG }} ${{ env.KERNEL_DIR }}

      # -----------------------------------------------------------
      # 8. Clone auxiliary repos
      # -----------------------------------------------------------
      - name: Clone auxiliary repos
        run: |
          git clone --depth=1 -b ${{ env.SUSFS_BRANCH }} ${{ env.SUSFS_REPO }} susfs4ksu
          git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} https://github.com/deepongi-labs/${{ env.ANYKERNEL_DIR }} ${{ env.ANYKERNEL_DIR }}
          git clone --depth=1 -b ${{ env.PATCHES_BRANCH }} ${{ env.PATCHES_REPO }} kernel_patches
          git clone --depth=1 https://github.com/KOWX712/files.git kowsu_patches

      # -----------------------------------------------------------
      # 9. Prepare kernel source
      # -----------------------------------------------------------
      - name: Clean kernel source
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clean -fdx || true
          rm -rf KernelSU || true

      # -----------------------------------------------------------
      # 10. Pixel-8a specific config (if enabled)
      # -----------------------------------------------------------
      - name: Add Pixel 8a config
        if: env.PIXEL8A == 'y'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cat >> "${{ env.CONFIG_FILE }}" <<'EOF'
          CONFIG_ARM64_CORTEX_X3=y
          CONFIG_ARM64_CORTEX_A715=y
          CONFIG_ARM64_CORTEX_A510=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_ARM64_TAGGED_ADDR_ABI=y
          CONFIG_ARM64_SVE=y
          CONFIG_ARM64_BTI=y
          CONFIG_ARM64_PTR_AUTH=y
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_SCHEDUTIL=y
          CONFIG_CPU_FREQ=y
          CONFIG_CPUFREQ_DT=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          EOF

      # -----------------------------------------------------------
      # 11. LTO selection
      # -----------------------------------------------------------
      - name: Configure LTO
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i -E '/^CONFIG_LTO_(CLANG_(FULL|THIN)|NONE)=/d' "${{ env.CONFIG_FILE }}" || true
          case "${{ env.LTO_TYPE }}" in
            full) echo "CONFIG_LTO_CLANG_FULL=y" >> "${{ env.CONFIG_FILE }}" ;;
            thin) echo "CONFIG_LTO_CLANG_THIN=y" >> "${{ env.CONFIG_FILE }}" ;;
            none) echo "CONFIG_LTO_NONE=y" >> "${{ env.CONFIG_FILE }}" ;;
          esac

      # -----------------------------------------------------------
      # 12. Install KernelSU (KowSU branch)
      # -----------------------------------------------------------
      - name: Install KernelSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      # -----------------------------------------------------------
      # 13. Apply SUSFS + KowSU patches
      # -----------------------------------------------------------
      - name: Apply SUSFS patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch .
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true

          cd KernelSU
          cp ../../kowsu_patches/KowSU/revert_commit_conflict_with_susfs.patch .
          patch -p1 --fuzz=3 < revert_commit_conflict_with_susfs.patch || true

          cp ../../kowsu_patches/KowSU/enable_susfs_for_kowsu.patch .
          patch -p1 < enable_susfs_for_kowsu.patch || true

          cp ../../kernel_patches/kowsu/fix_ksud.c.patch .
          patch -p1 < fix_ksud.c.patch || true

          cp ../../kowsu_patches/KowSU/fix_core_hook_kowsu.patch .
          patch -p1 --fuzz=3 < fix_core_hook_kowsu.patch || true

      - name: Apply manual syscall-hook patch
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cp ../kernel_patches/syscall_hook/min_scope_syscall_hooks_v1.5.patch .
          patch -p1 < min_scope_syscall_hooks_v1.5.patch || true

      # -----------------------------------------------------------
      # 14. Kernel config (KSU + SUSFS + misc)
      # -----------------------------------------------------------
      - name: Add final kernel config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cat >> "${{ env.CONFIG_FILE }}" <<'EOF'
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=n
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_CCACHE=y
          # Disable BTF to avoid pahole issues
          # CONFIG_DEBUG_INFO_BTF is not set
          EOF
          sed -i '/^CONFIG_DEBUG_INFO_BTF/d' "${{ env.CONFIG_FILE }}"
          echo "# CONFIG_DEBUG_INFO_BTF is not set" >> "${{ env.CONFIG_FILE }}"

      # -----------------------------------------------------------
      # 15. Fixed build timestamp (reproducible)
      # -----------------------------------------------------------
      - name: Set fixed build timestamp
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          perl -pi -e 's/build-timestamp = \$\(or \$\(KBUILD_BUILD_TIMESTAMP\), \$\(build-timestamp-auto\)\)/build-timestamp = "Tue Jul 8 09:17:32 UTC 2025"/' ./init/Makefile

      # -----------------------------------------------------------
      # 16. Prepare out dir / clean
      # -----------------------------------------------------------
      - name: Prepare build directory
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ env.BUILD_CLEAN }}" = "always" ]; then
            rm -rf ${{ env.OUT_DIR }}
          fi
          mkdir -p ${{ env.OUT_DIR }}

      # -----------------------------------------------------------
      # 17. Build kernel
      # -----------------------------------------------------------
      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          KBUILD_BUILD_USER: ${{ env.KBUILD_BUILD_USER }}
          KBUILD_BUILD_HOST: ${{ env.KBUILD_BUILD_HOST }}
        run: |
          make -j${{ env.THREADS }} \
            LLVM_IAS=1 LLVM=1 ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CC="ccache clang" LD=ld.lld HOSTLD=ld.lld \
            O="${{ env.OUT_DIR }}" gki_defconfig all

      # -----------------------------------------------------------
      # 18. Verify Image exists
      # -----------------------------------------------------------
      - name: Verify Image
        run: |
          [ -f "${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image" ] || { echo "Image missing!"; exit 1; }

      # -----------------------------------------------------------
      # 19. Package with AnyKernel3
      # -----------------------------------------------------------
      - name: Package kernel
        run: |
          IMAGE="${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image"
          cp -v "$IMAGE" "${{ env.ANYKERNEL_DIR }}"/

          cd "${{ env.ANYKERNEL_DIR }}"
          rm -rf .git

          # ---- KernelSU build number ----
          if [ -d "../${{ env.KERNEL_DIR }}/KernelSU/.git" ]; then
            cd "../${{ env.KERNEL_DIR }}/KernelSU"
            BUILD_COUNT=$(git rev-list --count HEAD)
            BUILD_VER=$((10000 + BUILD_COUNT + 200))
          else
            BUILD_VER=12222
          fi

          cd "${{ github.workspace }}/${{ env.ANYKERNEL_DIR }}"

          TIMESTAMP=$(TZ=UTC date -u +"%Y%m%dT%H%MZ")
          #ZIP_NAME="${{ env.ZIP_PREFIX }}-${BUILD_VER}.zip"
          ZIP_NMAE="KowSU-${{ env.KSUVER }}-${{ inputs.codename }}_GKI-202505_SUSFS.zip"
          zip -r9 "../${ZIP_NAME}" ./*

          mkdir -p "../${{ env.BUILDS_DIR }}"
          mv "../${ZIP_NAME}" "../${{ env.BUILDS_DIR }}/"

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "BUILD_VER=${BUILD_VER}" >> $GITHUB_ENV

      # -----------------------------------------------------------
      # 20. Upload artifact (named so parent can find it)
      # -----------------------------------------------------------
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gki-${{ inputs.codename }}-${{ github.run_id }}
          path: ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
          retention-days: 30

      # -----------------------------------------------------------
      # 21. Build info (optional but useful)
      # -----------------------------------------------------------
      - name: Generate build_info.txt
        run: |
          cat > build_info.txt <<EOF
          Build Information
          =================
          Kernel: GKI ${{ inputs.kernel_version }}
          Codename: ${{ inputs.codename }}
          Build #: ${{ env.BUILD_VER }}
          Date: $(date -u)
          SHA: ${{ github.sha }}
          LTO: ${{ env.LTO_TYPE }}
          Pixel8a: ${{ env.PIXEL8A }}

          Compiler
          --------
          $(clang --version | head -n1)
          EOF

      - name: Upload build_info
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gki-${{ inputs.codename }}-${{ github.run_id }}-info
          path: build_info.txt
          retention-days: 30
