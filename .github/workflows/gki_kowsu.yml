name: GKI KowSU (GKI-native toolchains)

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      maximize_space:
        required: false
        type: boolean
        default: true

jobs:
  build-kernel-GKI-kowsu-susfs:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1. Maximize disk space (optional)
      # -------------------------------------------------
      - name: Maximize build space (optional)
        if: ${{ inputs.maximize_space }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      # -------------------------------------------------
      # 2. Install base packages + repo
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            zip ccache curl git wget cpio python3 python3-pip device-tree-compiler \
            kmod dwarves pahole repo openjdk-11-jdk

      # -------------------------------------------------
      # 3. Install Repo (no cache)
      # -------------------------------------------------
      - name: Install Repo
        run: |
          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      # -------------------------------------------------
      # 4. Clone AnyKernel3 + patch repos
      # -------------------------------------------------
      - name: Clone dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          git clone https://github.com/TheWildJames/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          git clone https://github.com/yapixel/kernel_patches.git
          git clone https://github.com/KOWX712/files.git kowsu_patches

      # -------------------------------------------------
      # 5. Repo init + sync kernel source
      # -------------------------------------------------
      - name: Initialize & sync kernel source
        run: |
          mkdir -p kernel_gki
          cd kernel_gki
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest \
               -b common-$FORMATTED_BRANCH --repo-rev=v2.16

          # Handle deprecated branches
          DEFAULT_XML=.repo/manifests/default.xml
          REMOTE=$(git ls-remote https://android.googlesource.com/kernel/common $FORMATTED_BRANCH)
          if grep -q deprecated <<< "$REMOTE"; then
            sed -i "s/\"$FORMATTED_BRANCH\"/\"deprecated\/$FORMATTED_BRANCH\"/g" $DEFAULT_XML
          fi

          $REPO sync -c -j$(nproc --all) --no-tags --fail-fast

      # -------------------------------------------------
      # 6. Use GKI-native Clang (r487747c)
      # -------------------------------------------------
      - name: Set Clang from GKI prebuilts
        run: |
          CLANG_ROOT="$GITHUB_WORKSPACE/kernel_gki/prebuilts/clang/host/linux-x86/clang-r487747c"
          echo "CLANG_PATH=$CLANG_ROOT/bin" >> $GITHUB_ENV
          echo "$CLANG_ROOT/bin" >> $GITHUB_PATH

      # -------------------------------------------------
      # 7. Use GKI-native GCC (ARM64 + ARM32)
      # -------------------------------------------------
      - name: Set GCC from GKI prebuilts
        run: |
          GCC_ROOT="$GITHUB_WORKSPACE/kernel_gki/prebuilts/gcc/linux-x86"
          echo "ARM64_TOOLCHAIN=$GCC_ROOT/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "ARM32_TOOLCHAIN=$GCC_ROOT/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-" >> $GITHUB_ENV

      # -------------------------------------------------
      # 8. Add KernelSU (KowSU)
      # -------------------------------------------------
      - name: Add KernelSU
        run: |
          cd kernel_gki
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s master

      # -------------------------------------------------
      # 9. Apply SUSFS & KowSU patches
      # -------------------------------------------------
      - name: Apply SUSFS & KowSU patches
        run: |
          cd kernel_gki
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          patch -p1 -F 3 < ./common/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true
          cp -r ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          cd KernelSU
          cp ../../kowsu_patches/KowSU/revert_commit_conflict_with_susfs.patch .
          patch -p1 --fuzz=3 < revert_commit_conflict_with_susfs.patch
          cp ../../kowsu_patches/KowSU/enable_susfs_for_kowsu.patch .
          patch -p1 < enable_susfs_for_kowsu.patch
          cp ../../kernel_patches/kowsu/fix_ksud.c.patch .
          patch -p1 < fix_ksud.c.patch
          cp ../../kowsu_patches/KowSU/fix_core_hook_kowsu.patch .
          patch -p1 --fuzz=3 < fix_core_hook_kowsu.patch

      # -------------------------------------------------
      # 10. Apply manual syscall hook
      # -------------------------------------------------
      - name: Apply manual syscall hook
        run: |
          cd kernel_gki/common
          cp ../../kernel_patches/syscall_hook/min_scope_syscall_hooks_v1.5.patch .
          patch -p1 --forward < min_scope_syscall_hooks_v1.5.patch

      # -------------------------------------------------
      # 11. Compute KernelSU version
      # -------------------------------------------------
      - name: Compute KernelSU version
        run: |
          cd kernel_gki/KernelSU/kernel
          BASE=10200
          COUNT=$(git rev-list --count HEAD)
          KSUVER=$(( BASE + COUNT ))
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV

      # -------------------------------------------------
      # 12. Create device-specific defconfig (in common/)
      # -------------------------------------------------
      - name: Create device-specific defconfig
        env:
          CODENAME: ${{ inputs.codename }}
        run: |
          cd kernel_gki
          DEFCONFIG_PATH="common/arch/arm64/configs/${CODENAME}_defconfig"
          echo "# ${CODENAME} GKI defconfig" > "$DEFCONFIG_PATH"

          # Pixel 8 core config
          echo "CONFIG_ARM64_CORTEX_X3=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ARM64_CORTEX_A715=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ARM64_CORTEX_A510=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ARM64_VA_BITS=48" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ARM64_PA_BITS=48" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ARM64_TAGGED_ADDR_ABI=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ARM64_SVE=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ARM64_BTI=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ARM64_PTR_AUTH=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_SCHED_MC=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_SCHED_CORE=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ENERGY_MODEL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_UCLAMP_TASK=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_UCLAMP_TASK_GROUP=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_SCHEDUTIL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CPU_FREQ=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CPUFREQ_DT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "$DEFCONFIG_PATH"

          # KowSU + SUSFS
          echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_LSM_SECURITY_HOOKS=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_BPF_STREAM_PARSER=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_NETFILTER_XT_SET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_MAX=65534" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_IP=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_MAC=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_NET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_LIST_SET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP6_NF_NAT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CCACHE=y" >> "$DEFCONFIG_PATH"

      # -------------------------------------------------
      # 13. Fix localversion and build timestamp 
      # -------------------------------------------------
      - name: Fix localversion and build timestamp
        run: |
          cd kernel_gki

          # 1. Set correct LOCALVERSION in defconfig (NO Sultan replacement)
          DEFCONFIG="common/arch/arm64/configs/${{ inputs.codename }}_defconfig"
          if ! grep -q "CONFIG_LOCALVERSION=" "$DEFCONFIG"; then
            echo 'CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"' >> "$DEFCONFIG"
          else
            sed -i 's|CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"|' "$DEFCONFIG"
          fi

          # 2. Fix setlocalversion script (correct path: common/scripts/)
          sed -i 's/${LOCALVERSION+set}/set/' common/scripts/setlocalversion

          # 3. Set fixed build timestamp
          perl -pi -e 's/build-timestamp = \$\(or \$\(KBUILD_BUILD_TIMESTAMP\), \$\(build-timestamp-auto\)\)/build-timestamp = "Tue Jul 8 09:17:32 UTC 2025"/' init/Makefile
      # -------------------------------------------------
      # 14. Build kernel
      # -------------------------------------------------
      - name: Build kernel
        run: |
          cd kernel_gki
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"
          JOBS=4

          make -j$JOBS \
            LLVM_IAS=1 LLVM=1 ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CC="ccache clang" LD=ld.lld HOSTLD=ld.lld \
            O=out \
            ${{ inputs.codename }}_defconfig

          make -j$JOBS \
            LLVM_IAS=1 LLVM=1 ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CC="ccache clang" LD=ld.lld HOSTLD=ld.lld \
            O=out \
            all

      # -------------------------------------------------
      # 15. Package with AnyKernel3
      # -------------------------------------------------
      - name: Package kernel
        run: |
          cd kernel_gki
          IMAGE="out/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image not found at $IMAGE"
            exit 1
          fi
          cp -v "$IMAGE" ../AnyKernel3/

          cd ../AnyKernel3
          mkdir -p ../builds
          ZIP_NAME="KowSU-${{ env.KSUVER }}-${{ inputs.codename }}_GKI-6.1.134_SUSFS.zip"
          ZIP_PATH="../builds/$ZIP_NAME"
          zip -r9 "$ZIP_PATH" ./* > /dev/null
          echo "ZIP_NAME=$ZIP_PATH" >> $GITHUB_ENV

      # -------------------------------------------------
      # 16. Upload artifact
      # -------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-kowsu
          path: ${{ env.ZIP_NAME }}
          retention-days: 3

      # -------------------------------------------------
      # 17. ccache statistics (optional)
      # -------------------------------------------------
      - name: ccache statistics
        run: ccache -s
