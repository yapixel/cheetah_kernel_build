name: Build and Release Husky Kernels

permissions:
  contents: write   # push tag + create release
  actions: write    # trigger reusable workflows

on:
  workflow_dispatch:   # manual trigger only

jobs:
 
  
  # --------------------------------------------------------------
  # 2. Build Sultan KOWSU
  # --------------------------------------------------------------
  build-sultan-kowsu:
    uses: ./.github/workflows/sultan_kowsu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  # --------------------------------------------------------------
  # 3. Create & push tag + release (only if BOTH builds succeed)
  # --------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs:
      
      - build-sultan-kowsu
    if: success()                     # <-- GUARANTEES builds passed
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Generate tag = YYMMDD (e.g. 250402)
      # ----------------------------------------------------------
      - name: Generate YYMMDD Tag
        id: tag
        run: |
          TAG=$(date '+%y%m%d')
          echo "Generated tag: $TAG"
          echo "new_tag=$TAG" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # Push the tag **AFTER** build success
      # ----------------------------------------------------------
      - name: Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}
          echo "Tag ${{ steps.tag.outputs.new_tag }} pushed."

      # ----------------------------------------------------------
      # Build-time metadata
      # ----------------------------------------------------------
      - name: Set Build Time
        id: time
        run: |
          echo "build_time=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # Release name & body
      # ----------------------------------------------------------
      - name: Define Release Name & Body
        id: release
        run: |
          cat << 'EOF' > release.md
          This release contains **KernelSU** and **MKSU** variants with **SUSFS**.

          **COMPATIBILITY NOTICE**
          - Official Sultan releases: https://github.com/kerneltoast/android_kernel_google_gs201/releases
          - Built from latest Sultan commits as of: ${{ steps.time.outputs.build_time }}
          - Target: **Android 14 (zuma)**
          - Use within 30 days of an official release

          **Managers**
          - KernelSU: https://github.com/KOWX712/KernelSU
          - SukiSU: https://github.com/SukiSU-Ultra/SukiSU-Ultra

          **Features**
          [+] KernelSU Magic Managers v1.0.5
          [+] SUSFS
          [+] Maphide (LineageOS + JIT cache)
          [+] Magic Mount

          **Module**
          -> https://github.com/sidex15/ksu_module_susfs
          EOF

          echo "name=*TEST BUILD* Husky Kernels – ${{ steps.tag.outputs.new_tag }} *TEST BUILD*" >> $GITHUB_OUTPUT
          echo "body=$(cat release.md)" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # Download artifacts from the two build jobs
      # ----------------------------------------------------------
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: kernel-*

      # ----------------------------------------------------------
      # Create GitHub release
      # ----------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.release.outputs.name }}
          body: ${{ steps.release.outputs.body }}
          prerelease: true
          token: ${{ github.token }}

      # ----------------------------------------------------------
      # Upload zip files
      # ----------------------------------------------------------
      - name: Upload Release Assets
        run: |
          echo "Uploading artifacts..."
          for f in ./artifacts/kernel-*/*; do
            [[ -f "$f" ]] || continue
            echo "Uploading $f"
            gh release upload "${{ steps.tag.outputs.new_tag }}" "$f" --clobber
          done

      # ----------------------------------------------------------
      # Final summary
      # ----------------------------------------------------------
      - name: Summary
        run: |
          echo "Release ${{ steps.tag.outputs.new_tag }} created and published."
          echo "Uploaded files:"
          ls -la ./artifacts/kernel-*/* || echo "No files uploaded."
