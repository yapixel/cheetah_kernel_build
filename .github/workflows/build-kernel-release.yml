name: Build and Release Sultan Kernels

permissions:
  contents: write   # Allow writing to repository contents (for pushing tags)
  actions: write    # Allows downloading artifacts

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true

jobs:
  # Build all kernels first
  build-kernel-zuma-kowsu:
    uses: ./.github/workflows/sultan_kowsu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  build-kernel-zuma-ksu:
    uses: ./.github/workflows/sultan_ksu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  build-kernel-zuma-mksu:
    uses: ./.github/workflows/sultan_mksu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  # Only runs after ALL builds succeed
  generate-tag-and-release:
    runs-on: ubuntu-latest
    needs:
      - build-kernel-zuma-kowsu
      - build-kernel-zuma-ksu
      - build-kernel-zuma-mksu
    if: ${{ inputs.make_release }}
    permissions:
      contents: write
    env:
      REPO_OWNER: yapixel
      REPO_NAME: Husky_KSU_workflow

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts              # everything goes here
          pattern: "*"                     # download every artifact
          merge-multiple: true 

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # VERY IMPORTANT – fetch ALL history and ALL tags
          fetch-depth: 0
          # If you use a personal token with more permissions (optional but recommended)
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Create Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Make sure git knows who is pushing
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Double-check we really have all tags
          git fetch --tags --force

          # Find the pattern you actually use
          LATEST_TAG=$(git tag -l "v*-r*" --sort=-version:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v2.0.0-r0"
          else
            BASE=$(echo "$LATEST_TAG" | sed 's/-r[0-9]*$//')
            REV=$(echo "$LATEST_TAG" | sed 's/.*-r//')
            NEW_TAG="${BASE}-r$((REV + 1))"
          fi

          echo "Creating and pushing tag: $NEW_TAG"
          echo "TAG=$NEW_TAG" >> $GITHUB_ENV

          git tag -a "$NEW_TAG" -m "Automatic test build $NEW_TAG"
          
          # This is the trick that always works
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git "$NEW_TAG"

      

      - name: Set Build Date
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Extract SUSFS Version
        run: |
          # TAG is now correctly set from the step above
          SUSFS_VERSION=$(echo "${{ env.TAG }}" | sed 's/-r.*//' | sed 's/^v//')
          echo "SUSFS_VERSION=v$SUSFS_VERSION" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "*TEST BUILD* Sultan Kernels With MKSU & SUSFS_Minimal ${{ env.SUSFS_VERSION }} *TEST BUILD*"
          prerelease: true
          generate_release_notes: false
          body: |
            This release contains MKSU with SUSFS_Minimal ${{ env.SUSFS_VERSION }}
            
            ⚠️ **COMPATIBILITY NOTICE** ⚠️
            Please ensure compatibility by comparing release dates with official Sultan kernel releases:
            - Check official Sultan releases: https://github.com/kerneltoast/android_kernel_google_gs201/releases
            - This build is based on the latest Sultan kernel commits as of build date
            - Always verify your device's Android version matches the kernel target (Android 14)
            - Recommended to use kernels released within 30 days of official Sultan updates
            
            Module:
            -> https://github.com/sidex15/ksu_module_susfs
            
            Managers:
            -> https://github.com/5ec1cff/KernelSU
            
            Features:
            [+] KernelSU Magic Managers
            [+] SUSFS ${{ env.SUSFS_VERSION }}
            [+] Maphide LineageOS Detections
            [+] Futile Maphide for jit-zygote-cache Detections
            [+] Magic Mount Support
            
            📅 **Built on:** ${{ env.BUILD_DATE }}
          files: |
            all-artifacts/*.zip
          fail_on_unmatched_files: false
