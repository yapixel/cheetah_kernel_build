name: Build and Release Husky Kernels

permissions:
  contents: write   # push tag + create release
  actions: write    # trigger reusable workflows

on:
  workflow_dispatch:   # manual trigger only

jobs:
 
  
  # --------------------------------------------------------------
  # 2. Build Sultan KOWSU
  # --------------------------------------------------------------
  build-sultan-kowsu:
    uses: ./.github/workflows/sultan_kowsu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  # --------------------------------------------------------------
  # 3. Create & push tag + release (only if BOTH builds succeed)
  # --------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs:
      
      - build-sultan-kowsu
    if: success()                     # <-- GUARANTEES builds passed
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Generate tag = YYMMDD (e.g. 250402)
      # ----------------------------------------------------------
      - name: Generate YYMMDD Tag
        id: tag
        run: |
          TAG=$(date '+%y%m%d')
          echo "Generated tag: $TAG"
          echo "new_tag=$TAG" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # Push the tag **AFTER** build success
      # ----------------------------------------------------------
      - name: Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}
          echo "Tag ${{ steps.tag.outputs.new_tag }} pushed."

      # ----------------------------------------------------------
      # Build-time metadata
      # ----------------------------------------------------------
      - name: Set Build Time
        id: time
        run: |
          echo "build_time=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # Release name & body
      # ----------------------------------------------------------
      - name: Define Release Notes
        id: define-release-notes
        run: |
          BUILD_DATE="${{ steps.set-build-date.outputs.build_date }}"
          SUSFS_VERSION="${{ steps.extract-version.outputs.susfs_version }}"

          cat << EOF > release-notes.md
          # SUSFS Kernel Module Release

          This release contains **KernelSU** and **MKSU** variants with **SUSFS $SUSFS_VERSION**

          ## Compatibility Notice

          Please ensure compatibility by comparing release dates with official Sultan kernel releases:

          - Check official Sultan releases: https://github.com/kerneltoast/android_kernel_google_gs201/releases
          - This build is based on the latest Sultan kernel commits as of build date
          - Always verify your device's Android version matches the kernel target (**Android 14**)
          - **Recommended**: Use kernels released **within 30 days** of official Sultan updates

          ## Module & Managers

          **Module**:  
          -> https://github.com/sidex15/ksu_module_susfs

          **Managers**:  
          -> https://github.com/KOWX712/KernelSU  
          -> https://github.com/SukiSU-Ultra/SukiSU-Ultra

          ## Features

          [+] KernelSU Magic Managers v1.0.5  
          [+] SUSFS $SUSFS_VERSION  
          [+] Maphide LineageOS Detections  
          [+] Futile Maphide for jit-zygote-cache Detections  
          [+] Magic Mount Support

          ## Release Date Compatibility Check

          **Built on**: $BUILD_DATE
          EOF

          # Output the entire file content as a multi-line step output
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: kernel-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.define-release-notes.outputs.release_notes }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ----------------------------------------------------------
      # Upload zip files
      # ----------------------------------------------------------
      - name: Upload Release Assets
        run: |
          echo "Uploading artifacts..."
          for f in ./artifacts/kernel-*/*; do
            [[ -f "$f" ]] || continue
            echo "Uploading $f"
            gh release upload "${{ steps.tag.outputs.new_tag }}" "$f" --clobber
          done

      # ----------------------------------------------------------
      # Final summary
      # ----------------------------------------------------------
      - name: Summary
        run: |
          echo "Release ${{ steps.tag.outputs.new_tag }} created and published."
          echo "Uploaded files:"
          ls -la ./artifacts/kernel-*/* || echo "No files uploaded."
