name: Build and Release Sultan Kernels

permissions:
  contents: write   # Allow writing to repository contents (for pushing tags)
  actions: write    # Allows downloading artifacts

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true

jobs:
  # Build all kernels first (in parallel)
  build-kernel-zuma-xxksu:
    uses: ./.github/workflows/sultan_xxksu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  build-kernel-zuma-ksu:
    uses: ./.github/workflows/sultan_ksu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  build-kernel-zuma-mksu:
    uses: ./.github/workflows/sultan_mksu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  # This job runs ONLY after all builds succeed
  generate-tag-and-release:
    runs-on: ubuntu-latest
    needs:
      - build-kernel-zuma-xxksu
      - build-kernel-zuma-ksu
      - build-kernel-zuma-mksu
    if: ${{ inputs.make_release }}
    env:
      REPO_OWNER: yapixel
      REPO_NAME: Sultan_KernelSU_SUSFS
      GH_TOKEN: ${{ github.token }}

    outputs:
      new_tag: ${{ steps.generate-tag.outputs.new_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate New Tag & Push (only now — after successful builds)
        id: generate-tag
        run: |
          # Fetch the latest tag from this repository
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.5.12-r0"
            echo "No tags found → starting from v1.5.12-r0"
          fi

          # Increment the suffix (v1.5.12-r5 → v1.5.12-r6)
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')

          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          # Now we can safely create and push the tag
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "Tag $NEW_TAG created and pushed successfully."

      # Everything below is 100% your original code — unchanged
      - name: Set Build Date
        id: set-build-date
        run: |
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Extract SUSFS Version
        id: extract-version
        run: |
          SUSFS_VERSION=$(echo "${{ steps.generate-tag.outputs.new_tag }}" | cut -d'-' -f1 | sed 's/v//')
          echo "susfs_version=v$SUSFS_VERSION" >> $GITHUB_OUTPUT

      - name: Set Release Name
        run: |
          SUSFS_VERSION="${{ steps.extract-version.outputs.susfs_version }}"
          echo "RELEASE_NAME=*TEST BUILD* Sultan Kernels With MKSU & SUSFS_Minimal $SUSFS_VERSION *TEST BUILD*" >> $GITHUB_ENV

      - name: Define Release Notes
        id: define-release-notes
        run: |
          BUILD_DATE="${{ steps.set-build-date.outputs.build_date }}"
          SUSFS_VERSION="${{ steps.extract-version.outputs.susfs_version }}"
          RELEASE_NOTES=$(cat << EOF
            This release contains MKSU with SUSFS_Minimal $SUSFS_VERSION
            
            ⚠️ **COMPATIBILITY NOTICE** ⚠️
            Please ensure compatibility by comparing release dates with official Sultan kernel releases:
            - Check official Sultan releases: https://github.com/kerneltoast/android_kernel_google_gs201/releases
            - This build is based on the latest Sultan kernel commits as of build date
            - Always verify your device's Android version matches the kernel target (Android 14)
            - Recommended to use kernels released within 30 days of official Sultan updates
            
            Module: 
            -> https://github.com/sidex15/ksu_module_susfs
            
            Managers:
            -> https://github.com/5ec1cff/KernelSU
            
            Features:
            [+] KernelSU Magic Managers
            [+] SUSFS $SUSFS_VERSION
            [+] Maphide LineageOS Detections
            [+] Futile Maphide for jit-zygote-cache Detections
            [+] Magic Mount Support
            
            📅 **Release Date Compatibility Check:**
            - Built on: $BUILD_DATE
          EOF
          )
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.generate-tag.outputs.new_tag }}
          prerelease: true
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ steps.define-release-notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Release Assets Dynamically
        run: |
          for file in ./downloaded-artifacts/kernel-*/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload ${{ steps.generate-tag.outputs.new_tag }} "$file"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls -la ./downloaded-artifacts/**/* || true
