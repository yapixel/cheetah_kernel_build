name: Build and Release Sultan Kernels

permissions:
  contents: write   # Allow writing to repository contents (for pushing tags)
  actions: write    # Allows downloading artifacts

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true

jobs:
  # Build all kernels first
  build-kernel-zuma-xxksu:
    uses: ./.github/workflows/sultan_xxksu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  build-kernel-zuma-ksu:
    uses: ./.github/workflows/sultan_ksu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  build-kernel-zuma-mksu:
    uses: ./.github/workflows/sultan_mksu.yml
    secrets: inherit
    with:
      codename: "zuma"
      repo: "android_kernel_google_zuma"
      android_version: "android14"
      kernel_version: "6.1"

  # Only runs after ALL builds succeed
  generate-tag-and-release:
    runs-on: ubuntu-latest
    needs:
      #- build-kernel-zuma-xxksu
      - build-kernel-zuma-ksu
      - build-kernel-zuma-mksu
    if: ${{ inputs.make_release }}
    permissions:
      contents: write
    env:
      REPO_OWNER: yapixel
      REPO_NAME: Sultan_KernelSU_SUSFS

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Create Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          
          # Fetch all tags from remote (critical!)
          git fetch --tags --force
          
          # Get the latest tag that looks like vX.Y.Z-rN  (or empty if none)
          LATEST_TAG=$(git tag -l "v*-r*" --sort=-version:refname | head -n1 || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tag found, starting from v2.0.0-r0"
            NEW_TAG="v2.0.0-r0"
          else
            echo "Latest tag found: $LATEST_TAG"
            # Split base and -r suffix
            BASE=$(echo "$LATEST_TAG" | sed 's/-r[0-9]*$//')
            REV=$(echo "$LATEST_TAG" | grep -o 'r[0-9]*$' | tr -d 'r')
            NEW_REV=$((REV + 1))
            NEW_TAG="${BASE}-r${NEW_REV}"
          fi
          
          echo "Creating new tag: $NEW_TAG"
          echo "TAG=$NEW_TAG" >> $GITHUB_ENV
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$NEW_TAG" -m "Automatic release $NEW_TAG"
          git push "$REPO" "$NEW_TAG"

      - name: Set Build Date
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Extract SUSFS Version
        run: |
          # TAG is now correctly set from the step above
          SUSFS_VERSION=$(echo "${{ env.TAG }}" | sed 's/-r.*//' | sed 's/^v//')
          echo "SUSFS_VERSION=v$SUSFS_VERSION" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "*TEST BUILD* Sultan Kernels With MKSU & SUSFS_Minimal ${{ env.SUSFS_VERSION }} *TEST BUILD*"
          prerelease: true
          generate_release_notes: false
          body: |
            This release contains MKSU with SUSFS_Minimal ${{ env.SUSFS_VERSION }}
            
            ⚠️ **COMPATIBILITY NOTICE** ⚠️
            Please ensure compatibility by comparing release dates with official Sultan kernel releases:
            - Check official Sultan releases: https://github.com/kerneltoast/android_kernel_google_gs201/releases
            - This build is based on the latest Sultan kernel commits as of build date
            - Always verify your device's Android version matches the kernel target (Android 14)
            - Recommended to use kernels released within 30 days of official Sultan updates
            
            Module:
            -> https://github.com/sidex15/ksu_module_susfs
            
            Managers:
            -> https://github.com/5ec1cff/KernelSU
            
            Features:
            [+] KernelSU Magic Managers
            [+] SUSFS ${{ env.SUSFS_VERSION }}
            [+] Maphide LineageOS Detections
            [+] Futile Maphide for jit-zygote-cache Detections
            [+] Magic Mount Support
            
            📅 **Built on:** ${{ env.BUILD_DATE }}
          files: |
            downloaded-artifacts/**/*.zip
