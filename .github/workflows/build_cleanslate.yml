name: Build CleanSlate Android Kernel with SukiSU (Pixel 8 Pro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      pixel8pro:
        description: 'Enable Pixel 8 Pro (husky) configuration (y/n)'
        required: false
        default: 'y'
      lto_type:
        description: 'LTO type (full/thin/none)'
        required: false
        default: 'full'
      build_clean:
        description: 'Build clean mode (always/auto/never)'
        required: false
        default: 'always'

env:
  BUILD: dev
  PIXEL8PRO: ${{ github.event.inputs.pixel8pro || 'y' }}
  LTO_TYPE: ${{ github.event.inputs.lto_type || 'full' }}
  ZIP_PREFIX: AK3-A14-6.1.145-SukiSU-husky
  KERNEL_DIR: common
  CONFIG_FILE: arch/arm64/configs/gki_defconfig
  OUT_DIR: out
  BUILD_CLEAN: ${{ github.event.inputs.build_clean || 'always' }}
  ANYKERNEL_DIR: AnyKernel3-p8p
  ANYKERNEL_BRANCH: gki-2.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  PATCHES_BRANCH: dev
  BUILDS_DIR: builds/6.1.145
  LOCALVERSION: "-SukiSU-husky"

  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  LLVM_CACHE_PATH: ${{ github.workspace }}/.cache/llvm
  GIT_SHORT_SHA: ${{ github.event.pull_request.head.sha && github.event.pull_request.head.sha || github.sha }}

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize disk space
        run: |
          echo "===== Initial Disk Space ====="
          df -BG
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh
          echo "===== After Cleanup ====="
          df -BG

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          echo "GIT_SHORT_SHA=$(echo ${{ env.GIT_SHORT_SHA }} | cut -c1-7)" >> $GITHUB_ENV
          echo "THREADS=$(nproc)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev zip ccache curl git wget cpio python3 python3-pip \
            device-tree-compiler kmod dwarves pahole zlib1g-dev xxd

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-build-${{ env.LTO_TYPE }}
          max-size: 5G

      - name: Download Clang r487747c (Android 14 official)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Download ARM64 GNU Toolchain 14.3.rel1
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O tc.tar.xz
          tar -xJf tc.tar.xz && rm tc.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*)
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Download ARM32 GNU Toolchain 14.3.rel1
        run: |
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -O tc-arm.tar.xz
          tar -xJf tc-arm.tar.xz && rm tc-arm.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*arm-none-eabi*)
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/arm-none-eabi-" >> $GITHUB_ENV

      - name: Clone CleanSlate kernel source
        run: |
          git clone --depth=1 https://github.com/tbalden/google_common_aosp_simple.git -b aosp_cleanslate_a16_shusky ${{ env.KERNEL_DIR }}

      - name: Clone Google drivers overlay (husky)
        run: |
          git clone --depth 1 --branch cleanslate_shusky_a16 \
            https://github.com/tbalden/google_common_kernel_drivers_simple.git ${{ env.KERNEL_DIR }}/drivers/google

      - name: Setup auxiliary repositories
        run: |
          git clone -b ${{ env.SUSFS_BRANCH }} ${{ env.SUSFS_REPO }} susfs4ksu
          cd susfs4ksu && git checkout a162e2469d0b472545e5e46457eee171c0975fb0 && cd ..
          git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} \
            https://github.com/deepongi-labs/AnyKernel3-p8p ${{ env.ANYKERNEL_DIR }}
          git clone --depth=1 -b ${{ env.PATCHES_BRANCH }} ${{ env.PATCHES_REPO }} kernel_patches

      - name: Prepare kernel source
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clean -fdx || true
          rm -rf KernelSU-Next || true

      - name: Configure Pixel 8 Pro (husky) specific options
        if: env.PIXEL8PRO == 'y'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CONFIG="${{ env.CONFIG_FILE }}"
          cat >> "$CONFIG" << EOF
          CONFIG_ARM64_CORTEX_X4=y
          CONFIG_ARM64_CORTEX_A720=y
          CONFIG_ARM64_CORTEX_A520=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_ARM64_TAGGED_ADDR_ABI=y
          CONFIG_ARM64_SVE=y
          CONFIG_ARM64_BTI=y
          CONFIG_ARM64_PTR_AUTH=y
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_SCHEDUTIL=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_STACKPROTECTOR=n
          CONFIG_STACKPROTECTOR_STRONG=n
          CONFIG_RETPOLINE=n
          CONFIG_CC_HAS_RETPOISON=n
          CONFIG_AS_HAS_NO_RETPOISON=n
          CONFIG_USERLAND_WORKER_PACKED_HOSTS=n
          EOF

      - name: Configure LTO
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CONFIG="${{ env.CONFIG_FILE }}"
          sed -i -E '/^CONFIG_LTO_(CLANG_(FULL|THIN)|NONE)=/d' "$CONFIG" || true
          case "${{ env.LTO_TYPE }}" in
            full) echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG" ;;
            thin) echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG" ;;
            none) echo "CONFIG_LTO_NONE=y" >> "$CONFIG" ;;
          esac

      - name: Add SukiSU-Ultra
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s f9f75d73d80200f7924893c0f22c5bffd471e696

      - name: Apply SuSFS patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cp -fv ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp -fv ../kernel_patches/sukisu/scope_min_manual_hooks_v1.6.patch ./
          mkdir -p fs include/linux
          cp -rfv ../susfs4ksu/kernel_patches/fs/* ./fs/ || true
          cp -rfv ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ || true
          patch -p1 --forward < 50_add_susfs_in_gki-android14-6.1.patch || exit 1
          patch -p1 --forward < scope_min_manual_hooks_v1.6.patch || exit 1
          cp ../kernel_patches/sukisu/fix_namei.c.patch ./
          patch -p1 --forward < fix_namei.c.patch || exit 1

      - name: Final kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CONFIG="${{ env.CONFIG_FILE }}"
          rm -f android/abi_gki_protected_exports_* || true
          cat >> "$CONFIG" << EOF
          CONFIG_LOCALVERSION="${{ env.LOCALVERSION }}"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          EOF
          sed -i '/^CONFIG_DEBUG_INFO_BTF/d' "$CONFIG"
          echo "# CONFIG_DEBUG_INFO_BTF is not set" >> "$CONFIG"

      - name: Disable userland_worker completely
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i '/userland_worker\.o/d' init/Makefile
          CONFIG="${{ env.CONFIG_FILE }}"
          sed -i '/^CONFIG_USERLAND_WORKER/d' "$CONFIG"
          echo "# CONFIG_USERLAND_WORKER is not set" >> "$CONFIG"

      - name: Prepare build directory
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i '/# Check for uncommitted changes\./,/fi/d' ./scripts/setlocalversion || true
          sed -i '2s/check_defconfig//' ./build.config.gki 2>/dev/null || true
          if [ "${{ env.BUILD_CLEAN }}" = "always" ]; then
            rm -rf ${{ env.OUT_DIR }}
          fi
          mkdir -p ${{ env.OUT_DIR }}

      - name: Build kernel Image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make -j${{ env.THREADS }} \
            LLVM_IAS=1 LLVM=1 ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CC="ccache clang" KCFLAGS="-fno-stack-protector" \
            LD=ld.lld HOSTLD=ld.lld O="${{ env.OUT_DIR }}" \
            gki_defconfig all

      - name: Build Google driver modules
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make -j${{ env.THREADS }} \
            LLVM_IAS=1 LLVM=1 ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CC="ccache clang" \
            LD=ld.lld HOSTLD=ld.lld O="${{ env.OUT_DIR }}" \
            modules

      - name: Package kernel + modules
        run: |
          IMAGE="${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image"
          cp -fv "$IMAGE" "${{ env.ANYKERNEL_DIR }}"/

          mkdir -p "${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules"
          find ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }} -name '*.ko' -exec cp {} "${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules/" \;
          ${{ env.ARM64_TOOLCHAIN }}strip --strip-unneeded "${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules/"*.ko 2>/dev/null || true

          cd "${{ env.ANYKERNEL_DIR }}"
          rm -rf .git

          BUILD_VER=$(curl -s https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/version || echo "40000")
          TIMESTAMP=$(TZ=UTC date -u +"%Y%m%dT%H%MZ")
          BUILD_LABEL="${TIMESTAMP}-${{ env.GIT_SHORT_SHA }}"
          ZIP_NAME="${{ env.ZIP_PREFIX }}-${BUILD_LABEL}-${BUILD_VER}.zip"

          zip -r9 "../${ZIP_NAME}" ./*
          mkdir -p "../${{ env.BUILDS_DIR }}"
          mv "../${ZIP_NAME}" "../${{ env.BUILDS_DIR }}/"

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "BUILD_VER=${BUILD_VER}" >> $GITHUB_ENV

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Generate build info
        run: |
          cat > build_info.txt << EOF
          Build Information
          =================
          Device: Pixel 8 Pro (husky)
          Kernel Version: 6.1.145
          Build Number: ${{ env.BUILD_VER }}
          Build Date: $(date -u)
          Commit: ${{ github.sha }}
          LTO: ${{ env.LTO_TYPE }}
          Features: SukiSU-Ultra + SuSFS + Google modules + BBR + IPSet
          EOF
          cat build_info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build_info.txt
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
            build_info.txt
          body: |
            Pixel 8 Pro (husky) CleanSlate Kernel with SukiSU-Ultra
            Build: ${{ env.BUILD_VER }} • LTO: ${{ env.LTO_TYPE }}
