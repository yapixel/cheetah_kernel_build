# ============================================================
#  Sultan Kernel Builder — KernelSU-Next + SUSFS
#  Supports: Pixel 7/7a/7 Pro (gs201), Pixel 8/8 Pro (zuma),
#            Pixel 9/9 Pro/Fold/XL (zumapro), and the new
#            unified Pixel 7–9 tree (tensynos)
#
#  Sources:
#    Kernel  : github.com/kerneltoast/android_kernel_google_<soc>
#    KSU     : github.com/rifsxd/KernelSU-Next  (next-susfs branch)
#    SUSFS   : gitlab.com/simonpunk/susfs4ksu   (sultan-shiba-susfs-minimal)
#    AnyKernel3 : github.com/osm0sis/AnyKernel3
# ============================================================

name: Build Sultan Kernel (KSU + SUSFS)

on:
  # ── Manual trigger with device/version inputs ──────────────
  workflow_dispatch:
    inputs:
      device_soc:
        description: "Target SoC / kernel tree"
        required: true
        default: "zuma"
        type: choice
        options:
          - gs201       # Pixel 7 / 7a / 7 Pro   (Android 14/15/16 → tensynos)
          - zuma        # Pixel 8 / 8 Pro          (Android 14/15/16 → tensynos)
          - zumapro     # Pixel 9 / 9 Pro / Fold / XL (→ tensynos)
          - tensynos    # Unified Pixel 7-9 tree (2026+)

      android_version:
        description: "Android target version"
        required: true
        default: "16"
        type: choice
        options:
          - "14"
          - "15"
          - "16"

      kernel_branch:
        description: "Sultan kernel branch (leave blank for auto)"
        required: false
        default: ""

      ksu_version:
        description: "KernelSU-Next version tag (blank = latest)"
        required: false
        default: ""

      susfs_branch:
        description: "SUSFS branch"
        required: false
        default: "sultan-shiba-susfs-minimal"

      enable_lto:
        description: "Enable LTO (Link Time Optimisation)"
        required: false
        default: "thin"
        type: choice
        options:
          - "none"
          - "thin"
          - "full"

      release:
        description: "Create a GitHub Release after build"
        required: false
        default: "true"
        type: boolean

  # ── Scheduled nightly rebuild (optional) ───────────────────
  # Uncomment to enable automatic nightly builds:
  # schedule:
  #   - cron: '0 2 * * *'   # 02:00 UTC daily

# ── Cancel redundant runs ───────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared environment variables ───────────────────────────
env:
  # Toolchain — Android Clang from Google LLVM prebuilts
  CLANG_VERSION: "r510928"          # Clang 18 — adjust as needed
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"

  # AnyKernel3
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3"
  AK3_BRANCH: "master"

  # Kernel common settings
  ARCH: "arm64"
  SUBARCH: "arm64"
  MAKE_JOBS: "$(nproc --all)"

jobs:
  # ════════════════════════════════════════════════════════════
  #  JOB 1 — Resolve all versions / URLs before building
  # ════════════════════════════════════════════════════════════
  prepare:
    name: "Prepare build parameters"
    runs-on: ubuntu-24.04
    outputs:
      kernel_repo:    ${{ steps.resolve.outputs.kernel_repo }}
      kernel_branch:  ${{ steps.resolve.outputs.kernel_branch }}
      defconfig:      ${{ steps.resolve.outputs.defconfig }}
      ak3_device:     ${{ steps.resolve.outputs.ak3_device }}
      release_tag:    ${{ steps.resolve.outputs.release_tag }}
      release_name:   ${{ steps.resolve.outputs.release_name }}

    steps:
      - name: Resolve build parameters
        id: resolve
        run: |
          DEVICE_SOC="${{ github.event.inputs.device_soc || 'zuma' }}"
          ANDROID_VER="${{ github.event.inputs.android_version || '16' }}"
          USER_BRANCH="${{ github.event.inputs.kernel_branch }}"

          # ── Kernel repository mapping ─────────────────────
          case "$DEVICE_SOC" in
            gs201)
              KERNEL_REPO="https://github.com/kerneltoast/android_kernel_google_tensynos"
              AK3_DEVICE="gs201"
              DEFCONFIG="slider_defconfig"
              ;;
            zuma)
              KERNEL_REPO="https://github.com/kerneltoast/android_kernel_google_tensynos"
              AK3_DEVICE="zuma"
              DEFCONFIG="zuma_defconfig"
              ;;
            zumapro)
              KERNEL_REPO="https://github.com/kerneltoast/android_kernel_google_tensynos"
              AK3_DEVICE="zumapro"
              DEFCONFIG="zumapro_defconfig"
              ;;
            tensynos)
              KERNEL_REPO="https://github.com/kerneltoast/android_kernel_google_tensynos"
              AK3_DEVICE="tensynos"
              DEFCONFIG="slider_defconfig"
              ;;
            *)
              echo "::error::Unknown SoC: $DEVICE_SOC"
              exit 1
              ;;
          esac

          # ── Branch resolution ─────────────────────────────
          if [ -n "$USER_BRANCH" ]; then
            KERNEL_BRANCH="$USER_BRANCH"
          else
            KERNEL_BRANCH="${ANDROID_VER}.0.0-sultan"
          fi

          # ── Release tag / name ────────────────────────────
          DATE=$(date +'%Y%m%d')
          RELEASE_TAG="sultan-${DEVICE_SOC}-ksu-susfs-${DATE}"
          RELEASE_NAME="Sultan Kernel ${DEVICE_SOC^^} | KSU-Next + SUSFS | ${DATE}"

          echo "kernel_repo=$KERNEL_REPO"       >> "$GITHUB_OUTPUT"
          echo "kernel_branch=$KERNEL_BRANCH"   >> "$GITHUB_OUTPUT"
          echo "defconfig=$DEFCONFIG"            >> "$GITHUB_OUTPUT"
          echo "ak3_device=$AK3_DEVICE"          >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG"        >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME"      >> "$GITHUB_OUTPUT"

          echo "### Build Parameters" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |"     >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|"     >> "$GITHUB_STEP_SUMMARY"
          echo "| SoC | $DEVICE_SOC |"                   >> "$GITHUB_STEP_SUMMARY"
          echo "| Android | $ANDROID_VER |"              >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel repo | $KERNEL_REPO |"          >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel branch | $KERNEL_BRANCH |"      >> "$GITHUB_STEP_SUMMARY"
          echo "| Defconfig | $DEFCONFIG |"              >> "$GITHUB_STEP_SUMMARY"
          echo "| Release tag | $RELEASE_TAG |"          >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════
  #  JOB 2 — Build the kernel
  # ════════════════════════════════════════════════════════════
  build:
    name: "Build Kernel"
    needs: prepare
    runs-on: ubuntu-24.04

    steps:
      # ── 0. Free up disk space ─────────────────────────────
      - name: Maximise disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # ── 1. Install build dependencies ────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl \
            flex git kmod libelf-dev libssl-dev libncurses-dev lld \
            llvm lz4 make ninja-build python3 rsync unzip wget zip \
            zstd device-tree-compiler pahole

      # ── 2. Set up ccache ─────────────────────────────────
      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sultan-${{ needs.prepare.outputs.defconfig }}-${{ github.sha }}
          restore-keys: |
            ccache-sultan-${{ needs.prepare.outputs.defconfig }}-
            ccache-sultan-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats

      # ── 3. Download Clang toolchain ───────────────────────
      - name: Download Android Clang toolchain
        run: |
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          echo "Fetching Clang ${{ env.CLANG_VERSION }}..."
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b main \
            --filter=blob:none \
            --sparse \
            clang-prebuilts
          cd clang-prebuilts
          git sparse-checkout set "clang-${{ env.CLANG_VERSION }}"
          echo "CLANG_DIR=$HOME/toolchains/clang-prebuilts/clang-${{ env.CLANG_VERSION }}/bin" >> "$GITHUB_ENV"
          echo "Clang version:"
          "$HOME/toolchains/clang-prebuilts/clang-${{ env.CLANG_VERSION }}/bin/clang" --version

      # ── 4. Clone Sultan kernel source ────────────────────
      - name: Clone Sultan kernel source
        run: |
          echo "Cloning ${{ needs.prepare.outputs.kernel_repo }} @ ${{ needs.prepare.outputs.kernel_branch }}"
          git clone --depth=1 \
            --branch "${{ needs.prepare.outputs.kernel_branch }}" \
            "${{ needs.prepare.outputs.kernel_repo }}" \
            kernel/sultan
          echo "Kernel HEAD: $(git -C kernel/sultan log --oneline -1)"

      # ── 5. Clone KernelSU-Next (next-susfs branch) ───────
      - name: Integrate KernelSU-Next
        working-directory: kernel/sultan
        run: |
          KSU_VERSION="${{ github.event.inputs.ksu_version }}"

          echo "Setting up KernelSU-Next (next-susfs branch)..."
          if [ -n "$KSU_VERSION" ]; then
            curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" \
              | bash -s "next-susfs" "$KSU_VERSION"
          else
            curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" \
              | bash -s "next-susfs"
          fi

          echo "KernelSU-Next version: $(cat KernelSU-Next/kernel/version 2>/dev/null || echo 'unknown')"

      # ── 6. Clone SUSFS and apply patches ─────────────────
      - name: Apply SUSFS patches
        working-directory: kernel/sultan
        run: |
          SUSFS_BRANCH="${{ github.event.inputs.susfs_branch || 'sultan-shiba-susfs-minimal' }}"
          echo "Cloning SUSFS branch: $SUSFS_BRANCH"

          git clone --depth=1 \
            --branch "$SUSFS_BRANCH" \
            "https://gitlab.com/simonpunk/susfs4ksu.git" \
            ../susfs4ksu

          SUSFS_DIR="../susfs4ksu"
          KERNEL_VER=$(make kernelversion 2>/dev/null | head -1)
          MAJOR=$(echo "$KERNEL_VER" | cut -d. -f1)
          MINOR=$(echo "$KERNEL_VER" | cut -d. -f2)
          echo "Detected kernel version: $KERNEL_VER (${MAJOR}.${MINOR})"

          # ── Copy fs/ sources ──────────────────────────────
          if [ -d "$SUSFS_DIR/kernel_patches/fs" ]; then
            echo "Copying SUSFS fs/ sources..."
            cp -v "$SUSFS_DIR/kernel_patches/fs/"* fs/
          fi

          # ── Copy include/ headers ─────────────────────────
          if [ -d "$SUSFS_DIR/kernel_patches/include/linux" ]; then
            echo "Copying SUSFS include/linux/ headers..."
            cp -v "$SUSFS_DIR/kernel_patches/include/linux/"* include/linux/
          fi

          # ── Apply the KSU SUSFS enablement patch ─────────
          KSU_PATCH="$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            echo "Applying KSU SUSFS patch..."
            cp "$KSU_PATCH" KernelSU-Next/
            cd KernelSU-Next
            patch -p1 --forward < 10_enable_susfs_for_ksu.patch || \
              echo "::warning::KSU SUSFS patch already applied or had conflicts"
            cd ..
          else
            echo "::warning::KSU SUSFS patch not found at expected path — skipping"
          fi

          # ── Apply the main kernel SUSFS patch ────────────
          # Try versioned patch first, fall back to generic
          PATCH_FILE=""
          for CANDIDATE in \
            "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-${MAJOR}.${MINOR}.patch" \
            "$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android${ANDROID_VER}-${MAJOR}.${MINOR}.patch" \
            "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel.patch"
          do
            if [ -f "$CANDIDATE" ]; then
              PATCH_FILE="$CANDIDATE"
              break
            fi
          done

          if [ -n "$PATCH_FILE" ]; then
            echo "Applying SUSFS kernel patch: $PATCH_FILE"
            patch -p1 --forward < "$PATCH_FILE" || \
              echo "::warning::SUSFS kernel patch had conflicts — review build output"
          else
            echo "::warning::No matching SUSFS kernel patch found — attempting manual file copy"
          fi

          echo "SUSFS patch step complete."
        env:
          ANDROID_VER: ${{ github.event.inputs.android_version || '16' }}

      # ── 7. Configure kernel ───────────────────────────────
      - name: Configure kernel
        working-directory: kernel/sultan
        run: |
          LTO="${{ github.event.inputs.enable_lto || 'thin' }}"
          DEFCONFIG="${{ needs.prepare.outputs.defconfig }}"

          export PATH="${{ env.CLANG_DIR }}:$PATH"

          echo "Building defconfig: $DEFCONFIG"
          make O=out \
            ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

          # ── Enable KSU + SUSFS config options ─────────────
          echo "Enabling KSU and SUSFS Kconfig options..."
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT

          # ── LTO settings ──────────────────────────────────
          case "$LTO" in
            full)
              echo "Enabling full LTO..."
              scripts/config --file out/.config \
                -e CONFIG_LTO_CLANG \
                -e CONFIG_LTO_CLANG_FULL \
                -d CONFIG_LTO_CLANG_THIN \
                -d CONFIG_LTO_NONE
              ;;
            thin)
              echo "Enabling thin LTO..."
              scripts/config --file out/.config \
                -e CONFIG_LTO_CLANG \
                -e CONFIG_LTO_CLANG_THIN \
                -d CONFIG_LTO_CLANG_FULL \
                -d CONFIG_LTO_NONE
              ;;
            none)
              echo "Disabling LTO..."
              scripts/config --file out/.config \
                -d CONFIG_LTO_CLANG \
                -d CONFIG_LTO_CLANG_THIN \
                -d CONFIG_LTO_CLANG_FULL \
                -e CONFIG_LTO_NONE
              ;;
          esac

          # Regenerate .config to resolve any missing symbols
          make O=out \
            ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "Final KSU config:"
          grep -E "CONFIG_KSU|CONFIG_LTO" out/.config || true

      # ── 8. Compile kernel ─────────────────────────────────
      - name: Compile kernel
        working-directory: kernel/sultan
        run: |
          export PATH="${{ env.CLANG_DIR }}:$PATH"
          export CCACHE_DIR="$HOME/.ccache"

          echo "Starting kernel build with $(nproc --all) threads..."
          time make O=out \
            ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc --all) \
            2>&1 | tee build.log

          echo "Build complete."
          echo "Kernel image: $(find out/arch/arm64/boot -name 'Image*' 2>/dev/null | head -5)"

          ccache --show-stats

      # ── 9. Package with AnyKernel3 ────────────────────────
      - name: Package with AnyKernel3
        run: |
          SOC="${{ needs.prepare.outputs.ak3_device }}"
          DATE=$(date +'%Y%m%d')
          ANDROID_VER="${{ github.event.inputs.android_version || '16' }}"
          LTO="${{ github.event.inputs.enable_lto || 'thin' }}"

          echo "Cloning AnyKernel3..."
          git clone --depth=1 "${{ env.AK3_REPO }}" -b "${{ env.AK3_BRANCH }}" anykernel3

          # ── Find kernel image ─────────────────────────────
          IMAGE=""
          for CANDIDATE in \
            "kernel/sultan/out/arch/arm64/boot/Image.lz4-dtb" \
            "kernel/sultan/out/arch/arm64/boot/Image.lz4" \
            "kernel/sultan/out/arch/arm64/boot/Image-dtb" \
            "kernel/sultan/out/arch/arm64/boot/Image"
          do
            if [ -f "$CANDIDATE" ]; then
              IMAGE="$CANDIDATE"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "::error::No kernel image found! Build may have failed."
            ls -la kernel/sultan/out/arch/arm64/boot/ 2>/dev/null || true
            exit 1
          fi
          echo "Using kernel image: $IMAGE"
          cp "$IMAGE" anykernel3/Image

          # ── Copy DTBs if present ──────────────────────────
          DTB_DIR="kernel/sultan/out/arch/arm64/boot/dts"
          if [ -d "$DTB_DIR" ]; then
            echo "Copying DTB files..."
            find "$DTB_DIR" -name "*.dtb" -exec cp {} anykernel3/ \; 2>/dev/null || true
            find "$DTB_DIR" -name "*.dtbo" -exec cp {} anykernel3/ \; 2>/dev/null || true
          fi

          # ── Configure anykernel.sh ────────────────────────
          cat > anykernel3/anykernel.sh << EOF
          # AnyKernel3 — Sultan Kernel + KSU-Next + SUSFS
          # Auto-generated by GitHub Actions

          kernel.string=Sultan Kernel | KernelSU-Next + SUSFS v${ANDROID_VER} | ${DATE}
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${SOC}
          supported.versions=
          supported.patchlevels=

          # AnyKernel methods (don't edit)
          . tools/ak3-core.sh

          # boot/init_boot patching
          split_boot
          flash_boot
          EOF

          # ── Create the flashable zip ──────────────────────
          ZIP_NAME="Sultan-${SOC^^}-A${ANDROID_VER}-KSU-SUSFS-LTO${LTO^^}-${DATE}.zip"
          cd anykernel3
          zip -r9 "../$ZIP_NAME" . -x "*.git*" -x "README.md"
          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Flashable zip: $ZIP_NAME ($(du -sh "$ZIP_NAME" | cut -f1))"

          # Compute SHA256
          sha256sum "$ZIP_NAME" | tee "${ZIP_NAME}.sha256"

      # ── 10. Upload artifacts ──────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ needs.prepare.outputs.ak3_device }}
          path: kernel/sultan/build.log
          retention-days: 7

      # ── 11. Write job summary ─────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| SoC | ${{ needs.prepare.outputs.ak3_device }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ needs.prepare.outputs.kernel_branch }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| LTO | ${{ github.event.inputs.enable_lto || 'thin' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SUSFS branch | ${{ github.event.inputs.susfs_branch || 'sultan-shiba-susfs-minimal' }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ZIP_NAME" ]; then
            echo "| Output | \`$ZIP_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
            SHA=$(cat "${ZIP_NAME}.sha256" 2>/dev/null | awk '{print $1}')
            echo "| SHA256 | \`$SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ════════════════════════════════════════════════════════════
  #  JOB 3 — Publish a GitHub Release (optional)
  # ════════════════════════════════════════════════════════════
  release:
    name: "Publish Release"
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    if: |
      github.event.inputs.release == 'true' &&
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          # pattern picks up the zip artifact regardless of exact name
          pattern: "Sultan-*"
          merge-multiple: true

      - name: Generate release notes
        id: relnotes
        run: |
          SOC="${{ needs.prepare.outputs.ak3_device }}"
          ANDROID_VER="${{ github.event.inputs.android_version || '16' }}"
          SUSFS_BRANCH="${{ github.event.inputs.susfs_branch || 'sultan-shiba-susfs-minimal' }}"
          DATE=$(date +'%B %d, %Y')

          cat << 'EOF' > release_notes.md
          ## Sultan Kernel | KernelSU-Next + SUSFS

          Built automatically by GitHub Actions.

          ### Features
          - ✅ KernelSU-Next (`next-susfs` branch)
          - ✅ SUSFS kernel patches (`sultan-shiba-susfs-minimal`)
          - ✅ Magic Mount support
          - ✅ Manual hooks (no kprobe dependency)
          - ✅ AnyKernel3 flashable zip

          ### Installation
          1. Ensure your bootloader is unlocked
          2. Flash via [Kernel Flasher](https://github.com/libxzr/HorizonKernelFlasher) or a custom recovery
          3. Install [susfs4ksu-module](https://github.com/sidex15/susfs4ksu-module) via KSU manager
          4. Use [Wild KSU](https://github.com/WildKernels/Wild_KSU) or [KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next) manager

          ### ⚠️ Disclaimer
          Flashing custom kernels **voids your warranty** and carries a risk of bricking.
          Always back up your data. Flash at your own risk.

          ---
          *Kernel source: [kerneltoast/android_kernel_google_tensynos](https://github.com/kerneltoast/android_kernel_google_tensynos)*
          EOF

          # Append SHA256 checksums
          echo "" >> release_notes.md
          echo "### Checksums (SHA256)" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cat *.sha256 2>/dev/null >> release_notes.md || echo "No checksums found" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release_notes.md
          files: |
            Sultan-*.zip
            Sultan-*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
