name: Build CleanSlate with SukiSU (Pure Bazel)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      pixel8a:
        description: 'Enable Pixel 8a config (y/n)'
        required: false
        default: 'y'
      lto_type:
        description: 'LTO type (full/thin/none)'
        required: false
        default: 'thin'

env:
  PIXEL8A: ${{ github.event.inputs.pixel8a || 'y' }}
  LTO_TYPE: ${{ github.event.inputs.lto_type || 'thin' }}
  ZIP_PREFIX: AK3-A14-6.1.134-SukiSU
  KERNEL_DIR: common
  CONFIG_FILE: arch/arm64/configs/gki_defconfig
  OUT_DIR: out
  ANYKERNEL_DIR: AnyKernel3-p8a
  ANYKERNEL_BRANCH: gki-2.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  PATCHES_BRANCH: dev
  BUILDS_DIR: builds/6.1.134
  GIT_SHORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev zip ccache curl git wget cpio python3 device-tree-compiler \
            kmod dwarves pahole zlib1g-dev xxd openjdk-11-jdk

      - name: Install Bazelisk
        run: |
          curl -L -o bazel https://github.com/bazelbuild/bazelisk/releases/download/v1.22.0/bazelisk-linux-amd64
          chmod +x bazel
          sudo mv bazel /usr/local/bin/bazel
          bazel --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cleanslate-bazel-${{ env.LTO_TYPE }}
          max-size: 6G

      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/tbalden/google_common_aosp_simple.git -b aosp_cleanslate_a16_shusky ${{ env.KERNEL_DIR }}

      - name: Clone Google drivers overlay
        run: |
          git clone --depth=1 --branch cleanslate_shusky_a16 \
            https://github.com/tbalden/google_common_kernel_drivers_simple.git ${{ env.KERNEL_DIR }}/drivers/google

      - name: Download LLVM/Clang toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz
          tar -xzf clang-r487747c.tar.gz
          rm clang-r487747c.tar.gz

      - name: Clone supporting repos
        run: |
          git clone -b ${{ env.SUSFS_BRANCH }} ${{ env.SUSFS_REPO }} susfs4ksu
          git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} https://github.com/deepongi-labs/${{ env.ANYKERNEL_DIR }} ${{ env.ANYKERNEL_DIR }}
          git clone --depth=1 -b ${{ env.PATCHES_BRANCH }} ${{ env.PATCHES_REPO }} kernel_patches

      - name: Apply SUSFS patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cp -fv ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp -fv ../kernel_patches/sukisu/scope_min_manual_hooks_v1.5.patch ./
          cp -fv ../kernel_patches/sukisu/fix_namei.c.patch ./
         
          mkdir -p fs include/linux
          cp -rfv ../susfs4ksu/kernel_patches/fs/* ./fs/ || true
          cp -rfv ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ || true
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true
          patch -p1 < scope_min_manual_hooks_v1.5.patch || true
          patch -p1 < fix_namei.c.patch

      - name: Pixel 8a specific config (if enabled)
        if: env.PIXEL8A == 'y'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cat >> "${{ env.CONFIG_FILE }}" << 'EOF'
          CONFIG_ARM64_CORTEX_X3=y
          CONFIG_ARM64_CORTEX_A715=y
          CONFIG_ARM64_CORTEX_A510=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_ARM64_TAGGED_ADDR_ABI=y
          CONFIG_ARM64_SVE=y
          CONFIG_ARM64_BTI=y
          CONFIG_ARM64_PTR_AUTH=y
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_SCHEDUTIL=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_STACKPROTECTOR=n
          CONFIG_RETPOLINE=n
          EOF

      - name: Configure LTO
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i -E '/^CONFIG_LTO_(CLANG_(FULL|THIN)|NONE)=/d' "${{ env.CONFIG_FILE }}" || true
          case "${{ env.LTO_TYPE }}" in
            full) echo "CONFIG_LTO_CLANG_FULL=y" >> "${{ env.CONFIG_FILE }}" ;;
            thin) echo "CONFIG_LTO_CLANG_THIN=y" >> "${{ env.CONFIG_FILE }}" ;;
            none) echo "CONFIG_LTO_NONE=y" >> "${{ env.CONFIG_FILE }}" ;;
          esac

      - name: Final kernel config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cat >> "${{ env.CONFIG_FILE }}" << 'EOF'
          CONFIG_LOCALVERSION=""
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          # CONFIG_DEBUG_INFO_BTF is not set
          EOF
          
      - name: Disable userland_worker completely
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i '/userland_worker\.o/d' init/Makefile
          CONFIG="${{ env.CONFIG_FILE }}"
          sed -i '/^CONFIG_USERLAND_WORKER/d' "$CONFIG"
          echo "# CONFIG_USERLAND_WORKER is not set" >> "$CONFIG"
          

      - name: Create Bazel Workspace (Sanitized)
        working-directory: ${{ env.KERNEL_DIR }}
        shell: python
        run: |
          import os

          # Get absolute path to HOME (e.g., /home/runner)
          home_dir = os.environ.get("HOME")
          
          print(f"DEBUG: Resolving HOME to: {home_dir}")

          # 1. Write MODULE.bazel
          with open("MODULE.bazel", "w") as f:
              f.write('module(name = "kernel", version = "1.0")\n')

          # 2. Write BUILD.bazel
          # We use raw string r'' for the content to protect $$
          build_content = r'''
          genrule(
              name = "kernel_image",
              srcs = glob(["**/*"], exclude=["bazel-*/**"]),
              outs = ["Image"],
              cmd = """
                  export ARCH=arm64
                  export SUBARCH=arm64
                  export CROSS_COMPILE=aarch64-linux-gnu-
                  export CLANG_TRIPLE=aarch64-linux-gnu-
                  export LLVM=1
                  export LLVM_IAS=1
                  
                  # PATH setup
                  export PATH="$$(dirname $$(dirname $(location //llvm_toolchain:clang)))/bin:$$PATH"
                  export CC=$$(dirname $$(dirname $(location //llvm_toolchain:clang)))/bin/clang
                  
                  KERNEL_SRC=$$(dirname $$(echo $(SRCS) | awk '{print $$1}'))
                  OUT_DIR=$$(mktemp -d)
                  
                  make -C $$KERNEL_SRC O=$$OUT_DIR gki_defconfig
                  make -C $$KERNEL_SRC O=$$OUT_DIR -j$$(nproc) Image
                  
                  cp $$OUT_DIR/arch/arm64/boot/Image $@
                  rm -rf $$OUT_DIR
              """,
              tools = ["//llvm_toolchain:clang"],
              visibility = ["//visibility:public"],
          )

          genrule(
              name = "kernel_modules",
              srcs = glob(["**/*"], exclude=["bazel-*/**"]),
              outs = ["modules.tar.gz"],
              cmd = """
                  export ARCH=arm64
                  export SUBARCH=arm64
                  export CROSS_COMPILE=aarch64-linux-gnu-
                  export CLANG_TRIPLE=aarch64-linux-gnu-
                  export LLVM=1
                  export LLVM_IAS=1
                  
                  export PATH="$$(dirname $$(dirname $(location //llvm_toolchain:clang)))/bin:$$PATH"
                  export CC=$$(dirname $$(dirname $(location //llvm_toolchain:clang)))/bin/clang
                  
                  KERNEL_SRC=$$(dirname $$(echo $(SRCS) | awk '{print $$1}'))
                  OUT_DIR=$$(mktemp -d)
                  MODULES_OUT=$$(mktemp -d)
                  
                  make -C $$KERNEL_SRC O=$$OUT_DIR gki_defconfig
                  make -C $$KERNEL_SRC O=$$OUT_DIR -j$$(nproc) modules
                  make -C $$KERNEL_SRC O=$$OUT_DIR INSTALL_MOD_PATH=$$MODULES_OUT modules_install
                  
                  tar -czf $@ -C $$MODULES_OUT .
                  rm -rf $$OUT_DIR $$MODULES_OUT
              """,
              tools = ["//llvm_toolchain:clang"],
              visibility = ["//visibility:public"],
          )
          '''
          
          with open("BUILD.bazel", "w") as f:
              f.write(build_content)

          # 3. Write .bazelrc with ABSOLUTE PATHS
          # We inject the python 'home_dir' variable so '$HOME' is not used in the file text
          rc_content = f"""
          build --disk_cache={home_dir}/.bazel-cache
          build --jobs=4
          build --action_env=CCACHE_DIR={home_dir}/.ccache
          build --action_env=PATH
          """
          
          with open(".bazelrc", "w") as f:
              f.write(rc_content)
              
          print("SUCCESS: Generated Bazel files with absolute paths.")



      - name: Setup LLVM toolchain for Bazel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p llvm_toolchain
          
          # Create BUILD file for toolchain
          cat > llvm_toolchain/BUILD.bazel << 'EOF'
          exports_files([
              "clang",
              "clang++",
              "llvm-ar",
              "llvm-nm",
              "llvm-objcopy",
              "llvm-objdump",
              "llvm-strip",
          ])
          EOF
          
          # Copy toolchain binaries
          TOOLCHAIN_PATH="$(pwd)/../toolchain"
          cp -L "$TOOLCHAIN_PATH/bin/clang" llvm_toolchain/
          cp -L "$TOOLCHAIN_PATH/bin/clang++" llvm_toolchain/ || true
          cp -L "$TOOLCHAIN_PATH/bin/llvm-ar" llvm_toolchain/ || true
          cp -L "$TOOLCHAIN_PATH/bin/llvm-nm" llvm_toolchain/ || true
          cp -L "$TOOLCHAIN_PATH/bin/llvm-objcopy" llvm_toolchain/ || true
          cp -L "$TOOLCHAIN_PATH/bin/llvm-objdump" llvm_toolchain/ || true
          cp -L "$TOOLCHAIN_PATH/bin/llvm-strip" llvm_toolchain/ || true
          
          chmod +x llvm_toolchain/*

      - name: Build kernel with Bazel
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          export PATH="$(pwd)/../toolchain/bin:$PATH"
          
          bazel build //:kernel_image --verbose_failures
          bazel build //:kernel_modules --verbose_failures

      - name: Extract build artifacts
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p ../${{ env.OUT_DIR }}/arch/arm64/boot
          mkdir -p ../${{ env.OUT_DIR }}/modules
          
          # Copy Image
          cp bazel-bin/Image ../${{ env.OUT_DIR }}/arch/arm64/boot/
          
          # Extract modules
          cd ../${{ env.OUT_DIR }}/modules
          tar -xzf ../../${{ env.KERNEL_DIR }}/bazel-bin/modules.tar.gz
          find . -name "*.ko" -exec cp {} . \;

      - name: Package AnyKernel3 zip
        run: |
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image ${{ env.ANYKERNEL_DIR }}/
          mkdir -p ${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules
          cp ${{ env.OUT_DIR }}/modules/*.ko ${{ env.ANYKERNEL_DIR }}/modules/system/lib/modules/ 2>/dev/null || true

          cd ${{ env.ANYKERNEL_DIR }}
          rm -rf .git
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
          ZIP_NAME="${{ env.ZIP_PREFIX }}-${TIMESTAMP}-${{ env.GIT_SHORT_SHA }}.zip"
          zip -r9 "../${ZIP_NAME}" ./*
          mkdir -p "../${{ env.BUILDS_DIR }}"
          mv "../${ZIP_NAME}" "../${{ env.BUILDS_DIR }}/"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUILDS_DIR }}/*.zip