name: Build Husky A16 Kernel (Sultan & GKI)

on:
  workflow_dispatch:
  

jobs:
  xxksu-sultan:
    runs-on: ubuntu-latest
    name: xxKSU | Sultan GCC
    outputs:
      sultan_tag: ${{ steps.tag.outputs.sultan_tag }}
      ksu_ver: ${{ steps.ksu.outputs.ksu_ver }}
      zip_name: ${{ steps.package.outputs.zip_name }}

    env:
      KERNEL_CODENAME: "zuma"
      KERNEL_VERSION: "6.1.134"
      build_date: "Tue Jul 8 09:17:32 UTC 2025"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GCC 13.3.0
        run: |
          wget -q https://kernel.org/pub/tools/crosstool/files/bin/x86_64/13.3.0/x86_64-gcc-13.3.0-nolibc-aarch64-linux.tar.gz -O gcc.tar.gz
          tar -xf gcc.tar.gz
          echo "GCC_PATH=$PWD/gcc-13.3.0-nolibc/aarch64-linux/bin/aarch64-linux-" >> $GITHUB_ENV

      - name: Clone Source & Dependencies
        run: |
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_zuma -b 16.0.0-sultan sultan
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "sultan-zuma" AK3
          git clone --depth=1 https://github.com/TheSillyOk/kernel_ls_patches ok_patches
          git clone --depth=1 https://github.com/TheSillyOk/sh sh

      - name: Get latest Sultan tag
        id: tag
        run: |
          cd sultan
          SULTAN_TAG=$(git tag --sort=-committerdate | head -n1)
          if [ -z "$SULTAN_TAG" ]; then
            echo "Error: No tags found in sultan repo!"
            exit 1
          fi
          echo "Latest Sultan tag: $SULTAN_TAG"
          echo "sultan_tag=$SULTAN_TAG" >> $GITHUB_OUTPUT

      - name: Get xxKSU Version
        id: ksu
        run: |
          KSU_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "master" || echo "unknown")
          echo "xxKSU version: r$KSU_VER"
          echo "ksu_ver=$KSU_VER" >> $GITHUB_OUTPUT

      - name: Setup Configs & Patches
        run: |
          cd sultan
          patch -p1 -F 3 < "../ok_patches/sultan/scope-min-hooks-v1.6.patch"
          
          DEFCONFIG="arch/arm64/configs/zuma_defconfig"
          
          configs="CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y CONFIG_IP_NF_TARGET_TTL=y CONFIG_IP6_NF_TARGET_HL=y CONFIG_IP6_NF_MATCH_HL=y CONFIG_TCP_CONG_ADVANCED=y CONFIG_TCP_CONG_BBR=y CONFIG_NET_SCH_FQ=y CONFIG_TCP_CONG_BIC=n CONFIG_TCP_CONG_WESTWOOD=n CONFIG_TCP_CONG_HTCP=n CONFIG_DEFAULT_BBR=y CONFIG_BPF_STREAM_PARSER=y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y CONFIG_NETFILTER_XT_SET=y CONFIG_IP_SET=y CONFIG_IP_SET_MAX=65534 CONFIG_IP_SET_BITMAP_IP=y CONFIG_IP_SET_BITMAP_IPMAC=y CONFIG_IP_SET_BITMAP_PORT=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_IPMARK=y CONFIG_IP_SET_HASH_IPPORT=y CONFIG_IP_SET_HASH_IPPORTIP=y CONFIG_IP_SET_HASH_IPPORTNET=y CONFIG_IP_SET_HASH_IPMAC=y CONFIG_IP_SET_HASH_MAC=y CONFIG_IP_SET_HASH_NETPORTNET=y CONFIG_IP_SET_HASH_NET=y CONFIG_IP_SET_HASH_NETNET=y CONFIG_IP_SET_HASH_NETPORT=y CONFIG_IP_SET_HASH_NETIFACE=y CONFIG_IP_SET_LIST_SET=y CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          
          for config in $configs; do
            name=$(echo "$config" | cut -d'=' -f1)
            sed -i -E "s/.*($name=.*)/# \1 is not set/gi" $DEFCONFIG
            echo "$config" >> $DEFCONFIG
          done
          
          cat <<EOF >> $DEFCONFIG
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=n
          CONFIG_KSU_DEBUG=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          EOF
          
          sed -i 's/${LOCALVERSION+set}/set/' scripts/setlocalversion
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"/' $DEFCONFIG
          perl -pi -e "s/build-timestamp = \\$\(or \\$\(KBUILD_BUILD_TIMESTAMP\), \\$\(build-timestamp-auto\)\\)/build-timestamp = \"${{ env.build_date }}\"/" init/Makefile

      - name: Integrate xxKSU
        run: |
          cd sultan
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s -- master

      - name: Build Kernel
        run: |
          cd sultan
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"
          
          make O=out CROSS_COMPILE="${{ env.GCC_PATH }}" CC="${{ env.GCC_PATH }}gcc" zuma_defconfig
          make O=out CROSS_COMPILE="${{ env.GCC_PATH }}" CC="${{ env.GCC_PATH }}gcc" -j$(nproc --all)

      - name: Package AnyKernel3 ZIP
        id: package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/zuma/dts/*.dtb > AK3/dtb
          
          ZIP_NAME="Sultan-zuma-${{ steps.tag.outputs.sultan_tag }}-xxKSU-r${{ steps.ksu.outputs.ksu_ver }}.zip"
          cd AK3
          zip -r9 "../$ZIP_NAME" . -x "*.git*" "README.md"
          
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ env.ZIP_PATH }}
          
  # ===========================================================================
  # JOB 2: Husky Kernel BUILD (Kleaf) with kowsu and susfs 
  # ===========================================================================
  kowsu-gki-susfs:
   runs-on: ubuntu-latest
   name: KowSU | Husky | susfs
   outputs:
      ksu_ver: ${{ steps.ksu_ver.outputs.ksu_ver }}
      zip_name: ${{ steps.package.outputs.zip_name }}
    
   env:
    ANDROID_VERSION: "android14"
    KERNEL_VERSION: "6.1.134"
    build_date: "Tue Jul 8 09:17:32 UTC 2025"
    # Note: SUB_LEVEL might differ for Zuma branch, but we rely on branch name below
    BUILD_CONFIG: "private/google-modules/soc/zuma/build.config.zuma" 
      
   steps:
      # [ADDED] Maximize Disk Space (Crucial for full vendor build)
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            zip ccache curl git wget cpio python3 python3-pip device-tree-compiler \
            kmod dwarves pahole repo openjdk-11-jdk lz4 python3-setuptools \
            openjdk-17-jdk libncurses5-dev

      - name: Install Repo
        run: |
          mkdir -p ./bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo > ./bin/repo
          chmod a+rx ./bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          # Use shusky (includes zuma) - exists and works
          BRANCH="android-gs-shusky-6.1-android16"
          mkdir -p android-kernel
          cd android-kernel
          
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b $BRANCH
          repo sync -c -j$(nproc --all) --no-tags --optimized-fetch --prune
          
          
          echo "kernel_root=$PWD" >> $GITHUB_ENV
          echo "kernel_source=$PWD/aosp" >> $GITHUB_ENV
          echo "kernel_common=$PWD/aosp" >> $GITHUB_ENV
          echo "kernel_device=$PWD/private/devices/google/zuma" >> $GITHUB_ENV  # zuma inside shusky
          
          # Verify zuma targets
          tools/bazel query "//private/devices/google/zuma:*" | grep -E "(dist|Image)" || echo "Targets missing?"

      
      - name: Clone Tools & Patches
        run: |
          cd ${{ env.kernel_root }}
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "gki-2.0" AnyKernel3
          git clone --depth=1 https://github.com/TheSillyOk/kernel_ls_patches ok_patches
          git clone --depth=1 https://github.com/yapixel/kernel_patches yapixel_patches
          
          SUSFS_BRANCH="gki-android14-6.1"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          git clone --depth=1 https://github.com/TheSillyOk/sh sh

      - name: Apply GKI Optimization Patches
        run: |
          cd ${{ env.kernel_common }}
          YP_DIR="${{ env.kernel_root }}/yapixel_patches/common"
          
          # Note: Some GKI patches might conflict with Vendor source. Apply with caution.
          patch -p1 --forward < "$YP_DIR/optimized_mem_operations.patch" || true
          patch -p1 --forward < "$YP_DIR/file_struct_8bytes_align.patch" || true
          patch -p1 --forward < "$YP_DIR/reduce_cache_pressure.patch" || true

      - name: Setup KowSU
        run: |
          cd ${{ env.kernel_common }}
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s  master

      - name: Get KowSU Version
        id: ksu_ver
        run: |
          cd ${{ env.kernel_root }}
          KSU_VER=$(./sh/get_ksuver.sh "KOWX712" "KernelSU" "master" || echo "unknown")
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "ksu_ver=$KSU_VER" >> $GITHUB_OUTPUT

      - name: Configure GKI Fragment
        run: |
          cd ${{ env.kernel_common }}
          # We write to gki_fragment, but for zuma_dist we might need to 
          # append this to the actual device config or ensure fragment is applied.
          # Kleaf usually respects GKI_CONFIG_FRAGMENT in build config.
          
          cat > gki_fragment.config << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KRETPROBES_SUCOMPAT=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=n
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF
          
      - name: Set Local Version
        run: |
          cd ${{ env.kernel_common }}
          sed -i 's/${LOCALVERSION+set}/set/' scripts/setlocalversion
          echo "CONFIG_LOCALVERSION"="-android14-11-g66e758f7d0c0-ab13748739" >> gki_fragment.config
          perl -pi -e "s/build-timestamp = \\$\(or \\$\(KBUILD_BUILD_TIMESTAMP\), \\$\(build-timestamp-auto\)\\)/build-timestamp = \"${{ env.build_date }}\"/" init/Makefile
          
          

      - name: Apply SUSFS Patches
        run: |
          cd ${{ env.kernel_common }}
          echo "Applying core SUSFS patches..."
          cp ../yapixel_patches/kowsu/50_add_susfs_in_gki-android14-6.1.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 --forward < 50_add_susfs_in_gki-android14-6.1.patch || true

          echo "Apply fix patch"
          cp ../yapixel_patches/sultan/base.c_fix.patch ./
          patch -p1 --forward < base.c_fix.patch
          
          # Apply KSU integration patches
          cd ./KernelSU
          cp ../../yapixel_patches/kowsu/10_enable_susfs_for_ksu.patch ./
          patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true

      - name: Build with Official Script
        env:
         KBUILD_BUILD_USER: kleaf
         KBUILD_BUILD_HOST: build-host
        run: |
         cd ${{ env.kernel_root }}
    
         # Set environment variables
         export BUILD_AOSP_KERNEL=1
         export GKI_KERNEL_FRAGMENT="${{ env.kernel_common }}/gki_fragment.config"
         export LTO=thin
    
         echo "Building with config fragment: $GKI_KERNEL_FRAGMENT"
    
         ./build_shusky.sh
    
         echo "=== Build Complete ==="

      - name: Package
        id: package
        run: |
         cd ${{ env.kernel_root }}
    
         # Images are in out/shusky/dist/
         cp out/shusky/dist/Image.lz4 AnyKernel3/Image || \
         cp out/shusky/dist/Image AnyKernel3/Image
    
         ZIP_NAME="GKI-${{ env.KERNEL_VERSION }}-KowSU-r${{ env.KSU_VER }}-susfs.zip"
    
         cd AnyKernel3
         zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x "*.git*" "README.md"
    
         echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
         echo "ZIP_PATH=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> $GITHUB_ENV
         echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
         
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

 
  release:
   needs: [xxksu-sultan, kowsu-gki-susfs]
   runs-on: ubuntu-latest
   permissions:
      contents: write
   steps:
      - name: Download Sultan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.xxksu-sultan.outputs.zip_name }}
          path: ./artifacts

      - name: Download GKI Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.kowsu-gki-susfs.outputs.zip_name }}
          path: ./artifacts

      - name: Create Release Tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
         TAG=$(date +"%Y.%m.%d")

         # Get the latest existing tag (if any)
         LATEST=$(gh api "repos/${{ github.repository }}/tags" \
              --jq '.[0].name' 2>/dev/null || echo "")

         # If today already has a release, increment -r1, -r2, ...
         if [[ "$LATEST" == "$TAG"* ]]; then
         REV=$(echo "$LATEST" | grep -o 'r[0-9]*' | tr -d 'r')
         REV=$((REV + 1))
         TAG="${TAG}-r${REV}"
         else
         TAG="${TAG}-r1"
         fi

         echo "Creating tag: $TAG"

         # Create the tag via GitHub API (no local git needed)
         gh api "repos/${{ github.repository }}/git/refs" \
         -X POST \
         -f ref="refs/tags/$TAG" \
         -f sha="${{ github.sha }}"

         echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
         tag_name: ${{ env.TAG }}
         name: Husky Kernel Build - ${{ env.TAG }}
         body: |
          **Kernel Build**
          - **Manager**: [backslashxx/KernelSU](https://github.com/backslashxx/KernelSU)
          - **Date**: ${{ env.TAG }}
      
          Contains both **GKI (Kleaf)** and **Sultan (GCC)** variants.
         files: |
          artifacts/**/*.zip
