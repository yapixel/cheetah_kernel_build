name: Sultan Kernel Build 

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      repo:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string

jobs:
  build:
    name: Sultan-${{ inputs.codename }}
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_URL: >-
        https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/13.3.0/x86_64-gcc-13.3.0-nolibc-aarch64-linux.tar.gz
      TOOLCHAIN_TAR: gcc.tar.gz
      TOOLCHAIN_DIR: gcc-13.3.0-nolibc

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache wget git zip

      - name: Setup ccache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Download GCC toolchain
        run: |
          wget -O "$TOOLCHAIN_TAR" "$TOOLCHAIN_URL"
          gunzip "$TOOLCHAIN_TAR"
          tar -xf "${TOOLCHAIN_TAR%.gz}"

      - name: Set CONFIG
        run: |
          CONFIG="${{ inputs.repo }}"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Clone repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://github.com/TheWildJames/AnyKernel3.git -b "sultan-${{ inputs.codename }}"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "gki-android14-6.1"
          git clone https://github.com/yapixel/kernel_patches.git
          git clone https://github.com/kerneltoast/${{ inputs.repo }} "$CONFIG"
          git clone https://github.com/KOWX712/files.git kowsu_patches

      - name: Add KernelSU
        run: |
          cd $CONFIG
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s master

      - name: Apply SUSFS & KowSU patches
        run: |
          cd $CONFIG
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch .
          patch -p1 -F 3 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cd KernelSU
          cp ../../kowsu_patches/KowSU/revert_commit_conflict_with_susfs.patch .
          patch -p1 --fuzz=3 < revert_commit_conflict_with_susfs.patch || exit 1
          cp ../../kowsu_patches/KowSU/enable_susfs_for_kowsu.patch .
          patch -p1 < enable_susfs_for_kowsu.patch || exit 1
          cd ..
          cp ../kernel_patches/sultan/sys.c_fix.patch .
          patch -p1 --fuzz=3 < sys.c_fix.patch || exit 1

      - name: Apply manual syscall hook
        run: |
          cd $CONFIG
          cp ../kernel_patches/syscall_hook/min_scope_syscall_hooks_v1.5.patch .
          patch -p1 --forward < min_scope_syscall_hooks_v1.5.patch || exit 1

      - name: Compute KernelSU version
        run: |
          cd "$CONFIG/KernelSU/kernel"
          BASE=10200
          COUNT=$(git rev-list --count HEAD)
          KSUVER=$(( BASE + COUNT ))
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV

      - name: Add SUSFS config
        env:
          CODENAME: ${{ inputs.codename }}
        run: |
          cd "$CONFIG"
          cat << 'EOF' >> ./arch/arm64/configs/${CODENAME}_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=n
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF

      - name: Fix localversion & timestamp
        run: |
          cd "$CONFIG"
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"/' \
            ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          sed -i 's/${LOCALVERSION+set}/set/' ./scripts/setlocalversion
          perl -pi -e 's/build-timestamp = .*/build-timestamp = "Tue Jul 8 09:17:32 UTC 2025"/' ./init/Makefile

      - name: Build kernel
        env:
          CROSS_COMPILE: ${{ github.workspace }}/${{ env.TOOLCHAIN_DIR }}/aarch64-linux/bin/aarch64-linux-
          CC: ${{ github.workspace }}/${{ env.TOOLCHAIN_DIR }}/aarch64-linux/bin/aarch64-linux-gcc
        run: |
          cd $CONFIG
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"
          if [[ "${{ inputs.codename }}" == "zumapro" ]]; then
            export KCFLAGS="-march=armv8.6-a -O3 --param=min-pagesize=0"
          fi
          make O=out ${{ inputs.codename }}_defconfig -j$(nproc)
          make O=out CROSS_COMPILE="ccache $CROSS_COMPILE" CC="ccache $CC" V=1 -j$(nproc)

      - name: Copy Image & DTB
        run: |
          cd $CONFIG
          cp out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          case "${{ inputs.codename }}" in
            gs201) DTB_DIR="google-devices/gs201/dts" ;;
            zuma)  DTB_DIR="google-devices/zuma/dts" ;;
            zumapro) DTB_DIR="google-devices/zumapro/dts" ;;
            *) echo "Unknown codename"; exit 1 ;;
          esac
          cat out/$DTB_DIR/*.dtb > ../AnyKernel3/dtb

      - name: Get latest Sultan tag
        id: tag
        run: |
          TAG=$(git ls-remote --tags https://github.com/kerneltoast/${{ inputs.repo }}.git \
                | awk -F'/' '{print $3}' | grep -E '^[0-9]+' | sort -V | tail -n1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Package ZIP
        run: |
          cd AnyKernel3
          ZIP="KowSU-${{ env.KSUVER }}-${{ inputs.codename }}_Sultan-${{ steps.tag.outputs.tag }}_SUSFS.zip"
          zip -r9 "../$ZIP" ./*
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-sultan-kowsu
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: ccache stats
        run: ccache -s
