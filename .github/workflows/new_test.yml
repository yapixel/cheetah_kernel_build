name: Build Husky A16 Kernel Sultan hookless

on:
  workflow_dispatch:
  

jobs:
  xxksu-sultan:
    runs-on: ubuntu-latest
    name: xxKSU | Sultan GCC
    outputs:
      sultan_tag: ${{ steps.tag.outputs.sultan_tag }}
      ksu_ver: ${{ steps.ksu.outputs.ksu_ver }}
      zip_name: ${{ steps.package.outputs.zip_name }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    env:
      KERNEL_CODENAME: "zuma"
      KERNEL_VERSION: "6.1.134"
      build_date: "Tue Jul 8 09:17:32 UTC 2025"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GCC 13.3.0
        run: |
          wget -q https://kernel.org/pub/tools/crosstool/files/bin/x86_64/13.3.0/x86_64-gcc-13.3.0-nolibc-aarch64-linux.tar.gz -O gcc.tar.gz
          tar -xf gcc.tar.gz
          echo "GCC_PATH=$PWD/gcc-13.3.0-nolibc/aarch64-linux/bin/aarch64-linux-" >> $GITHUB_ENV

      - name: Clone Source & Dependencies
        run: |
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_zuma -b 16.0.0-sultan sultan
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "sultan-zuma" AK3
          git clone --depth=1 https://github.com/TheSillyOk/kernel_ls_patches ok_patches
          git clone --depth=1 https://github.com/yapixel/kernel_patches yapixel_patches
          git clone --depth=1 https://github.com/TheSillyOk/sh sh
          git clone --depth=1 https://github.com/maxsteeel/nomount -b experimental nomount

      - name: Get latest Sultan tag
        id: tag
        run: |
          cd sultan
          SULTAN_TAG=$(git tag --sort=-committerdate | head -n1)
          if [ -z "$SULTAN_TAG" ]; then
            echo "Error: No tags found in sultan repo!"
            exit 1
          fi
          echo "Latest Sultan tag: $SULTAN_TAG"
          echo "sultan_tag=$SULTAN_TAG" >> $GITHUB_OUTPUT

      - name: Get xxKSU Version
        id: ksu
        run: |
          KSU_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "master" || echo "unknown")
          echo "xxKSU version: r$KSU_VER"
          echo "ksu_ver=$KSU_VER" >> $GITHUB_OUTPUT

      - name: Setup Configs
        run: |
          cd sultan
          
          DEFCONFIG="arch/arm64/configs/zuma_defconfig"
          
          configs="CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y CONFIG_IP_NF_TARGET_TTL=y CONFIG_IP6_NF_TARGET_HL=y CONFIG_IP6_NF_MATCH_HL=y CONFIG_TCP_CONG_ADVANCED=y CONFIG_TCP_CONG_BBR=y CONFIG_NET_SCH_FQ=y CONFIG_TCP_CONG_BIC=n CONFIG_TCP_CONG_WESTWOOD=n CONFIG_TCP_CONG_HTCP=n CONFIG_DEFAULT_BBR=y CONFIG_BPF_STREAM_PARSER=y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y CONFIG_NETFILTER_XT_SET=y CONFIG_IP_SET=y CONFIG_IP_SET_MAX=65534 CONFIG_IP_SET_BITMAP_IP=y CONFIG_IP_SET_BITMAP_IPMAC=y CONFIG_IP_SET_BITMAP_PORT=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_IPMARK=y CONFIG_IP_SET_HASH_IPPORT=y CONFIG_IP_SET_HASH_IPPORTIP=y CONFIG_IP_SET_HASH_IPPORTNET=y CONFIG_IP_SET_HASH_IPMAC=y CONFIG_IP_SET_HASH_MAC=y CONFIG_IP_SET_HASH_NETPORTNET=y CONFIG_IP_SET_HASH_NET=y CONFIG_IP_SET_HASH_NETNET=y CONFIG_IP_SET_HASH_NETPORT=y CONFIG_IP_SET_HASH_NETIFACE=y CONFIG_IP_SET_LIST_SET=y CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          
          for config in $configs; do
            name=$(echo "$config" | cut -d'=' -f1)
            sed -i -E "s/.*($name=.*)/# \1 is not set/gi" $DEFCONFIG
            echo "$config" >> $DEFCONFIG
          done
          
          cat <<EOF >> $DEFCONFIG
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=n
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y 
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          EOF
          
          sed -i 's/${LOCALVERSION+set}/set/' scripts/setlocalversion
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-android14-11-g66e758f7d0c0-ab13748739"/' $DEFCONFIG
          perl -pi -e "s/build-timestamp = \\$\(or \\$\(KBUILD_BUILD_TIMESTAMP\), \\$\(build-timestamp-auto\)\\)/build-timestamp = \"${{ env.build_date }}\"/" init/Makefile

      - name: Integrate xxKSU
        run: |
          cd sultan
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s -- master
      
          
      - name: Build Kernel
        run: |
         cd sultan
         export KBUILD_BUILD_USER="build-user"
         export KBUILD_BUILD_HOST="build-host"
    
         make O=out CROSS_COMPILE="${{ env.GCC_PATH }}" CC="${{ env.GCC_PATH }}gcc" zuma_defconfig
         make O=out CROSS_COMPILE="${{ env.GCC_PATH }}" CC="${{ env.GCC_PATH }}gcc" \
         -j$(nproc --all)

      - name: Package AnyKernel3 ZIP
        id: package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/zuma/dts/*.dtb > AK3/dtb
          
          ZIP_NAME="Sultan-zuma-${{ steps.tag.outputs.sultan_tag }}-xxKSU-r${{ steps.ksu.outputs.ksu_ver }}.zip"
          ARTIFACT_NAME="Sultan-zuma-${{ steps.tag.outputs.sultan_tag }}-xxKSU-r${{ steps.ksu.outputs.ksu_ver }}"
          
          cd AK3
          zip -r9 "../$ZIP_NAME" . -x "*.git*" "README.md"
          
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ env.ZIP_PATH }}

      - name: Upload Kernel Config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}-config
          path: sultan/out/.config

 
  release:
   needs: [xxksu-sultan]
   runs-on: ubuntu-latest
   permissions:
      contents: write
   steps:
      - name: Download Sultan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.xxksu-sultan.outputs.artifact_name }}
          path: ./artifacts
          
      - name: Create Release Tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
         BASE_TAG=$(date +"%Y.%m.%d")
         
         # Find all tags matching today's date
         ALL_TAGS=$(gh api "repos/${{ github.repository }}/tags" \
              --jq '.[].name' 2>/dev/null || echo "")
         
         # Find the highest revision number for today
         MAX_REV=0
         while IFS= read -r tag; do
           if [[ "$tag" == "$BASE_TAG-r"* ]]; then
             REV=$(echo "$tag" | grep -o 'r[0-9]*' | sed 's/r//')
             if [ "$REV" -gt "$MAX_REV" ]; then
               MAX_REV=$REV
             fi
           fi
         done <<< "$ALL_TAGS"
         
         # Increment to next revision
         NEXT_REV=$((MAX_REV + 1))
         TAG="${BASE_TAG}-r${NEXT_REV}"
         
         echo "Creating tag: $TAG (previous max revision was r${MAX_REV})"
         
         # Create the tag via GitHub API
         gh api "repos/${{ github.repository }}/git/refs" \
         -X POST \
         -f ref="refs/tags/$TAG" \
         -f sha="${{ github.sha }}" || {
           echo "Tag creation failed - tag might already exist"
           exit 1
         }
         
         echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
         tag_name: ${{ env.TAG }}
         name: Husky Kernel Build - ${{ env.TAG }}
         body: |
          **Kernel Build**
          - **Manager**: [backslashxx/KernelSU](https://github.com/backslashxx/KernelSU)
          - **Date**: ${{ env.TAG }}
      
          Contains **Sultan (GCC)** variant with xxKSU.
         files: |
          artifacts/**/*.zip
